    if (els.filterOkButton) {
      els.filterOkButton.addEventListener('click', () => {
        if (!state.filterDraft) return;
        const { columnIndex, condition, allValues } = state.filterDraft;
        let effectiveSelected = state.filterDraft.selectedValues;

        // Eğer değer arama kutusu doluysa, sadece görünür (eşleşen) değerleri kullan
        const searchTerm = String(els.filterSearchInput?.value || '');
        if (searchTerm) {
          const visibleRaws = allValues
            .filter(item => foldMatch(item.label, searchTerm))
            .map(item => item.raw);
          // Görünür + işaretli olanları al; hiçbiri işaretli değilse tüm görünürleri kullan
          const visibleChecked = visibleRaws.filter(v => effectiveSelected.has(v));
          effectiveSelected = new Set(visibleChecked.length > 0 ? visibleChecked : visibleRaws);
        }

        const normalizedValues = Array.from(effectiveSelected);
        state.filterConfigs[columnIndex] = {
          condition: condition || 'none',
          valueTerm: (state.filterDraft.valueTerm || '').trim(),
          condition2: state.filterDraft.condition2 || 'none',
          valueTerm2: (state.filterDraft.valueTerm2 || '').trim(),
          operator: state.filterDraft.operator || 'and',
          values: normalizedValues.length === allValues.length ? null : normalizedValues
        };
        applyAllColumnFilters();
        closeColumnMenu();
      });
    }

    document.addEventListener('click', event => {
      if (!els.columnMenu?.classList.contains('is-open')) return;
      if (event.target.closest('#dt-column-menu')) return;
      // T2: menü başlık mousedown'ında açılır; aynı hareketin click'i (220 ms'den uzun basılı tutulsa da) kapatmasın
      if (isHeaderMenuTriggerTarget(event.target) && getHeaderCoordsFromEventTarget(event.target)) return;
      if (Date.now() - (state.columnMenuOpenedAt || 0) < 220) return;
      closeColumnMenu();
    });

    document.addEventListener('click', event => {
      if (!els.toolbarMoreMenu?.classList.contains('is-open')) return;
      if (event.target.closest('#dt-toolbar-more-wrap')) return;
      if (Date.now() - (state.toolbarMoreOpenedAt || 0) < 180) return;
      closeToolbarMoreMenu();
    });

    // Escape: en üstteki açık katmanı kapat (filtre → sıralama → kolon menüsü → daha fazla → tarih modalı → wake modalı)
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      let closed = false;
      if (state.fieldPop) {   // mr18: the New field popover is the topmost layer (its own keydown handles Esc when focused inside)
        closeFieldPopover(false);
        closed = true;
      } else if (els.filterPanel?.classList.contains('is-open')) {
        hideFilterPanel();
        closed = true;
      } else if (els.sortPanel?.classList.contains('is-open')) {
        hideSortPanel();
        closed = true;
      } else if (els.columnMenu?.classList.contains('is-open')) {
        closeColumnMenu();
        closed = true;
      } else if (els.toolbarMoreMenu?.classList.contains('is-open')) {
        closeToolbarMoreMenu();
        closed = true;
      } else if (els.ddModal && els.ddModal.getAttribute('aria-hidden') === 'false') {
        closeFieldConfigModal();
        closed = true;
      } else if (els.wrapper && els.wrapper.querySelector('.dt-wake-backdrop')) {
        closeWakeModal();
        closed = true;
      }
      if (closed) event.stopPropagation();
    });

    if (els.columnMenu) {
      els.columnMenu.addEventListener('mousedown', event => event.stopPropagation());
      els.columnMenu.addEventListener('click', event => event.stopPropagation());
    }

    if (els.menuBackdrop) {
      els.menuBackdrop.addEventListener('click', closeTopMostMenu);
    }

    setupSheetDismiss(els.filterPanel, hideFilterPanel);
    setupSheetDismiss(els.sortPanel, hideSortPanel);
    setupSheetDismiss(els.columnMenu, closeColumnMenu);

    // Panel içeriği büyüyünce (koşul seçilince 2. koşul satırı açılır, değer listesi dolar)
    // yeniden konumlan; böylece alt kenar ekran dışına çıkmaz.
    if (typeof ResizeObserver === 'function') {
      const repositionIfOpen = (panelEl, triggerEl) => {
        if (!panelEl || isMobileViewport() || !panelEl.classList.contains('is-open')) return;
        if (panelEl.style.visibility === 'hidden') return;
        positionSubmenu(panelEl, triggerEl);
      };
      if (els.filterPanel) {
        new ResizeObserver(() => repositionIfOpen(els.filterPanel, els.columnMenuFilterButton)).observe(els.filterPanel);
      }
      if (els.sortPanel) {
        new ResizeObserver(() => repositionIfOpen(els.sortPanel, els.columnMenuSortButton)).observe(els.sortPanel);
      }
    }

    if (els.wrapper && els.wrapper.dataset.mobileHeaderTapAttached !== 'true') {
      let touchStart = null;

      els.wrapper.addEventListener('touchstart', event => {
        if (!isMobileViewport()) return;
        const target = event.target;
        if (!isHeaderMenuTriggerTarget(target)) return;
        const mapped = getHeaderCoordsFromEventTarget(target);
        if (!mapped) return;
        const touch = event.touches?.[0];
        if (!touch) return;
        touchStart = {
          x: touch.clientX,
          y: touch.clientY,
          col: mapped.coords.col,
          rect: mapped.headerCell.getBoundingClientRect(), cell: mapped.headerCell,
          label: getColumnAt(mapped.coords.col)?.header || ''
        };
        if (typeof event.preventDefault === 'function') event.preventDefault();
        if (typeof event.stopPropagation === 'function') event.stopPropagation();
      }, { passive: false });

      els.wrapper.addEventListener('touchend', event => {
        if (!isMobileViewport() || !touchStart) return;
        const touch = event.changedTouches?.[0];
        if (!touch) {
          touchStart = null;
          return;
        }
        const moved = Math.hypot(touch.clientX - touchStart.x, touch.clientY - touchStart.y);
        if (moved > 10) {
          touchStart = null;
          return;
        }
        openColumnMenu(touchStart.col, touchStart.rect, touchStart.label, touchStart.cell);
        touchStart = null;
        if (typeof event.preventDefault === 'function') event.preventDefault();
        if (typeof event.stopPropagation === 'function') event.stopPropagation();
      }, { passive: false });

      els.wrapper.dataset.mobileHeaderTapAttached = 'true';
    }

    window.addEventListener('resize', () => {
      closeColumnMenu();
    });

    // Alt paneller viewport'a sabit (fixed), menü ise tabloya göre konumlu: sayfa/tablo kaydırılınca
    // açık alt panel menüye göre yeniden konumlanır (frame başına bir). Menü yalnız bağlı olduğu
    // başlık hücresi sarmalayıcının görünür alanından çıkınca kapanır (panel içi kaydırma hariç).
    const anchoredHeaderVisible = () => {
      if (!state.hot || !els.wrapper || !els.container || !Number.isInteger(state.activeHeaderColumn)) return true;
      let visualCol = state.activeHeaderColumn;
      try {
        if (typeof state.hot.toVisualColumn === 'function') {
          const v = state.hot.toVisualColumn(state.activeHeaderColumn);
          if (v === null || v === undefined || v < 0) return false;
          visualCol = v;
        }
      } catch (e) {}
      const ths = els.container.querySelectorAll('.ht_clone_top thead th');
      let th = null;
      for (let i = 0; i < ths.length; i += 1) {
        try {
          const c = state.hot.getCoords(ths[i]);
          if (c && c.row === -1 && c.col === visualCol) { th = ths[i]; break; }
        } catch (e) {}
      }
      if (!th) return false; // sanallaştırma başlığı çizmiyor → görünür değil
      const r = th.getBoundingClientRect();
      const w = els.wrapper.getBoundingClientRect();
      return r.right > w.left && r.left < w.right && r.bottom > w.top && r.top < w.bottom;
    };

    window.addEventListener('scroll', event => {
      if (isMobileViewport()) return;
      if (!els.columnMenu?.classList.contains('is-open')) return;
      const filterOpen = els.filterPanel?.classList.contains('is-open');
      const sortOpen = els.sortPanel?.classList.contains('is-open');
      if (!filterOpen && !sortOpen) return;
      const target = event.target;
      if (target && target.nodeType === 1 && typeof target.closest === 'function' && target.closest('#dt-column-menu')) return;
      if (state._scrollRaf) return;
      state._scrollRaf = requestAnimationFrame(() => {
        state._scrollRaf = null;
        if (!els.columnMenu?.classList.contains('is-open')) return;
        if (!anchoredHeaderVisible()) {
          closeColumnMenu();
          return;
        }
        if (els.filterPanel?.classList.contains('is-open')) {
          positionSubmenu(els.filterPanel, els.columnMenuFilterButton);
        } else if (els.sortPanel?.classList.contains('is-open')) {
          positionSubmenu(els.sortPanel, els.columnMenuSortButton);
        }
      });
    }, true);

    // ── Due Date Sort button ─────────────────────────────────────────────────
    if (els.dueDateButton) {
      els.dueDateButton.addEventListener('click', () => {
        if (els.dueDateWrap && els.dueDateWrap.classList.contains('is-open')) {
          closeDueDatePanel();
          state.dueDateSort.active = false;
          applyDueDateSort();
          publishDueDateSortConfig();
          publishTableConfig();
        } else {
          if (state.dueDateSort.fields.length === 0) {
            openDueDatePanel();
            openFieldConfigModal();
          } else {
            openDueDatePanel();
            state.dueDateSort.active = true;
            applyDueDateSort();
            publishDueDateSortConfig();
            publishTableConfig();
          }
        }
      });
    }

    if (els.dueDateConfigureButton) {
      els.dueDateConfigureButton.addEventListener('click', openFieldConfigModal);
    }

    if (els.dueDateClearButton) {
      els.dueDateClearButton.addEventListener('click', () => {
        state.dueDateSort.active = false;
        closeDueDatePanel();
        applyDueDateSort();
        publishDueDateSortConfig();
        publishTableConfig();
      });
    }

    if (els.ddModalClose) els.ddModalClose.addEventListener('click', closeFieldConfigModal);
    if (els.ddModalCancel) els.ddModalCancel.addEventListener('click', closeFieldConfigModal);

    // Arama kutusu: listeyi anlık filtrele, draft korunur
    if (els.ddFieldSearch) {
      els.ddFieldSearch.addEventListener('input', () => {
        renderDueDateFieldList(els.ddFieldSearch.value.trim());
      });
    }

    // Checkbox değişimlerini draft'a yansıt
    if (els.ddFieldList) {
      els.ddFieldList.addEventListener('change', event => {
        const cb = event.target.closest('.dt-dd-field-cb');
        if (!cb || !state.ddModalDraft) return;
        const key = cb.getAttribute('data-key') || '';
        if (!key) return;
        if (cb.checked) state.ddModalDraft.add(key);
        else state.ddModalDraft.delete(key);
      });
    }

    if (els.ddModalOk) {
      els.ddModalOk.addEventListener('click', () => {
        // Draft'taki seçimi uygula (arama görmeseler de tüm seçimler korunmuş)
        const fields = state.ddModalDraft ? Array.from(state.ddModalDraft) : [];
        state.dueDateSort.fields = fields;
        state.ddModalDraft = null;
        closeFieldConfigModal();
        if (fields.length > 0) {
          state.dueDateSort.active = true;
          openDueDatePanel();
        } else {
          state.dueDateSort.active = false;
          closeDueDatePanel();

        applyDueDateSort();
        publishDueDateSortConfig();
        publishTableConfig();

    if (els.ddBackdrop) {
      els.ddBackdrop.addEventListener('click', closeFieldConfigModal);
    }
    // ── End Due Date Sort ────────────────────────────────────────────────────

  window.dynamicTable = {
    setTableData,
    refreshTable,
    reloadFromConfig,
    clearSelection,
    getSelectedUniqueIds,
    publishSelectedUniqueIds,
    setDueDateSortConfig,
    getDueDateSortConfig,
    setColumnOrder,
    getColumnOrder,
    start,
    edit,
    save,
    create,
    import: importData,
    export: exportData,
    addField,
    manageField,
    delete: deleteSelected,
    wakeResult,        // Bubble: dynamicTable.wakeResult(true|false, 'mesaj') — butonu serbest bırakır + toast
    wake: onWakeClick, // programatik uyandırma (modal akışıyla)
    setAssistant,      // Bubble: dynamicTable.setAssistant({assistant_id,agent_name,data_flow_rules,agent})
    refresh: refreshAssistant  // Bubble: ekran değişti sinyali (veri taşımaz) → asistanı taze oku
  };

  window.setTableData = setTableData;
  window.refreshTable = refreshTable;
  window.clearSelection = clearSelection;
  window.getSelectedUniqueIds = getSelectedUniqueIds;
  window.publishSelectedUniqueIds = publishSelectedUniqueIds;
  window.setColumnOrder = setColumnOrder;
  window.getColumnOrder = getColumnOrder;
  window.reloadFromConfig = reloadFromConfig;
  window.setDueDateSortConfig = setDueDateSortConfig;
  window.getDueDateSortConfig = getDueDateSortConfig;
  window.start = start;
  window.edit = edit;
  window.save = save;
  window.create = create;
  window.importData = importData;
  window.exportData = exportData;
  window.addField = addField;
  window.manageField = manageField;
  window.deleteSelected = deleteSelected;
  window.wakeResult = wakeResult;
  window.setTableAssistant = setAssistant;
  window.refreshTableAssistant = refreshAssistant;

  attachActionButtons();
  updateDeleteButtonVisibility();
  syncButtonTitles();
  void ensureHandsontableReady();
  autoInitialize();
  // Asistan bağlamı (assistant_id) Bubble tarafında GEÇ render olabilir (form/group sonradan
  // basılır). Tablo config'i hazır olmadan da butonu doğru göstermek için ilk çözümü hemen yap,
  // sonra birkaç gecikmeli yeniden-çözüm ile (DOM/window güncellenmişse) butonu tazele.
  try { applyWakeConfig(state.wake._lastConfig || {}); } catch (e) {}
  // Geç gelen kaynak için kısa polling — window.BUBBLE_INPUTS (form elementi) veya DOM elementi
  // tablo init'inden SONRA gelebilir.
  startAssistantPoll(20);   // 20 × 500ms ≈ 10sn

  // ── Asistan elementi (data-assistant-id) geç render gözlemcisi ───────────────
  // Bubble, attribute'lu elementi (görünür olmasa bile) sayfa yüklenince/koşulla SONRADAN
  // basabilir → init + sabit timer'lar kaçırabilir. Kalıcı bir gözlemci [data-assistant-id]
  // DOM'a girince/değişince butonu tazeler. Asistan bulununca VEYA 60sn sonra durur
  // (Handsontable DOM gürültüsünde boşa çalışmamak için debounce + erken disconnect).
  (function () {
    if (state.wake.hasAgent) return;          // zaten bulundu → gözlemciye gerek yok
    if (typeof MutationObserver !== 'function') return;
    var deb = null, obs = null, stopped = false;
    var stop = function () { if (stopped) return; stopped = true; if (deb) clearTimeout(deb); if (obs) { try { obs.disconnect(); } catch (e) {} } };
    var resolve = function () {
      try { applyWakeConfig(state.wake._lastConfig || {}); } catch (e) {}
      if (state.wake.hasAgent) stop();        // bulundu → gözlemciyi kapat
    };
    obs = new MutationObserver(function (muts) {
      var hit = false;
      for (var i = 0; i < muts.length; i++) {
        var m = muts[i];
        if (m.type === 'attributes') { hit = true; break; }   // attributeFilter zaten data-assistant-id
        if (m.type === 'childList') {
          for (var a = 0; a < m.addedNodes.length; a++) {
            var nd = m.addedNodes[a];
            if (nd && nd.nodeType === 1 &&
                (nd.hasAttribute && nd.hasAttribute('data-assistant-id') ||
                 (nd.querySelector && nd.querySelector('[data-assistant-id], #gaia-assistant-id, #assistant_id, #gaia-assistant-config')))) {
              hit = true; break;
            }
          }
          if (hit) break;
        }
      }
      if (!hit) return;
      if (deb) clearTimeout(deb);
      deb = setTimeout(resolve, 150);
    });
    try {
      obs.observe(document.documentElement, {
        subtree: true, childList: true, attributes: true,
        attributeFilter: ['data-assistant-id']
      });
    } catch (e) { log('wake: observer kurulamadı', e); return; }
    setTimeout(stop, 60000);                   // güvenlik: 60sn sonra bırak
  })();
})();
</script>
