  // ── WAKE AGENT — manuel uyandırma ──────────────────────────────────────────
  // BİRİNCİL AKIŞ (manage_trigger köprüsü — Architect elementi aynı sayfadaysa):
  //   buton → (gerekirse soru modalı) → gaiaTriggerManager.manageTrigger('wake_agent',
  //   {agent config + wake_mode}) → bubble_fn_manage_trigger → plugin /platform-ops →
  //   server.js anında ack + ajanı arka planda koşturur → onTriggerResponse →
  //   window._wakeAgentCallback → buton serbest + toast. Yeni workflow GEREKMEZ.
  // FALLBACK (köprü yoksa): bubble_fn_wake_agent(JSON) → kullanıcı kurar:
  //   run-agent plugin çağrısı wake_source="manual" (+ payload'daki mode → wake_mode).
  // Konfig (bubble-table-config JSON, hepsi opsiyonel):
  //   wake_button: false        → butonu tamamen gizle
  //   data_flow_rules: "<json>" → agent'ın DFR'ı; manual_wake.{enabled,mode} buradan okunur
  //   agent_name: "Mail Bot"    → kopya metinlerinde agent adı
  //   agent: { system_message, tools_list, json_schema, model, effort, tool_choice,
  //            configuration_notes_to_myself, assistant_id, sheet?, stage_id?, list_id?,
  //            organisation_id? } → köprü akışında server'a giden agent config'i.
  //            (sheet/stage/list/org boşsa plugin sayfa property'lerinden merge eder.)
  // Bubble geri bildirimi (opsiyonel): window.dynamicTable.wakeResult(true|false, 'mesaj')

  const WAKE_MODE_COPY = {
    update_known:  'Updates the records here.',
    create_new:    'Adds one new record.',
    bulk_create:   'Adds one record per item found.',
    find_update:   'Finds and updates matching records.',
    external_only: 'Runs without changing this table.'
  };

  // Update ailesi → Yol A (run_list / object_id). Diğerleri → Yol B (fireWake / wake_agent).
  const WAKE_UPDATE_MODES = { update_known: 1, find_update: 1, update: 1 };
  function isWakeUpdateMode(mode) { return !!WAKE_UPDATE_MODES[mode]; }

  // #bubble-options (PB/Architect elementi, aynı sayfa) → kayıtlı DFR.manual_wake.mode.
  // window._gadManualWake henüz set değilse (PB hydrate gecikti/başarısız) SON ÇARE. String içi
  // süslü parantezleri atlayan dengeli-{} tarayıcı (bubble-options = JSON + arkasında JS kodu).
  function _readBubbleOptionsManualMode() {
    try {
      var el = document.getElementById('bubble-options');
      var raw = el ? (el.textContent || el.innerHTML || '') : '';
      if (!raw) return '';
      var s = raw.indexOf('{');
      if (s < 0) return '';
      var depth = 0, inStr = false, esc = false, end = -1;
      for (var i = s; i < raw.length; i++) {
        var ch = raw[i];
        if (esc) { esc = false; continue; }
        if (ch === '\\') { esc = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === '{') depth++;
        else if (ch === '}') { depth--; if (depth === 0) { end = i; break; } }
      }
      if (end < 0) return '';
      var json = JSON.parse(raw.slice(s, end + 1));
      var dfr = json && json.data_flow_rules;
      if (typeof dfr === 'string') dfr = JSON.parse(dfr);
      return (dfr && dfr.manual_wake && dfr.manual_wake.mode) ? String(dfr.manual_wake.mode).trim() : '';
    } catch (e) { return ''; }
  }

  // #bubble-options top-level stage_id/list_id — P0-2 köprü-yolu rescue kaynağı.
  // Aynı dengeli-{} tarayıcıyı kullanır (bubble-options = JSON + arkasında JS kodu).
  // Birincil kaynak PB globalleri (__GAD_STAGE_ID__); bu yalnız onlar boşsa son çare.
  function _readBubbleOptionsStageList() {
    try {
      var el = document.getElementById('bubble-options');
      var raw = el ? (el.textContent || el.innerHTML || '') : '';
      if (!raw) return { stage_id: '', list_id: '' };
      var s = raw.indexOf('{');
      if (s < 0) return { stage_id: '', list_id: '' };
      var depth = 0, inStr = false, esc = false, end = -1;
      for (var i = s; i < raw.length; i++) {
        var ch = raw[i];
        if (esc) { esc = false; continue; }
        if (ch === '\\') { esc = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === '{') depth++;
        else if (ch === '}') { depth--; if (depth === 0) { end = i; break; } }
      }
      if (end < 0) return { stage_id: '', list_id: '' };
      var json = JSON.parse(raw.slice(s, end + 1)) || {};
      return {
        stage_id: json.stage_id ? String(json.stage_id).trim() : '',
        list_id:  json.list_id  ? String(json.list_id).trim()  : ''
      };
    } catch (e) { return { stage_id: '', list_id: '' }; }
  }

  // Buton TIKLANINCA çalışacak modu GAD konfigürasyonundan (manual_wake.mode) okur — SORMAZ.
  // Açıkça set edilmemişse default = update_known (Yol A, kayıtlar üzerinde çalış) — kullanıcı kararı.
  // KAYNAK ÖNCELİĞİ: canlı window._gadManualWake (PB hydrate + GAD load) → tablo config/DOM DFR →
  // #bubble-options (son çare). Tablonun config/DOM'dan okuduğu DFR sıklıkla manual_wake taşımıyor;
  // bu yüzden eskiden bulk_create agent'ı update_known sanılıp "no records" diyordu.
  function resolveWakeMode() {
    const w = state.wake;
    const gw = (window._gadManualWake && typeof window._gadManualWake === 'object') ? window._gadManualWake : null;
    let agDfr = (w.agentConfig && w.agentConfig.data_flow_rules) || null;
    // data_flow_rules agent objesinde çoğu kez JSON STRING olarak gelir → parse et (yoksa mode kaçar).
    if (typeof agDfr === 'string') { try { agDfr = JSON.parse(agDfr); } catch (e) { agDfr = null; } }
    const agMode = (agDfr && typeof agDfr === 'object' && agDfr.manual_wake) ? agDfr.manual_wake.mode : '';
    let m = String(
      (gw && gw.mode) ||
      (w.manualWake && w.manualWake.mode) ||
      (w.dfr && w.dfr.manual_wake && w.dfr.manual_wake.mode) ||
      agMode || ''
    ).trim();
    if (!m) m = _readBubbleOptionsManualMode();
    // Bilinen 5 mod → "explicit" (gerçekten bir kaynaktan okundu). Boş → "defaulted":
    // hiçbir kaynak modu taşımadı, güvenli platform default'u update_known kullanıyoruz AMA
    // popover'ı buna göre yumuşatıyoruz (boş tabloda kırmızı dead-end gösterme).
    const KNOWN = { update_known: 1, create_new: 1, bulk_create: 1, find_update: 1, external_only: 1 };
    const explicit = !!KNOWN[m];
    const resolved = explicit ? m : 'update_known';
    w._modeExplicit = explicit;
    // Poll her turda çağırır: yalnız sonuç değişince logla
    const logKey = resolved + (explicit ? ':explicit' : ':defaulted');
    if (w._lastLoggedMode !== logKey) {
      w._lastLoggedMode = logKey;
      log('wake: resolveWakeMode →', resolved, explicit ? '(explicit)' : '(defaulted)',
        '| _gadManualWake:', gw ? (gw.mode || '∅') : 'yok',
        '| w.manualWake:', (w.manualWake && w.manualWake.mode) || '∅',
        '| agentConfig.dfr:', agMode || '∅',
        '| bubble-options:', _readBubbleOptionsManualMode() || '∅');
    }
    return resolved;
  }

  // DB (Bubble Data API) → assistant kaydının data_flow_rules.manual_wake.mode'unu çeker.
  // NEDEN: Sayfa REFRESH sonrası canlı window._gadManualWake sıfırlanır ve Bubble tabloya çoğu kez
  // agent'ın data_flow_rules'ını GEÇİRMEZ → resolveWakeMode "defaulted"a düşüp "What should the agent
  // do?" picker'ını gösteriyordu (oysa DB'de manual_wake.mode="bulk_create" yazıyor). Bu fetch tabloyu
  // KENDİ KENDİNE YETER kılar: assistant public Data API'den (featured flow aynısını kullanıyor) okur.
  // Promise cache'lenir (in-flight/başarılı tekrar çekmez); ağ hatasında cache temizlenir (retry).
  function fetchWakeModeFromDb() {
    const w = state.wake;
    if (w._dbModeFetch) return w._dbModeFetch;
    const aid = String(w.assistantId || '').trim();
    if (!aid) return Promise.resolve('');
    const vt = (location.pathname.indexOf('/version-test') > -1) ? '/version-test' : '';
    const url = location.origin + vt + '/api/1.1/obj/assistant/' + encodeURIComponent(aid);
    w._dbModeFetch = fetch(url, { headers: { Accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) { const e = new Error('assistant ' + r.status); e.httpStatus = r.status; throw e; }
        return r.json();
      })
      .then(function (j) {
        const a = (j && (j.response || j)) || {};
        let dfr = a.data_flow_rules || null;
        if (typeof dfr === 'string') { try { dfr = JSON.parse(dfr); } catch (e) { dfr = null; } }
        if (dfr && typeof dfr === 'object') {
          if (!w.dfr) w.dfr = dfr;
          if (dfr.manual_wake && typeof dfr.manual_wake === 'object') {
            w.manualWake = {
              enabled: dfr.manual_wake.enabled !== false,
              mode: typeof dfr.manual_wake.mode === 'string' ? dfr.manual_wake.mode : '',
              search_keys: Array.isArray(dfr.manual_wake.search_keys) ? dfr.manual_wake.search_keys : []
            };
            log('wake: DB Data API manual_wake.mode →', w.manualWake.mode || '∅');
            try { updateWakeButtonUI(); } catch (e) {}
            return w.manualWake.mode || '';
          }
        }
        return '';
      })
      .catch(function (err) {
        // Yalnız AĞ hatasında (TypeError) cache temizlenir → sonraki tıklamada tekrar denenir.
        // HTTP 401/403/404 gibi yanıtlar kalıcıdır: '' ile çözülmüş promise cache'te kalır (tekrar istek yok).
        if (err instanceof TypeError) w._dbModeFetch = null;
        log('wake: DB Data API fetch hatası', err && err.message, err && err.httpStatus ? '(http ' + err.httpStatus + ', cache korunur)' : '');
        return '';
      });
    return w._dbModeFetch;
  }

  // Sürecin asistan bağlamını DOM/window'dan toplar. Tablo, form/agent ile AYRI Bubble
  // elementi olduğundan assistant_id'yi config'e gömmek zor olabilir; bu yüzden birden çok
  // kaynak desteklenir (kullanıcı hangisi kolaysa onu doldurur). Öncelik: config > DOM > window.
  // Desteklenen DOM kaynakları:
  //   • application/json tipli, id="gaia-assistant-config" bir script elementi: {assistant_id,agent_name,data_flow_rules,agent}
  //   • herhangi bir elementte [data-assistant-id] (+ data-assistant-name / data-data-flow-rules)
  //   • id="gaia-assistant-id" veya id="assistant_id" elementinin textContent'i (form elementindeki gizli key dahil)
  //   • window.__GAIA_ASSISTANT__ / window.gaiaCurrentAssistant ({assistant_id,agent_name,data_flow_rules,agent})
  function readAssistantFromDOM() {
    const out = {};
    try {
      // EN GÜVENİLİR KAYNAK: form elementinin window.BUBBLE_INPUTS'u (aynı sayfa, window paylaşılıyor).
      // Form bunu `INITIAL_INPUTS.ASSISTANT_ID` olarak okuyor — tablo da aynı global'den okur.
      // ASSISTANT_ID hem top-level hem COLUMN_JSON içinde olabilir; ikisine de bak.
      const bi = window.BUBBLE_INPUTS;
      if (bi && typeof bi === 'object') {
        const cj = (bi.COLUMN_JSON && typeof bi.COLUMN_JSON === 'object') ? bi.COLUMN_JSON : {};
        if (!out.assistant_id) {
          out.assistant_id = String(
            bi.ASSISTANT_ID || bi.assistant_id || bi.AssistantId ||
            cj.ASSISTANT_ID || cj.assistant_id || ''
          ).trim();
        }
        if (!out.agent_name)      out.agent_name      = bi.AGENT_NAME || bi.agent_name || cj.AGENT_NAME || cj.agent_name || '';
        if (!out.data_flow_rules) out.data_flow_rules = bi.DATA_FLOW_RULES || bi.data_flow_rules || cj.DATA_FLOW_RULES || cj.data_flow_rules || '';
      }
      const cfgEl = document.getElementById('gaia-assistant-config');
      if (cfgEl && cfgEl.textContent && cfgEl.textContent.trim()) {
        try {
          const _parsed = JSON.parse(cfgEl.textContent);
          // sadece eksikleri doldur (BUBBLE_INPUTS önceliği korunsun)
          Object.keys(_parsed || {}).forEach(function (k) { if (out[k] === undefined || out[k] === '') out[k] = _parsed[k]; });
        } catch (e) {}
      }
      const attrEl = document.querySelector('[data-assistant-id]');
      if (attrEl) {
        if (!out.assistant_id) out.assistant_id = (attrEl.getAttribute('data-assistant-id') || '').trim();
        if (!out.agent_name)  out.agent_name  = (attrEl.getAttribute('data-assistant-name') || '').trim();
        const dfrA = attrEl.getAttribute('data-data-flow-rules');
        if (dfrA && !out.data_flow_rules) out.data_flow_rules = dfrA;
      }
      if (!out.assistant_id) {
        const idEl = document.getElementById('gaia-assistant-id') || document.getElementById('assistant_id');
        if (idEl) {
          const t = (idEl.getAttribute('data-assistant-id') || idEl.value || idEl.textContent || '').trim();
          if (t) out.assistant_id = t;
        }
      }
      const g = window.__GAIA_ASSISTANT__ || window.gaiaCurrentAssistant;
      if (g && typeof g === 'object') {
        if (!out.assistant_id && g.assistant_id) out.assistant_id = String(g.assistant_id).trim();
        if (!out.agent_name && (g.agent_name || g.name)) out.agent_name = g.agent_name || g.name;
        if (!out.data_flow_rules && g.data_flow_rules) out.data_flow_rules = g.data_flow_rules;
        if (!out.agent && g.agent) out.agent = g.agent;
      }
    } catch (e) { log('wake: readAssistantFromDOM error', e); }
    return out;
  }

  function applyWakeConfig(config) {
    const w = state.wake;
    w._lastConfig = config || {};   // setAssistant / geç-DOM re-resolve için sakla
    w.show = !(config && config.wake_button === false);
    w.dfr = null;
    w.manualWake = null;
    w.agentConfig = null;
    w.assistantId = '';

    // DOM/window kaynağı — config eksik alanları buradan tamamlanır
    const dom = readAssistantFromDOM();

    // assistant_id: önce config (table-config içine de konabilir), sonra DOM/window
    w.assistantId = String(
      (config && (config.assistant_id || (config.agent && config.agent.assistant_id))) ||
      dom.assistant_id || ''
    ).trim();

    // agent_name
    w.agentName = String(
      (config && config.agent_name) || dom.agent_name || ''
    ).trim();

    // agent config (köprü akışı için) — config.agent öncelikli, yoksa DOM.
    // ÖNEMLİ: DFR'dan ÖNCE parse ediyoruz. Tablo elementine çoğu kez TAM agent objesi geçilir
    // ve data_flow_rules top-level DEĞİL, agent.data_flow_rules İÇİNDE gelir. Bunu kaçırınca
    // manual_wake.mode okunamıyor → resolveWakeMode default update_known'a düşüp "no records" diyor.
    try {
      let ag = (config && config.agent) || dom.agent || null;
      if (ag && typeof ag === 'string') ag = JSON.parse(ag);
      if (ag && typeof ag === 'object' && !Array.isArray(ag)) w.agentConfig = ag;
    } catch (err) {
      log('wake: agent config parse error', err);
    }

    // data_flow_rules — config top-level → agent config içi → DOM (üçü de denenir).
    try {
      let raw = (config && config.data_flow_rules)
        || (w.agentConfig && w.agentConfig.data_flow_rules)
        || dom.data_flow_rules || null;
      if (raw && typeof raw === 'string') raw = JSON.parse(raw);
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
        w.dfr = raw;
        if (raw.manual_wake && typeof raw.manual_wake === 'object') {
          w.manualWake = {
            enabled: raw.manual_wake.enabled !== false,
            mode: typeof raw.manual_wake.mode === 'string' ? raw.manual_wake.mode : '',
            search_keys: Array.isArray(raw.manual_wake.search_keys) ? raw.manual_wake.search_keys : []
          };
        }
      }
    } catch (err) {
      log('wake: data_flow_rules parse error', err);
    }
    // agentConfig içindeki assistant_id de hasAgent'e katkı sağlasın
    if (!w.assistantId && w.agentConfig && w.agentConfig.assistant_id) {
      w.assistantId = String(w.agentConfig.assistant_id).trim();
    }

    // Yerel kaynaklarda manual_wake.mode yoksa (özellikle refresh sonrası) DB'den PROAKTİF çek —
    // buton tıklanmadan mod hazır olsun (self-sufficient). assistant_id gerekli.
    try {
      var _localMode = (w.manualWake && w.manualWake.mode) ||
                       (window._gadManualWake && window._gadManualWake.mode) || '';
      if (!_localMode && w.assistantId) fetchWakeModeFromDb();
    } catch (e) {}

    // hasAgent: SÜREÇTE asistan var mı? Birincil sinyal = assistant_id okunabildi mi.
    // config.has_agent explicit gelirse ona öncelik ver.
    if (config && typeof config.has_agent === 'boolean') {
      w.hasAgent = config.has_agent;
    } else {
      w.hasAgent = !!(
        w.assistantId ||
        (w.agentConfig && w.agentConfig.system_message) ||
        w.dfr
      );
    }
    updateWakeButtonUI();
    maybeReopenEditorAfterReload();
  }

  // 14.09: Architect'in kimlik kapısı uyuşmazlıkta sayfayı yeniledi ve niyeti bıraktı (sessionStorage
  // gx_reopen_edit = {aid, ts}). Yenileme sonrası tablo AYNI asistanı okuyunca editörü bir kez kendisi açar;
  // başka süreç/asistan okunursa hiçbir şey yapmaz, niyet 2 dk'da düşer.
  var _reopenConsumed = false;
  function maybeReopenEditorAfterReload() {
    if (_reopenConsumed) return;
    var raw = null;
    try { raw = sessionStorage.getItem('gx_reopen_edit'); } catch (e) { return; }
    if (!raw) return;
    var it = null;
    try { it = JSON.parse(raw); } catch (e) { it = null; }
    if (!it || !it.aid || (Date.now() - (it.ts || 0)) > 120000) { try { sessionStorage.removeItem('gx_reopen_edit'); } catch (e) {} return; }
    var w = state.wake;
    if (!w.hasAgent || String(w.assistantId || '') !== String(it.aid)) return;
    _reopenConsumed = true;
    try { sessionStorage.removeItem('gx_reopen_edit'); } catch (e) {}
    log('edit: yenileme sonrası editör yeniden açılıyor', it.aid);
    setTimeout(openAgentEditor, 900);   // PB hydrate payı; kimlik kapısı zaten bekler
  }

  // Bubble Run-JavaScript ile imperatif set: window.dynamicTable.setAssistant({assistant_id,agent_name,data_flow_rules,agent})
  function setAssistant(ctx) {
    if (ctx && typeof ctx === 'object') window.__GAIA_ASSISTANT__ = ctx;
    // mevcut config'i tekrar uygula (DOM/window yeni değeri alınır)
    applyWakeConfig(state.wake._lastConfig || {});
  }

  // Kısa polling — BUBBLE_INPUTS/DOM tablo init'inden veya bir refresh sinyalinden BİRAZ
  // sonra güncellenebilir (Bubble async). Bulununca değil, sabit tur boyunca çalışır
  // (ekran değişiminde assistant_id eskiden farklıya geçtiyse her tur canlı değeri okur).
  var _assistPollIv = null;
  function startAssistantPoll(maxTries) {
    if (_assistPollIv) clearInterval(_assistPollIv);
    var tries = 0, max = maxTries || 8;
    _assistPollIv = setInterval(function () {
      tries++;
      try { applyWakeConfig(state.wake._lastConfig || {}); } catch (e) {}
      if (tries >= max) { clearInterval(_assistPollIv); _assistPollIv = null; }
    }, 500);
  }

  // Bubble "ekran değişti" sinyali (veri taşımaz): window.dynamicTable.refresh() ya da
  // window.refreshTableAssistant(). Ekran/süreç değişince (list_id/stage_id/assistant değişti)
  // çağır → tablo BUBBLE_INPUTS'u taze okur, buton yeni asistana göre güncellenir.
  function refreshAssistant() {
    try { applyWakeConfig(state.wake._lastConfig || {}); } catch (e) {}
    startAssistantPoll(8);   // BUBBLE_INPUTS biraz geç güncellenirse 4sn boyunca yakala
  }

  // Asistan ikonu — markup'taki .dt-wake-icon ile birebir (boyut kuralları aynı elemente bağlı)
  const CHATGPT_ICON_HTML = '<span class="dt-wake-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>';

  function updateWakeButtonUI() {
    const btn = els.wakeButton;
    if (!btn) return;
    const w = state.wake;
    btn.style.display = w.show ? '' : 'none';
    // Edit ikonu — sadece asistan VARKEN ve buton görünürken (Ask Assistant'ın solunda)
    if (els.editAgentButton) {
      els.editAgentButton.style.display = (w.show && w.hasAgent && !w.waking) ? '' : 'none';
    }
    const off = !!(w.manualWake && w.manualWake.enabled === false);
    const setup = !w.hasAgent;   // süreçte asistan yok → kurulum CTA'sı
    btn.classList.toggle('dt-wake-off', off && !setup && !w.waking);
    btn.classList.toggle('dt-wake-setup', setup && !w.waking);
    btn.classList.toggle('dt-wake-busy', w.waking);
    btn.setAttribute('aria-busy', w.waking ? 'true' : 'false');
    // Poll her 500ms çağırır: markup'ı etkileyen girdiler değişmediyse innerHTML'e dokunma
    const sig = [w.waking ? 1 : 0, setup ? 1 : 0, off ? 1 : 0].join('|');
    if (btn.dataset.sig !== sig) {
      btn.dataset.sig = sig;
      if (w.waking) {
        btn.innerHTML = '<span class="dt-wake-spin"></span><span id="dt-wake-label">Working…</span>';
        btn.title = 'The assistant is running…';
      } else if (setup) {
        // Asistan yok → "kur" çağrısı (GAD'ı açar)
        btn.innerHTML = CHATGPT_ICON_HTML + '<span id="dt-wake-label">Set up Assistant</span>';
        btn.title = 'No assistant for this table yet — set one up';
      } else {
        btn.innerHTML = CHATGPT_ICON_HTML + '<span id="dt-wake-label">Ask Assistant</span>';
        btn.title = off
          ? 'Asking by hand is turned off for this assistant'
          : 'Ask the assistant to run now';
      }
      // innerHTML yeniden yazıldı → eski referans kopuk; taze sorgula
      els.wakeLabel = btn.querySelector('#dt-wake-label');
    }
    // UX-2.3: asistan durumu değişince ilk-koşu şeridinin CTA'sı da tazelensin
    try { if (typeof updateFirstRunBanner === 'function') updateFirstRunBanner(); } catch (e) {}
  }

  function closeWakeModal() {
    const bd = els.wrapper ? els.wrapper.querySelector('.dt-wake-backdrop') : null;
    if (!bd) return;
    bd.remove();
    // Odak diyaloğu açan düğmeye dönsün
    if (els.wakeButton && typeof els.wakeButton.focus === 'function') {
      try { els.wakeButton.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  let _wakeModalSeq = 0;

  // body: HTML string; buttons: [{label, primary, onClick}]
  function openWakeModal(title, bodyHTML, buttons) {
    if (!els.wrapper) return null;
    closeWakeModal();
    const bd = document.createElement('div');
    bd.className = 'dt-wake-backdrop';
    const modal = document.createElement('div');
    modal.className = 'dt-wake-modal';
    modal.innerHTML = '<h3></h3>' + bodyHTML + '<div class="dt-wake-actions"></div>';
    const h3 = modal.querySelector('h3');
    h3.textContent = title;
    _wakeModalSeq += 1;
    h3.id = 'dt-wake-modal-title-' + _wakeModalSeq;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', h3.id);
    const actions = modal.querySelector('.dt-wake-actions');
    let primaryBtn = null;
    (buttons || []).forEach(b => {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = b.label;
      if (b.primary) { el.classList.add('dt-wake-primary'); primaryBtn = el; }
      el.addEventListener('click', () => b.onClick(modal));
      actions.appendChild(el);
    });
    bd.appendChild(modal);
    bd.addEventListener('click', e => { if (e.target === bd) closeWakeModal(); });
    bd.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); closeWakeModal(); }
    });
    els.wrapper.appendChild(bd);
    // Odak: not alanı varsa o, yoksa birincil düğme
    const focusTarget = modal.querySelector('.dt-wake-note') || primaryBtn || actions.querySelector('button');
    if (focusTarget) { try { focusTarget.focus({ preventScroll: true }); } catch (e) {} }
    return modal;
  }

  function showWakeToast(message, kind) {
    if (!els.wrapper) return;
    const old = els.wrapper.querySelector('.dt-wake-toast');
    if (old) old.remove();
    const isError = kind === 'error';
    const t = document.createElement('div');
    t.className = 'dt-wake-toast' + (isError ? ' is-error' : kind === 'success' ? ' is-success' : '');
    t.textContent = message;
    t.setAttribute('role', isError ? 'alert' : 'status');
    t.setAttribute('aria-live', isError ? 'assertive' : 'polite');
    t.addEventListener('click', () => t.remove());
    els.wrapper.appendChild(t);
    // Tablo boşken hata → boş-durum ikonu hata rengine döner (yalnız sınıf)
    try {
      const rowsN = Array.isArray(state.displayRows) ? state.displayRows.length : 0;
      if (isError && rowsN === 0 && els.emptyState) els.emptyState.classList.add('is-error');
    } catch (e) {}
    // Hata bildirimi tıklanana kadar kalır; diğerleri 5 sn
    if (!isError) setTimeout(() => { if (t.parentNode) t.remove(); }, 5000);
  }

  // mr18: the same toast slot with one action button ("Field added · Undo", "Field not added · Retry"); role=status
  // mr18 T1: every toast is stamped with the screen it was raised on (screenId, else the current one); its action runs only
  // while the table still shows that screen, and a config of another screen removes it (fieldScreenSync)
  function showActionToast(text, actionLabel, onAction, ms, screenId) {
    if (!els.wrapper) return null;
    const old = els.wrapper.querySelector('.dt-wake-toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'dt-wake-toast dt-action-toast';
    t.setAttribute('role', 'status');
    t.setAttribute('aria-live', 'polite');
    let stamp = ''; try { stamp = typeof screenId === 'string' ? screenId : fieldScreenId(); } catch (e) {}
    t.setAttribute('data-screen', stamp);
    const s = document.createElement('span');
    s.className = 'dt-toast-text';
    s.textContent = text;
    t.appendChild(s);
    if (actionLabel && typeof onAction === 'function') {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dt-toast-action';
      b.textContent = actionLabel;
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); t.remove(); let here = ''; try { here = fieldScreenId(); } catch (x) {} if (here === stamp) onAction(); });
      t.appendChild(b);
    }
    els.wrapper.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, ms || 6000);
    return t;
  }

  function agentDisplayName() {
    return state.wake.agentName || 'the assistant';
  }

  // Architect/GAD elementinin manage_trigger köprüsü sayfada mevcut mu?
  function wakeBridgeAvailable() {
    return !!(window.gaiaTriggerManager && typeof window.gaiaTriggerManager.manageTrigger === 'function');
  }

  // Yol B (objesiz): create_new / bulk_create / external_only → tek koşu, wake_agent.
  // note → agent'a "bu koşum için not" (user_content). Mod GAD'da set; tablo persist ETMEZ.
  function fireWake(mode, note) {
    const w = state.wake;
    closeWakeModal();
    note = (typeof note === 'string') ? note.trim() : '';

    // _gadFireWake (Architect/PB aynı sayfada) varsa BİRİNCİL: config'i canlı PB state'inden
    // Architect toplar (test_prompt ile aynı). Yoksa köprü (assistant_id) / bubble_fn fallback.
    const useArchitect = (typeof window._gadFireWake === 'function');
    const bridge = wakeBridgeAvailable();
    if (!useArchitect && !bridge && typeof window.bubble_fn_wake_agent !== 'function') {
      showWakeToast('Wake is not wired up on this page yet.', 'error');
      log('wake: ne _gadFireWake ne gaiaTriggerManager ne bubble_fn_wake_agent var');
      return;
    }

    w.waking = true;
    updateWakeButtonUI();
    // Cevap dönmezse 45 sn sonra butonu kendiliğinden serbest bırak
    if (w.resetTimer) clearTimeout(w.resetTimer);
    w.resetTimer = setTimeout(() => wakeResult(true, 'No confirmation yet. Check the run log.'), 45000);
    showWakeToast('Asking ' + agentDisplayName() + ' to run…');

    // Sonuç callback'i (her köprü yolunda ortak) — onTriggerResponse 'wake_agent' bunu çağırır
    window._wakeAgentCallback = function (res) {
      const ok = !res || String(res.status || '').toLowerCase() !== 'error';
      wakeResult(ok, ok ? '' : (res && res.message ? res.message : 'Wake failed.'));
    };

    if (useArchitect) {
      // BİRİNCİL: Architect/PB aynı sayfada → config'i CANLI PB state'inden toplar
      // (system_message/tools_list/json_schema/effort/data_flow_rules/stage/list) ve
      // manageTrigger('wake_agent', …) ile gönderir. Tablonun config bilmesine gerek yok.
      var okFire = window._gadFireWake(mode || '', note);
      if (okFire === false) {
        window._wakeAgentCallback = null;
        wakeResult(false, 'Could not reach the assistant builder on this page.');
        return;
      }
      log('wake: _gadFireWake (canlı PB) ile gönderildi', mode, note ? '(+not)' : '');
    } else if (bridge) {
      // İKİNCİL: köprü + tablonun topladığı config (assistant_id + DOM'dan okunan agent config)
      const ag = w.agentConfig || {};
      // ── P0-2 stage_id/list_id RESCUE (köprü yolu) ────────────────────────────
      // Birincil yol (_gadFireWake) stage/list'i zaten taşıyor; köprü yolu (Architect
      // script'i geç/eksik yüklendiyse) bunu YAPMIYORDU → create modunda stage_id=""
      // gidip kayıt hedef sürece düşmüyordu. Aynı sayfa (tek window) olduğundan PB
      // globalleri okunabilir; boşsa #bubble-options top-level'dan kurtar. Yeni Bubble
      // fonksiyonu YOK — mevcut wake_agent payload'ına enjekte (top-level + DFR içi).
      var _sid = String(window.__GAD_STAGE_ID__ || (ag && ag.stage_id) || '').trim();
      var _lid = String(window.__GAD_LIST_ID__  || (ag && ag.list_id)  || '').trim();
      if (!_sid || !_lid) {
        var _sl = _readBubbleOptionsStageList();
        if (!_sid && _sl.stage_id) { _sid = _sl.stage_id; window.__GAD_STAGE_ID__ = _sid; }
        if (!_lid && _sl.list_id)  { _lid = _sl.list_id;  window.__GAD_LIST_ID__  = _lid; }
      }
      // DFR objesine de göm (server DFR'dan okursa da bulsun); tablonun kendi kopyası, mutasyon güvenli
      var _dfrObj = (typeof w.dfr === 'object' && w.dfr) ? w.dfr : null;
      if (_dfrObj) {
        if (_sid && !_dfrObj.stage_id) _dfrObj.stage_id = _sid;
        if (_lid && !_dfrObj.list_id)  _dfrObj.list_id  = _lid;
      }
      const params = Object.assign({}, ag, {
        assistant_id: w.assistantId || ag.assistant_id || '',
        wake_mode: mode || '',
        // not → server'ın beklediği user_content formatı (role'lü mesaj dizisi)
        user_content: note ? JSON.stringify([{ role: 'user', content: note }]) : '',
        data_flow_rules: _dfrObj ? JSON.stringify(_dfrObj) : (w.dfr || null),
        stage_id: _sid,
        list_id: _lid
      });
      window.gaiaTriggerManager.manageTrigger('wake_agent', params);
      log('wake: manage_trigger köprüsüyle gönderildi (tablo config)', mode, note ? '(+not)' : '', '| stage:', _sid || '∅', '| list:', _lid || '∅');
    } else {
      // FALLBACK: kullanıcının kuracağı bubble_fn_wake_agent workflow'u
      window._wakeAgentCallback = null;
      window.bubble_fn_wake_agent(JSON.stringify({ source: 'manual', mode: mode || '', note: note, assistant_id: w.assistantId || '' }));
      log('wake: bubble_fn_wake_agent fallback ile gönderildi', mode, note ? '(+not)' : '');
    }
  }

  // Bubble workflow'u sonuç dönünce çağırabilir: dynamicTable.wakeResult(true, 'Done!')
  function wakeResult(success, message) {
    const w = state.wake;
    if (w.resetTimer) { clearTimeout(w.resetTimer); w.resetTimer = null; }
    w.waking = false;
    updateWakeButtonUI();
    if (message) showWakeToast(message, success === false ? 'error' : 'success');
  }

  // Süreçte asistan yoksa: GAD/builder'ı aç (öncelik: sayfadaki Architect; sonra Bubble fn).
  // GAD içinde "Browse AI templates" yönlendirmesi zaten var (AI Edit boş durumu).
  function openAssistantBuilder() {
    closeWakeModal();
    // 1) Architect elementi aynı sayfadaysa GAD'ı create modunda aç
    if (typeof window.gaiaOpenAgentDashboard === 'function') {
      try { window.gaiaOpenAgentDashboard('create', {}); log('wake: GAD create modunda açıldı'); return; }
      catch (e) { log('wake: gaiaOpenAgentDashboard hata', e); }
    }
    // 2) Module varsa templates sekmesini aç (templates-button.html ile aynı davranış)
    if (typeof window.gaiaSetTab === 'function') {
      try {
        window.gaiaSetTab('templates');
        var m = document.getElementById('gaia-automation-module');
        if (m) { m.classList.remove('is-hidden'); m.style.display = ''; }
        log('wake: templates sekmesi açıldı'); return;
      } catch (e) { log('wake: gaiaSetTab hata', e); }
    }
    // 3) Fallback: Bubble navigasyonu (builder sayfasına git)
    if (typeof window.bubble_fn_setup_assistant === 'function') {
      window.bubble_fn_setup_assistant();
      log('wake: bubble_fn_setup_assistant fallback');
    } else {
      showWakeToast('Open the assistant builder to set one up.', 'info');
      log('wake: ne GAD ne module ne bubble_fn_setup_assistant var');
    }
  }

  // ── Edit assistant — GAD'ı mevcut agent için düzenleme modunda açar ──────────
  // gaiaExtractAndEdit canlı PB state'ini okuyup GAD'ı edit modunda açar (aynı sayfa).
  function openAgentEditor() {
    // 13.09: editör sayfadaki PB içeriğini açar; o içerik başka ajana ait olabiliyor (yeni süreçte
    // Bubble bağlamı geçmemişse). Tablonun kendi asistan kimliğini bırak → Architect kimlik kapısı
    // DB kaydıyla karşılaştırır, uyuşmazsa YANLIŞ ajanı açmaz. Eski Architect bu global'i yok sayar.
    try { window.__GX_EDIT_ASSISTANT_ID__ = String((state.wake && state.wake.assistantId) || '').trim() || null; } catch (e) {}
    if (typeof window.gaiaExtractAndEdit === 'function') {
      try { window.gaiaExtractAndEdit(); log('edit: gaiaExtractAndEdit'); return; }

      try { window.gaiaOpenAgentDashboard('edit', {}); log('edit: gaiaOpenAgentDashboard'); return; }
      catch (e) { log('edit: gaiaOpenAgentDashboard hata', e); }
    }
    if (typeof window.bubble_fn_edit_assistant === 'function') { window.bubble_fn_edit_assistant(); return; }
    showWakeToast('Open the assistant to edit it.', 'info');
  }

  // Tablodaki TÜM satırların uid'leri (getSelectedUniqueIds'in tüm-satır karşılığı)
  function getAllUniqueIds() {
    const ids = [];
    const seen = new Set();
    state.rawRows.forEach(function (raw) {
      if (!raw) return;
      for (const key of UNIQUE_KEYS) {
        if (raw[key] !== undefined && raw[key] !== null && raw[key] !== '') {
          const v = String(raw[key]);
          if (!seen.has(v)) { seen.add(v); ids.push(v); }
          return;
        }
      }
    });
    return ids;
  }

  // ── Run popover — buton TIKLANINCA tek ekran (mod SORMAZ) ───────────────────
  // Mod GAD'da set edilir; tablo sadece çalıştırır. Update ailesi (update_known/find_update)
  // → Yol A (run_list / object_id, kayıt başına). Diğerleri → Yol B (fireWake / wake_agent).
  function openWakeRunPopover(mode) {
    const name = agentDisplayName();
    const isUpd = isWakeUpdateMode(mode);
    const explicit = (state.wake._modeExplicit !== false);
    const selIds = getSelectedUniqueIds();
    const allIds = getAllUniqueIds();
    const selN = selIds.length, allN = allIds.length;

    // Modu hiçbir kaynaktan okuyamadık (defaulted) VE tablo boş → "update + no records"
    // kırmızı dead-end'i göstermek yanıltıcı (agent aslında kayıt getiriyor olabilir).
    // Net kurulum yönlendirmesi ver; mod GAD Wake-Ups'ta set edilir, sonra buton sadece çalıştırır.
    if (isUpd && allN === 0 && !explicit) {
      openWakeModal(
        'What should ' + name + ' do?',
        '<p>This table is empty and I can\'t tell yet what <strong>' + name + '</strong> should do '
          + 'when you run it — add records, update existing ones, or just run a task.</p>'
          + '<p class="dt-wake-hint">Set it once under the assistant\'s '
          + '<strong>Wake-Ups</strong> settings — after that, this button just runs it.</p>',
        [
          { label: 'Not now', onClick: function () { closeWakeModal(); } },
          { label: 'Open assistant settings', primary: true, onClick: function () { closeWakeModal(); openAgentEditor(); } }
        ]
      );
      return;
    }

    const desc = WAKE_MODE_COPY[mode] || WAKE_MODE_COPY.update_known;

    let body = '<p>' + desc + '</p>';
    // Not alanı — her iki yol için opsiyonel (agent'a bu koşum için talimat)
    body += '<label class="dt-wake-field-label">Note for this run (optional)</label>'
      + '<textarea class="dt-wake-note" rows="2" placeholder="e.g. focus on this week only"></textarea>';

    // Update modunda kapsam: seçili varsa seçili (default) + tümü; seçili yoksa "all N".
    if (isUpd) {
      if (allN === 0) {
        body += '<p class="dt-wake-hint">There are no records to update yet — add or import some first, then run.</p>';
      } else if (selN > 0) {
        body += '<div>'
          + '<span class="dt-wake-field-label">Which records?</span>'
          + '<label class="dt-wake-scope">'
          +   '<input type="radio" name="dtRunScope3" value="selected" checked>Selected records (' + selN + ')</label>'
          + '<label class="dt-wake-scope">'
          +   '<input type="radio" name="dtRunScope3" value="all">All records (' + allN + ')</label>'
          + '</div>';
      } else {
        body += '<p class="dt-wake-hint">Running on all ' + allN + ' record' + (allN > 1 ? 's' : '') + '.</p>';
      }
    }

    openWakeModal('Ask ' + name + ' to run', body, [
      { label: 'Cancel', onClick: function () { closeWakeModal(); } },
      {
        label: 'Run now', primary: true,
        onClick: function (m) {
          const noteEl = m.querySelector('.dt-wake-note');
          const note = noteEl ? String(noteEl.value || '').trim() : '';
          if (isUpd) {
            // M-4 (mode-aware denetim, 2026-07-04): boş tabloda update-ailesi koşusu —
            // çıplak kırmızı hata yerine nötr yönlendirme (dead-end = tasarım hatası).
            if (allN === 0) { closeWakeModal(); showWakeToast('No records here yet — add one with + New and the assistant will work on it.', ''); return; }
            let scope = (selN > 0) ? 'selected' : 'all';
            const chk = m.querySelector('input[name="dtRunScope3"]:checked');
            if (chk) scope = chk.value;
            runList(scope === 'selected' ? selIds : allIds, note);
          } else {
            fireWake(mode, note);
          }
        }
      }
    ]);
  }

  // uid'leri Bubble'a gönder (fn suffix: run_list). Bubble her uid için agent'ı (kaydı) çalıştırır
  // — object_id dolu, kayda-bağlı (Yol A). note opsiyonel: bubble_fn_wake_note ile iletilir.
  function runList(ids, note) {
    closeWakeModal();
    if (!ids || !ids.length) { showWakeToast('No records selected.', 'error'); return; }
    if (typeof window.bubble_fn_run_list === 'function') {
      if (note && typeof window.bubble_fn_wake_note === 'function') {
        try { window.bubble_fn_wake_note(note); } catch (e) {}
      }
      window.bubble_fn_run_list(ids);
      showWakeToast('Running ' + agentDisplayName() + ' on ' + ids.length + ' record' + (ids.length > 1 ? 's' : '') + '…', 'success');
      log('run_list gönderildi: ' + ids.length + ' uid' + (note ? ' (+not)' : ''));
    } else {
      showWakeToast('Run-on-list is not wired up on this page yet.', 'error');
      log('run_list: bubble_fn_run_list yok');
    }
  }

  // Buton tıklanınca: mod GAD konfigürasyonundan okunur, SORULMAZ.
  // İstisnalar: asistan yok → kurulum; wake kapalı → bilgi.
  function onWakeClick() {
    const w = state.wake;
    if (w.waking) return;

    // 0) Süreçte asistan yok → kurulum akışına yönlendir (GAD / templates)
    if (!w.hasAgent) { openAssistantBuilder(); return; }

    // 1) Manuel uyandırma açıkça kapatılmış → bilgilendir (buton görünür ama iş yapmaz)
    if (w.manualWake && w.manualWake.enabled === false) {
      openWakeModal(
        'Waking is turned off',
        '<p>' + agentDisplayName().charAt(0).toUpperCase() + agentDisplayName().slice(1)
          + ' can\'t be woken by hand right now.<br>To allow it, open the assistant\'s settings under <strong>Wake-Ups</strong>.</p>',
        [{ label: 'Got it', primary: true, onClick: function () { closeWakeModal(); } }]
      );
      return;
    }

    // 2) Modu GAD'dan oku ve Run popover'ı aç (mod seçtirilmez; unset → update_known).
    const _mode = resolveWakeMode();
    // Yerel kaynaklar modu VERMEDİYSE (refresh sonrası _gadManualWake boş + Bubble DFR'ı tabloya
    // geçirmemiş) DB'den (Data API) çekip öyle aç — "What should the agent do?" picker'ına düşme.
    if (!w._modeExplicit && String(w.assistantId || '').trim()) {
      fetchWakeModeFromDb().then(function () { openWakeRunPopover(resolveWakeMode()); });
      return;
    }
    openWakeRunPopover(_mode);
  }

  // Menü kapanınca odağı açıldığı yere geri ver (yalnız odak hâlâ menüde ya da body'deyse — kullanıcının
  // bu arada tıkladığı başka bir alanın odağını çalma)
  function restoreMenuFocus(menuEl) {
    const back = state.menuReturnFocus;
    state.menuReturnFocus = null;
    if (!back || typeof back.focus !== 'function' || !back.isConnected) return;
    const active = document.activeElement;
    const focusIsLoose = !active || active === document.body || (menuEl && menuEl.contains(active));
    if (!focusIsLoose) return;
    try { back.focus({ preventScroll: true }); } catch (e) {}
  }

  // Ok tuşlarıyla menü öğeleri arasında gezinme (görünür [role=menuitem] düğmeler, sarmalı)
  function attachMenuKeyboard(menuEl) {
    if (!menuEl) return;
    menuEl.addEventListener('keydown', event => {
      const key = event.key;
      if (key !== 'ArrowDown' && key !== 'ArrowUp' && key !== 'Home' && key !== 'End') return;
      const items = Array.from(menuEl.querySelectorAll('button[role="menuitem"]'))
        .filter(b => !b.disabled && b.offsetParent !== null);
      if (!items.length) return;
      event.preventDefault();
      event.stopPropagation();
      const current = items.indexOf(document.activeElement);
      let next;
      if (key === 'Home') next = 0;
      else if (key === 'End') next = items.length - 1;
      else if (key === 'ArrowDown') next = current < 0 ? 0 : (current + 1) % items.length;
      else next = current < 0 ? items.length - 1 : (current - 1 + items.length) % items.length;
      try { items[next].focus({ preventScroll: true }); } catch (e) {}
    });
  }

  function closeToolbarMoreMenu() {
    const wasOpen = !!(els.toolbarMoreMenu && els.toolbarMoreMenu.classList.contains('is-open'));
    if (els.toolbarMoreMenu) {
      els.toolbarMoreMenu.classList.remove('is-open');
      els.toolbarMoreMenu.setAttribute('aria-hidden', 'true');
    }
    if (els.moreButton) {
      els.moreButton.setAttribute('aria-expanded', 'false');
    }
    if (wasOpen) restoreMenuFocus(els.toolbarMoreMenu);
  }

  function openToolbarMoreMenu() {
    if (!els.toolbarMoreMenu) return;
    closeColumnMenu();
    state.menuReturnFocus = document.activeElement;
    state.toolbarMoreOpenedAt = Date.now();
    els.toolbarMoreMenu.classList.add('is-open');
    els.toolbarMoreMenu.setAttribute('aria-hidden', 'false');
    if (els.moreButton) {
      els.moreButton.setAttribute('aria-expanded', 'true');
    }
    const first = Array.from(els.toolbarMoreMenu.querySelectorAll('button[role="menuitem"]')).find(b => b.offsetParent !== null);
    if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
  }

  function toggleToolbarMoreMenu() {
    if (!els.toolbarMoreMenu) return;
    const isOpen = els.toolbarMoreMenu.classList.contains('is-open');
    if (isOpen) {
      closeToolbarMoreMenu();
    } else {
      openToolbarMoreMenu();
    }
  }

  /* FIELDS-MR18-BEGIN */
  // ═══════════════════════════════════════════════════════════════════════════
  // mr18 / tb1 — fields where you look. Every "add field" entry ("+" header · Insert left / right · More › Add field ·
  // empty state · dynamicTable.addField(ctx?)) goes through openAddField(ctx). Gate: a screen id in the config, the live
  // app (no /version-test) and fetch → mirror_screen_fields (8 s, 30 s cache, prefetched 1500 ms after the first paint)
  // → the New field popover when the screen is the user's own copy (can_edit), otherwise Bubble's popup exactly as
  // before (bubble_fn_add_field() with NO argument when no column context; a JSON {anchorColumnId, side} otherwise).
  // Add → an optimistic column where the user clicked (pending while the write is in flight) → mirror_field_create
  // (20 s; +5 s silent re-read on a timeout) → confirmed (check, 600 ms) or removed. The screen and the table are decided
  // on the server (screen record → Anasheet, organisation from the signed-in user); the popover sends the screen id only.
  // Memory only: state.fieldOps / pendingFields / serverPatch die with the page.
  // ═══════════════════════════════════════════════════════════════════════════
  /* DT-NORMKEY: copy of gaia_mirror_core norm/normKey — keep identical */
    const _TR_LOWER = { 'İ': 'i', 'I': 'ı' };
    const _TR_FOLD = { 'ı': 'i', 'ş': 's', 'ğ': 'g', 'ü': 'u', 'ö': 'o', 'ç': 'c', 'â': 'a', 'î': 'i', 'û': 'u', 'ê': 'e', 'ô': 'o' };
    function lower(s) {
        return String(s === null || s === undefined ? '' : s).replace(/[İI]/g, function (c) { return _TR_LOWER[c]; }).toLowerCase();
    }
    // norm: lower-case (Turkish rules), diacritics folded, whitespace collapsed, trimmed → the comparison form
    function norm(s) {
        let t = lower(s);
        if (t.normalize) t = t.normalize('NFC');
        t = t.replace(/[ışğüöçâîûêô]/g, function (c) { return _TR_FOLD[c] || c; });
        return t.replace(/\s+/g, ' ').trim();
    }
    // key: norm with everything but letters and digits removed → "Servis telefonu" == "servis_telefonu" == "ServisTelefonu"
    function normKey(s) { return norm(s).replace(/[^a-z0-9]+/g, ''); }
  /* /DT-NORMKEY */
  const dtNormKey = normKey;

  // chips = the 9 server-allowed types (data-type = the Bubble display string the op takes)
  const DT_FIELD_TYPES = [
    { type: 'Text', label: 'Text', canon: 'text' }, { type: 'Number', label: 'Number', canon: 'number' },
    { type: 'Date', label: 'Date', canon: 'date' }, { type: 'Checkbox', label: 'Checkbox', canon: 'boolean' },
    { type: 'Multiline text', label: 'Long text', canon: 'textarea' }, { type: 'Phone', label: 'Phone', canon: 'phone' },
    { type: 'E-mail', label: 'Email', canon: 'email' }, { type: 'Dropdown', label: 'Dropdown', canon: 'dropdown' },
    { type: 'Image&Pdf', label: 'File', canon: 'file' }
  ];
  const DT_FIELD_MULTI = { 'Dropdown': 1, 'Image&Pdf': 1 };
  // the server's _GM_RESERVED_NK: normKey of these names ('RefereDeğer' → 'referedeger', '_id' → 'id')
  const DT_FIELD_RESERVED = {};
  ['RefereDeğer', 'NotVisible', 'NotAvailable', 'Uniqueid', 'stage', 'lists', '_id', 'uniqueid'].forEach(n => { DT_FIELD_RESERVED[dtNormKey(n)] = 1; });
  const DT_FIELD_ROLES = [['mandatory', 'Enter'], ['control', 'Review'], ['optional', 'Optional']];
  const DT_FIELD_LIMITS = { name_max: 60, options_max: 100, option_max_len: 80, meta_ttl_ms: 30000, read_timeout_ms: 8000, write_timeout_ms: 20000, reread_ms: 5000, prefetch_ms: 1500, confirm_ms: 600, toast_ms: 6000, check_ms: 250 };
  const DT_BUBBLE_ID = /^\d{13}x\d{15,20}$/;
  const DT_GLYPH = { ok: '\u2713', back: '\u21A9', warn: '\u26A0', bad: '\u00D7' };

  function dtReducedMotion() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
  function newFieldOpId() { return 'f' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  // mr18 R8: the value signature the server fingerprints (screen is implicit: a popover writes to the screen it was opened on)
  function fieldValuesSig(name, type, multiple, options, role, process) { try { return JSON.stringify({ nk: dtNormKey(name), type: String(type || ''), multiple: !!multiple, options: (Array.isArray(options) ? options.slice() : []), role: process ? String(role || 'mandatory') : 'control' }); } catch (e) { return ''; } }
  // a screen RECORD id is the only anchor a field write takes (stage / list alone never write); read from the config the
  // table runs on (mirror mode: the one aynaLoad holds; Bubble data: the script tag, parsed once per text — it may carry rows)
  function fieldScreenId() {
    try {
      if (AYNA.cfg) { const s = aynaScreenOf(AYNA.cfg).screen; return DT_BUBBLE_ID.test(s) ? s : ''; }
      const el = document.getElementById('bubble-table-config'), text = (el && el.textContent) || '';
      if (state._fieldCfgText !== text) {
        state._fieldCfgText = text;
        let c = {}; try { c = parseBubbleConfig(text.trim() || '{}') || {}; } catch (e) { c = {}; }
        const s = aynaScreenOf(c).screen;
        state._fieldCfgScreen = DT_BUBBLE_ID.test(s) ? s : '';
      }
      return state._fieldCfgScreen || '';
    } catch (e) { return ''; }
  }
  function fieldOpsPossible() { return !!fieldScreenId() && String(location.pathname || '').indexOf('/version-test') === -1 && typeof fetch === 'function'; }
  // mr18b: the page's assistant (state.wake.assistantId: config / BUBBLE_INPUTS / DOM / setAssistant, via applyWakeConfig) rides
  // along on a create → the server appends the new view to that assistant's role list (it checks org + table itself); a Bubble id only
  function fieldAssistantId() {
    try { const a = String((state.wake && state.wake.assistantId) || '').trim(); return DT_BUBBLE_ID.test(a) ? a : ''; } catch (e) { return ''; }
  }
  // mirror_screen_fields → {ok, meta} | {error}; a success (can_edit or not) is cached 30 s per screen id, errors are not
  function loadScreenFields(force) {
    const sid = fieldScreenId();
    if (!sid) return Promise.resolve({ error: 'no-screen' });
    let fo = state.fieldOps;
    if (fo.screenId !== sid) { fo = state.fieldOps = { screenId: sid, at: 0, meta: null, ready: false, inflight: null }; }
    if (!force && fo.meta && Date.now() - fo.at < DT_FIELD_LIMITS.meta_ttl_ms) return Promise.resolve({ ok: true, meta: fo.meta });
    if (!force && fo.inflight) return fo.inflight;
    const p = aynaBridge('mirror_screen_fields', { screen_id: sid }, null, { timeoutMs: DT_FIELD_LIMITS.read_timeout_ms }).then(r => {
      if (fo.inflight === p) fo.inflight = null;

        if (fieldScreenId() !== sid0) return;   // T2: the page moved to another screen: no insert, no patch, no toast
        if (state.fieldPop) { try { runFieldCheck(false); } catch (e) {} }   // an open popover re-checks the name (Saving → the answer)
        if (r && r.ok) {
          const cp = (r.data && r.data.column_patch) || {};
          state.serverPatch.added.delete(name);
          state.serverPatch.screen = payload.screen_id;
          state.serverPatch.removed.set(name, { viewId, index: Number.isInteger(cp.index) ? cp.index : gridIndex, gridIndex, column: raw, at: Date.now() });
          loadScreenFields(true);
          if (AYNA.cfg) aynaProjectionChanged(false);
          fieldAnnounce('Field hidden');
          showActionToast('Field hidden', 'Undo', () => showField({ name, view_id: viewId, type: raw.type, multi: raw.multiple }, null), DT_FIELD_LIMITS.toast_ms, sid0);
          return;
        }
        insertFieldColumn(Object.assign({}, raw, { viewId }), { index: gridIndex }, false);   // not hidden: the column comes back where it was
        const kod = String((r && r.kod) || ''), err = String((r && r.error) || '');
        if (kod === 'upstream' || kod === 'busy' || (!kod && (err === 'network' || err === 'timeout' || err === 'http' || err === 'shape'))) showActionToast('Not saved', 'Retry', () => run(), 8000, sid0);   // same op_id
        else if (kod === 'rate') showActionToast('Too many changes', '', null, undefined, sid0);
      });
    };
    run();
  }
  // Bubble's config echo (reloadFromConfig) and the mirror reload: this page's server-confirmed adds (and in-flight ones)
  // are spliced in until Bubble's config carries them, confirmed hides are taken out until it drops them → the patched
  // config has the table's own column ids → classifyView says "same layout" → order, widths, filters, sort, search,
  // selection carry. Memory only.
  function applyServerPatch(config) {
    try {
      if (!config || typeof config !== 'object' || !Array.isArray(config.columns)) return config;
      const sid = aynaScreenOf(config).screen;
      fieldScreenSync(sid);   // T1/T2/T8: toasts / popover / meta / in-flight writes of another screen go
      const cols = config.columns;
      // T4: a transient empty column list (Bubble's two-step render) stays empty → the empty state keeps the view and this
      // patch; only a table whose columns are all its own adds (the first field of an empty screen) keeps receiving them
      const own = state.columns.filter(c => c && !c.__uiOnly);
      if (!cols.length && own.length && !own.every(c => state.serverPatch.added.has(c.id) || state.pendingFields.has(c.id))) return config;
      // T9: an entry keyed by another spelling of the same field is never spliced as a second column
      const has = id => { const nk = dtNormKey(id); return cols.some(c => { const k = cfgColId(c); return k === id || (!!nk && dtNormKey(k) === nk); }); };
      // the patch belongs to one screen: a config of another screen drops it (never splices a column into a foreign screen);
      // T4: a config without a screen id keeps it
      if (sid && state.serverPatch.screen && sid !== state.serverPatch.screen) { state.serverPatch.added.clear(); state.serverPatch.removed.clear(); state.serverPatch.screen = ''; }
      state.serverPatch.added.forEach((e, name) => {
        if (has(name)) { state.serverPatch.added.delete(name); return; }
        cols.splice(Math.min(Math.max(0, e.index || 0), cols.length), 0, e.column);   // the same object: a later confirm updates every copy
      });
      state.pendingFields.forEach((p, name) => { if (p.kind !== 'hide' && p.payload && p.payload.screen_id === sid && !has(name)) cols.splice(Math.min(Math.max(0, p.index || 0), cols.length), 0, p.col); });   // T5: a hide inserts nothing
      state.serverPatch.removed.forEach((e, name) => {
        const i = cols.findIndex(c => cfgColId(c) === name);
        if (i < 0) state.serverPatch.removed.delete(name); else cols.splice(i, 1);
      });
    } catch (e) {}
    return config;
  }

  // Alt paneli (filtre / sıralama) görünür alana (viewport) göre yerleştirir.
  // Öncelik: menünün sağı → sığmazsa menünün solu → o da sığmazsa menünün üstüne, sağ kenara yaslı.
  // Dikeyde tetikleyici satırla hizalanır; alttan taşarsa yukarı kaydırılır, üstten taşmaz.
  function positionSubmenu(panelEl, triggerEl) {
    if (!panelEl || !els.columnMenu) return;
    if (isMobileViewport()) {
      panelEl.style.left = '0px';
      panelEl.style.top = 'auto';
      panelEl.style.maxHeight = '';
      return;
    }
    const GAP = 8;
    const EDGE = 8;
    const vw = window.innerWidth || document.documentElement.clientWidth || 1280;
    const vh = window.innerHeight || document.documentElement.clientHeight || 720;

    // Ölçmek için geçici olarak görünmez şekilde aç
    const wasOpen = panelEl.classList.contains('is-open');
    if (!wasOpen) {
      panelEl.style.visibility = 'hidden';
      panelEl.classList.add('is-open');
    }
    panelEl.style.maxHeight = `${Math.max(200, vh - EDGE * 2)}px`;

    const menuRect = els.columnMenu.getBoundingClientRect();
    const triggerRect = (triggerEl || els.columnMenu).getBoundingClientRect();
    const panelW = panelEl.offsetWidth || 300;
    const panelH = panelEl.offsetHeight || 300;

    let left;
    if (menuRect.right + GAP + panelW <= vw - EDGE) {
      left = menuRect.right + GAP;
    } else if (menuRect.left - GAP - panelW >= EDGE) {
      left = menuRect.left - GAP - panelW;
    } else {
      left = Math.max(EDGE, Math.min(vw - EDGE - panelW, menuRect.right - panelW));
    }

    let top = triggerRect.top - 6;
    if (top + panelH > vh - EDGE) top = vh - EDGE - panelH;
    if (top < EDGE) top = EDGE;

    panelEl.style.left = `${Math.round(left)}px`;
    panelEl.style.top = `${Math.round(top)}px`;

    if (!wasOpen) {
      panelEl.classList.remove('is-open');
      panelEl.style.visibility = '';
    }
  }

  function setupSheetDismiss(element, onClose) {
    if (!element || typeof onClose !== 'function') return;
    const handle = element.querySelector('.dt-sheet-handle');
    if (!handle) return;

    let startY = 0;
    let dragging = false;

    const onTouchMove = event => {
      if (!dragging || !isMobileViewport()) return;
      const touch = event.touches[0];
      const delta = Math.max(0, touch.clientY - startY);
      element.style.transition = 'none';
      element.style.transform = `translateY(${delta}px)`;
      if (delta > 0) {
        event.preventDefault();
      }
    };

    const onTouchEnd = event => {
      if (!dragging) return;
      dragging = false;
      const touch = event.changedTouches[0];
      const delta = Math.max(0, touch.clientY - startY);
      element.style.transition = '';
      element.style.transform = '';
      if (delta >= 70) {
        onClose();
      }
      document.removeEventListener('touchmove', onTouchMove);
      document.removeEventListener('touchend', onTouchEnd);
      document.removeEventListener('touchcancel', onTouchEnd);
    };

    handle.addEventListener('touchstart', event => {
      if (!isMobileViewport()) return;
      const touch = event.touches[0];
      startY = touch.clientY;
      dragging = true;
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('touchend', onTouchEnd, { passive: true });
      document.addEventListener('touchcancel', onTouchEnd, { passive: true });
    }, { passive: true });
  }

  // T5.4: one item per typed key (dtValueKeys): numbers / dates / booleans by value, dropdown tokens split
  // ("KAPANIS, IPTAL" → 2 items). item.raw = key; applyAllColumnFilters turns the checked keys back into the
  // exact typed cell values for HOT's by_value (dtByValueList). Labels as displayed; blank first as before.
  function getColumnDistinctValues(columnIndex) {
    const column = getColumnAt(columnIndex);
    if (!column) return [];
    const byKey = new Map();
    state.rawRows.forEach(row => {
      const typed = dtTypedValue(column, pickValue(row, column));
      const keys = dtValueKeys(column, typed);
      const toks = column.type === 'dropdown' ? dtDropdownTokens(column, typed) : null;
      keys.forEach((key, i) => {
        if (byKey.has(key)) return;
        let label, sortKey = null, group = 2;
        if (key === BLANK_VALUE_TOKEN) { label = '(Blank cells)'; group = 0; }
        else if (key.indexOf('n:') === 0) { label = dtNumberText(column, typed); sortKey = typed; group = 1; }
        else if (key.indexOf('d:') === 0) { label = dtIsoText(typed); sortKey = typed; group = 1; }
        else if (key.indexOf('b:') === 0) { label = typed ? 'Checked' : 'Not checked'; sortKey = typed ? 0 : 1; group = 1; }
        else if (key.indexOf('t:') === 0 && toks) label = toks[i];
        else label = dtRawText(typed);
        byKey.set(key, { raw: key, label: String(label), sortKey, group });
      });
    });
    const coll = dtCollator();
    return Array.from(byKey.values()).sort((a, b) => {
      if (a.group !== b.group) return a.group - b.group;
      if (a.group === 1) return a.sortKey < b.sortKey ? -1 : (a.sortKey > b.sortKey ? 1 : 0);
      return coll.compare(a.label, b.label);
    });
  }

  function renderFilterValueList() {
    if (!els.filterValuesWrap || !state.filterDraft) return;
    const term = String(els.filterSearchInput?.value || '');
    const filtered = state.filterDraft.allValues.filter(item => foldMatch(item.label, term));
    els.filterValuesWrap.innerHTML = filtered.map(item => {
      const checked = state.filterDraft.selectedValues.has(item.raw) ? 'checked' : '';
      const safeLabel = escapeHtml(item.label);
      const safeRaw = escapeHtml(item.raw);
      return `<label class="dt-filter-value-item"><input type="checkbox" class="dt-filter-value-checkbox" data-value="${safeRaw}" ${checked} /><span>${safeLabel}</span></label>`;
    }).join('');
  }

  function conditionNeedsValue(condition) {
    // T5: none / empty / not_empty and the term-less date + boolean conditions take no value
    return !DT_NO_VALUE_CONDITIONS[condition || 'none'];
  }

  // T5.2: fill a condition <select> (ids kept) with the kind's conditions; returns the kept value
  // (a saved condition the kind does not offer resets to none)
  function dtFillConditionSelect(sel, kind, current) {
    const list = DT_FILTER_CONDITIONS[kind] || DT_FILTER_CONDITIONS.text;
    const value = list.indexOf(current) >= 0 ? current : 'none';
    if (!sel) return value;
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    list.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = DT_CONDITION_LABELS[id] || id;
      sel.appendChild(opt);
    });
    sel.value = value;
    return value;
  }

  function syncFilterPanelVisibility() {
    if (!state.filterDraft) return;

    const hasPrimaryCondition = state.filterDraft.condition !== 'none';
    const showPrimaryValue = conditionNeedsValue(state.filterDraft.condition);
    const showSecondarySelect = hasPrimaryCondition;
    const showSecondaryValue = hasPrimaryCondition && conditionNeedsValue(state.filterDraft.condition2 || 'none');

    if (els.filterConditionValueInput) {
      els.filterConditionValueInput.style.display = showPrimaryValue ? '' : 'none';
      els.filterConditionValueInput.disabled = !showPrimaryValue;
    }

    if (els.filterOperatorRow) {
      els.filterOperatorRow.style.display = showSecondarySelect ? 'flex' : 'none';
    }

    if (els.filterConditionSelect2) {
      els.filterConditionSelect2.style.display = showSecondarySelect ? '' : 'none';
    }

    if (els.filterConditionValueInput2) {
      els.filterConditionValueInput2.style.display = showSecondaryValue ? '' : 'none';
      els.filterConditionValueInput2.disabled = !showSecondaryValue;
    }

    if (!hasPrimaryCondition) {
      state.filterDraft.operator = 'and';
      state.filterDraft.condition2 = 'none';
      state.filterDraft.valueTerm2 = '';
      if (els.filterOperatorAnd) els.filterOperatorAnd.checked = true;
      if (els.filterOperatorOr) els.filterOperatorOr.checked = false;

      if (els.filterConditionValueInput2) els.filterConditionValueInput2.value = '';

  }

  function openFilterPanel(columnIndex) {
    if (!Number.isInteger(columnIndex) || columnIndex < 0) return;
    const existing = state.filterConfigs[columnIndex] || { condition: 'none', condition2: 'none', operator: 'and', values: null };
    const allValues = getColumnDistinctValues(columnIndex);
    const allRawValues = allValues.map(item => item.raw);
    const selectedValues = new Set(Array.isArray(existing.values) && existing.values.length ? existing.values : allRawValues);
    // T5.2: conditions per column kind (text / number / date / boolean / tags) in the same two selects
    const fkind = dtFilterKind(getColumnAt(columnIndex) || {});
    const cond1 = dtFillConditionSelect(els.filterConditionSelect, fkind, existing.condition || 'none');
    const cond2 = cond1 === 'none' ? dtFillConditionSelect(els.filterConditionSelect2, fkind, 'none')
      : dtFillConditionSelect(els.filterConditionSelect2, fkind, existing.condition2 || 'none');
    const termPlaceholder = fkind === 'date' ? 'dd.mm.yyyy' : 'Value';
    if (els.filterConditionValueInput) els.filterConditionValueInput.placeholder = termPlaceholder;
    if (els.filterConditionValueInput2) els.filterConditionValueInput2.placeholder = termPlaceholder;
    state.filterDraft = {
      columnIndex,
      condition: cond1,
      valueTerm: cond1 === existing.condition ? (existing.valueTerm || '') : '',
      condition2: cond2,
      valueTerm2: cond2 === existing.condition2 ? (existing.valueTerm2 || '') : '',
      operator: existing.operator || 'and',
      allValues,
      selectedValues
    };
    // AYNA window mode: the page on screen holds only part of the values → the list is completed from the mirror (async)
    if (typeof aynaWindowed === 'function' && aynaWindowed()) aynaFillDistinct(columnIndex);

    if (els.filterConditionSelect) {
      els.filterConditionSelect.value = state.filterDraft.condition;
    }
    if (els.filterConditionValueInput) {
      const disabled = !conditionNeedsValue(state.filterDraft.condition);
      els.filterConditionValueInput.disabled = disabled;
      els.filterConditionValueInput.value = state.filterDraft.valueTerm || '';
    }
    if (els.filterOperatorAnd) {
      els.filterOperatorAnd.checked = state.filterDraft.operator !== 'or';
    }
    if (els.filterOperatorOr) {
      els.filterOperatorOr.checked = state.filterDraft.operator === 'or';
    }
    if (els.filterConditionSelect2) {
      els.filterConditionSelect2.value = state.filterDraft.condition2 || 'none';
    }
    if (els.filterConditionValueInput2) {
      const disabled2 = !conditionNeedsValue(state.filterDraft.condition2 || 'none');
      els.filterConditionValueInput2.disabled = disabled2;
      els.filterConditionValueInput2.value = state.filterDraft.valueTerm2 || '';
    }
    if (els.filterSearchInput) {
      els.filterSearchInput.value = '';
    }
    // Kayıtlı koşul varsa "Conditions" bölümü açık gelsin
    try {
      const adv = document.getElementById('dt-filter-advanced');
      if (adv) adv.open = state.filterDraft.condition !== 'none';
    } catch (e) {}
    syncFilterPanelVisibility();
    renderFilterValueList();

    if (els.filterPanel) {
      els.filterPanel.classList.add('is-open');
    }
    if (els.columnMenu) {
      els.columnMenu.classList.add('is-filter-mode');
      els.columnMenu.classList.remove('is-sort-mode');
    }
    if (els.filterSearchInput) {
      try { els.filterSearchInput.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function applyAllColumnFilters() {
    if (!state.hot || typeof state.hot.getPlugin !== 'function') return;
    const filterPlugin = state.hot.getPlugin('filters');
    if (!filterPlugin) return;
    // AYNA window mode: the panel's conditions go to the mirror (one page comes back); the grid never filters itself.
    // Any condition left in the plugin from a small-screen view is cleared so it cannot hide rows of the page.
    if (typeof aynaWindowed === 'function' && aynaWindowed()) {
      try { filterPlugin.clearConditions(); if (state._hotFiltered) { keepOutsideFocus(() => filterPlugin.filter()); state._hotFiltered = false; } } catch (e) {}
      aynaCriteriaChanged('filters');
      return;
    }

    try {
      // T1: tüm koşullar temizlenir (eski döngü kolon kümesi değişince yüksek index'lerdeki koşulları kaçırıyordu)
      filterPlugin.clearConditions();

      Object.keys(state.filterConfigs).forEach(key => {
        const col = Number(key);
        const config = state.filterConfigs[key];
        if (!Number.isInteger(col) || !config) return;
        // T1: anahtar fiziksel; HOT addCondition görsel index bekler
        const vcol = typeof state.hot.toVisualColumn === 'function' ? state.hot.toVisualColumn(col) : col;
        if (vcol === null || vcol === undefined || vcol < 0) return;
        const colDef = (state._mountedCols || [])[col] || getColumnAt(col);
        if (!colDef || colDef.__uiOnly) return;

        // T5.3: panel conditions → HOT built-ins on the typed cell values (gxHotCondition; null = no condition)
        const conds = [
          gxHotCondition(colDef, config.condition, config.valueTerm || ''),
          gxHotCondition(colDef, config.condition2, config.valueTerm2 || '')
        ].filter(Boolean);
        const hasValues = Array.isArray(config.values) && config.values.length > 0;
        // HOT allows ONE operation per column (mixing conjunction/disjunction throws): Or → disjunction, and with a
        // value list 'disjunctionWithExtraCondition' = (c1 OR c2) AND by_value
        let op = 'conjunction';
        if (conds.length === 2 && config.operator === 'or') op = hasValues ? 'disjunctionWithExtraCondition' : 'disjunction';
        conds.forEach(c => filterPlugin.addCondition(vcol, c.name, c.args, op));
        // T5.4: checked keys → the exact typed cell values (HOT by_value compares with Set.has)
        if (hasValues) filterPlugin.addCondition(vcol, 'by_value', [dtByValueList(colDef, config.values)], op);
      });

      // T1: afterFilter → handleSelection, filtre sonrası kaymış görsel koordinattan BAŞKA kaydı seçmesin;
      // seçim aşağıda kayıt id'siyle yeniden eşlenir (mount içindeyse mount sonunda)
      const wasSyncing = state._syncingSelection;
      state._syncingSelection = true;
      try { keepOutsideFocus(() => filterPlugin.filter()); } finally { state._syncingSelection = wasSyncing; }
      // T6: HOT sorts only the rows visible at sort time → re-apply the active sort so rows this filter change
      // reveals are ordered too (a mount re-applies the id-keyed sort itself, right after this call)
      if (!state._mounting) {
        try {
          const cs = state.hot.getPlugin('columnSorting');
          const sc = cs && cs.getSortConfig();
          if (sc && sc.length) {
            state._syncingSelection = true;
            try { keepOutsideFocus(() => cs.sort(sc[0])); } finally { state._syncingSelection = wasSyncing; }
          }
        } catch (e) {}
      }
      state._hotFiltered = Object.keys(state.filterConfigs).length > 0;
      // Filtre göstergeleri için kolon başlıklarını yenile
      if (typeof state.hot.render === 'function') {
        state.hot.render();
      }
      syncHotSelectionFromState();
      saveViewCarry();
    } catch (err) {
      console.warn('Filter apply failed', err);
      if (typeof showWakeToast === 'function') showWakeToast('Filter could not be applied', 'error');
    }
  }
