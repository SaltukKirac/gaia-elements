

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.0/dist/handsontable.full.min.css" />

<style>
/* MARKA UI DİLİ B5 (2026-07-04) — shared tokens, see MARKA_UI_DILI.md §2 */
:root {
  --gx-font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gx-primary: #6366f1;
  --gx-primary-deep: #4f46e5;
  --gx-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
  --gx-ink: #0f172a;  --gx-ink-2: #475569;  --gx-ink-3: #94a3b8;
  --gx-line: #e2e8f0; --gx-line-soft: #eef2f7;
  --gx-bg: #f8fafc;   --gx-surface: #ffffff; --gx-field: #f6f7f9;
  --gx-ok: #16a34a;   --gx-ok-bg: #f0fdf4;
  --gx-err: #dc2626;  --gx-err-bg: #fef2f2;
  --gx-r-sm: 6px; --gx-r-md: 10px; --gx-r-lg: 16px; --gx-r-pill: 999px;
  --gx-shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --gx-shadow-md: 0 8px 24px -12px rgba(15,23,42,.18);
  --gx-ring: 0 0 0 3px rgba(99,102,241,.12);
  --gx-warn: #d97706; --gx-warn-bg: #fffbeb;   /* mr18: "Used elsewhere" glyph */
  --dt-motion: 140ms; --dt-motion-fast: 120ms; /* mr18: popover / chip */
}

#dynamic-table-wrapper {
  --dt-bg: var(--gx-surface, #ffffff);
  --dt-surface: var(--gx-surface, #ffffff);
  --dt-border: var(--gx-line, #e2e8f0);
  --dt-border-strong: var(--gx-line, #e2e8f0);
  --dt-primary: var(--gx-primary, #6366f1);
  --dt-text: var(--gx-ink, #0f172a);
  --dt-muted: var(--gx-ink-2, #475569);
  --dt-highlight: #eef2ff;
  --dt-row-header-width: 44px;
  --dt-row-h: 36px;   /* veri satırı + satır başlığı yüksekliği (tek kaynak) */
  --dt-ctl-h: 36px;   /* masaüstü araç çubuğu kontrol yüksekliği */
}

#dynamic-table-wrapper,
#dynamic-table-wrapper * {
  box-sizing: border-box;
}

#dynamic-table-wrapper {
  width: 100%;
  height: 100%;
  min-height: 0;
  position: relative; /* wake modal/toast absolute konumlanır */
  display: flex;
  flex-direction: column;
  font-family: var(--gx-font, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);
  color: var(--dt-text);
}

#dynamic-table-wrapper .dt-inner {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--dt-bg);
  border: 0;
  border-radius: 0;
  padding: 0;
  gap: 0;
}

#dynamic-table-wrapper .dt-header {
  padding: 0;
}

#dynamic-table-wrapper .dt-toolbar {
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-top: 0;
  border-bottom: 0;
  background: #fff;
}

#dynamic-table-wrapper .dt-toolbar-left,
#dynamic-table-wrapper .dt-toolbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

#dynamic-table-wrapper .dt-toolbar-left {
  padding-left: 0;
}

@media (min-width: 992px) {
  #dynamic-table-wrapper .dt-toolbar-left {
    padding-left: var(--dt-row-header-width);
  }

  #dynamic-table-wrapper .dt-toolbar-right {
    padding-right: var(--dt-row-header-width);
  }
}

#dynamic-table-wrapper .dt-icon-btn,
#dynamic-table-wrapper .dt-action-btn {
  height: var(--dt-ctl-h);
  border-radius: var(--gx-r-md, 10px);
  border: 1px solid transparent;
  background: transparent;
  color: var(--dt-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
}

#dynamic-table-wrapper .dt-icon-btn {
  width: var(--dt-ctl-h);
  padding: 0;
  font-size: 18px;
}

#dynamic-table-wrapper .dt-icon-btn--sm {
  width: 32px;
  height: 32px;
}

#dynamic-table-wrapper .dt-svg-icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#dynamic-table-wrapper .dt-icon-btn:hover,
#dynamic-table-wrapper .dt-action-btn:hover,
#dynamic-table-wrapper .dt-action-btn[aria-expanded='true'] {
  background: var(--gx-bg, #f8fafc);
  border-color: var(--gx-line-soft, #eef2f7);
  color: var(--dt-text);
}

#dynamic-table-wrapper .dt-action-btn-primary {
  background: var(--gx-grad, linear-gradient(135deg, #6366f1, #8b5cf6));
  color: #fff;
  border-color: transparent;
  border-radius: var(--gx-r-md, 10px);
  font-weight: 600;
  min-width: 78px;
  transition: filter 160ms ease, transform 120ms ease, box-shadow 160ms ease;
}

#dynamic-table-wrapper .dt-action-btn-primary:hover {
  background: var(--gx-grad, linear-gradient(135deg, #6366f1, #8b5cf6));
  color: #fff;
  filter: brightness(1.04);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(99, 102, 241, .25);
}

#dynamic-table-wrapper .dt-action-btn-primary:active {
  transform: scale(.97);
}

#dynamic-table-wrapper #dt-btn-new {
  padding: 0 12px 0 10px;
}

#dynamic-table-wrapper #dt-btn-new .dt-svg-icon {
  width: 16px;
  height: 16px;
  stroke-width: 2.2;
}

/* Klavye odağı — menü/panel öğeleri (tek kural) */
#dynamic-table-wrapper .dt-column-menu-item:focus-visible,
#dynamic-table-wrapper .dt-sort-option:focus-visible,
#dynamic-table-wrapper .dt-filter-btn:focus-visible,
#dynamic-table-wrapper .dt-filter-link:focus-visible,
#dynamic-table-wrapper .dt-toolbar-more-item:focus-visible,
#dynamic-table-wrapper .dt-header-action-btn:focus-visible,
#dynamic-table-wrapper .dt-due-date-config-btn:focus-visible,
#dynamic-table-wrapper .dt-due-date-clear-btn:focus-visible,
#dynamic-table-wrapper .dt-wake-actions button:focus-visible,
#dynamic-table-wrapper #dt-create-row:focus-visible,
#dynamic-table-wrapper .dt-row-open:focus-visible {
  outline: 2px solid var(--gx-primary, #6366f1);
  outline-offset: 2px;
}

/* ── Edit assistant ikonu (Ask Assistant butonunun solunda) ──────────────── */
#dynamic-table-wrapper #dt-btn-edit-agent {
  width: var(--dt-ctl-h);
  height: var(--dt-ctl-h);
  padding: 0;
  border-radius: var(--gx-r-md, 10px);
  border: 1px solid var(--gx-line, #e2e8f0);
  background: #fff;
  color: var(--gx-primary, #6366f1);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s ease, border-color .15s ease, transform .12s ease;
}

#dynamic-table-wrapper #dt-btn-edit-agent:hover {
  background: #eef2ff;
  border-color: #a5b4fc;
  transform: translateY(-1px);
}

#dynamic-table-wrapper #dt-btn-edit-agent svg {
  width: 15px;
  height: 15px;
}

/* ── Wake Agent butonu ─────────────────────────────────────────────────── */
#dynamic-table-wrapper #dt-btn-wake {
  height: var(--dt-ctl-h);
  padding: 0 12px;
  border-radius: var(--gx-r-md, 10px);
  border: none;
  background: var(--gx-grad, linear-gradient(135deg, #6366f1, #8b5cf6));
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: opacity 180ms ease, transform 120ms ease, box-shadow 180ms ease;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
}

#dynamic-table-wrapper #dt-btn-wake:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(99, 102, 241, 0.38);
  color: #fff;
  background: var(--gx-grad, linear-gradient(135deg, #6366f1, #8b5cf6));
}

#dynamic-table-wrapper #dt-btn-wake .dt-wake-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

#dynamic-table-wrapper #dt-btn-wake .dt-wake-icon svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
  stroke: none;
}

#dynamic-table-wrapper #dt-btn-wake.dt-wake-off {
  background: var(--gx-bg, #f8fafc);
  border: 1px solid var(--gx-line, #e2e8f0);
  color: var(--gx-ink-2, #475569);
  box-shadow: none;
}

#dynamic-table-wrapper #dt-btn-wake.dt-wake-off:hover {
  transform: none;
  box-shadow: none;
}

/* Agent yok → kurulum CTA'sı: dolu gradient yerine ince çerçeveli ikincil stil */
#dynamic-table-wrapper #dt-btn-wake.dt-wake-setup {
  background: #fff;
  color: #4338ca;
  border: 1px solid #c7d2fe;
  box-shadow: none;
}

#dynamic-table-wrapper #dt-btn-wake.dt-wake-setup:hover {
  background: #eef2ff;
  border-color: #a5b4fc;
  color: #4338ca;
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(99, 102, 241, 0.18);
}

#dynamic-table-wrapper #dt-btn-wake.dt-wake-setup .dt-wake-icon {
  color: var(--gx-primary, #6366f1);
}

#dynamic-table-wrapper #dt-btn-wake.dt-wake-busy {
  opacity: 0.75;
  pointer-events: none;
}

#dynamic-table-wrapper #dt-btn-wake .dt-wake-spin {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255, 255, 255, 0.45);
  border-top-color: #fff;
  border-radius: 50%;
  animation: dtSpin 0.8s linear infinite;
}

/* Tek dönme animasyonu (wake spinner + boş-durum yükleniyor halkası) */
@keyframes dtSpin { to { transform: rotate(360deg); } }

/* Wake modal — dinamik oluşturulur */
#dynamic-table-wrapper .dt-wake-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.24);
  z-index: 320;
  display: flex;
  align-items: center;
  justify-content: center;
}

#dynamic-table-wrapper .dt-wake-modal {
  width: 340px;
  max-width: 92%;
  background: #fff;
  border-radius: var(--gx-r-lg, 16px);
  box-shadow: 0 24px 48px -16px rgba(15, 23, 42, .22);
  padding: 18px;
  font-family: inherit;
}

/* Wake run modal — gövde alanları (openWakeRunPopover HTML'inde sınıf olarak kullanılır) */
#dynamic-table-wrapper .dt-wake-field-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--gx-ink-2, #475569);
  margin: 12px 0 6px;
}

#dynamic-table-wrapper .dt-wake-note {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  background: var(--gx-field, #f6f7f9);
  border: 1.5px solid var(--gx-line, #e2e8f0);
  border-radius: var(--gx-r-md, 10px);
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.4;
  font-family: var(--gx-font, inherit);
  color: var(--dt-text);
  resize: none;
  transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

#dynamic-table-wrapper .dt-wake-note:focus {
  outline: none;
  background: #fff;
  border-color: var(--gx-primary, #6366f1);
  box-shadow: var(--gx-ring, 0 0 0 3px rgba(99,102,241,.12));
}

#dynamic-table-wrapper .dt-wake-scope {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  min-height: 36px;
  cursor: pointer;
  color: var(--dt-text);
}

#dynamic-table-wrapper .dt-wake-scope input[type="radio"] {
  accent-color: var(--gx-primary, #6366f1);
  margin: 0;
}

#dynamic-table-wrapper .dt-wake-hint {
  font-size: 12px;
  color: var(--dt-muted);
  margin: 10px 0 0;
  line-height: 1.5;
}

#dynamic-table-wrapper .dt-wake-modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 700;
  color: var(--dt-text);
}

#dynamic-table-wrapper .dt-wake-modal p {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--dt-muted);
}

#dynamic-table-wrapper .dt-wake-option {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 10px;
  border: 1.5px solid var(--dt-border);
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: border-color 150ms ease, background 150ms ease;
}

#dynamic-table-wrapper .dt-wake-option.is-selected {
  border-color: #6366f1;
  background: #f5f6ff;
}

#dynamic-table-wrapper .dt-wake-option .dt-wake-opt-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--dt-text);
}

#dynamic-table-wrapper .dt-wake-option .dt-wake-opt-desc {
  font-size: 11px;
  color: var(--dt-muted);
  margin-top: 2px;
  line-height: 1.4;
}

#dynamic-table-wrapper .dt-wake-remember {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--dt-muted);
  margin: 4px 0 12px;
  cursor: pointer;
}

#dynamic-table-wrapper .dt-wake-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

#dynamic-table-wrapper .dt-wake-actions button {
  border-radius: var(--gx-r-md, 10px);
  border: 1px solid var(--dt-border-strong);
  background: #fff;
  color: var(--dt-text);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  cursor: pointer;
}

#dynamic-table-wrapper .dt-wake-actions .dt-wake-primary {
  background: var(--gx-grad, linear-gradient(135deg, #6366f1, #8b5cf6));
  border-color: transparent;
  color: #fff;
}

/* Wake toast — beyaz yüzey, türe göre sol şerit */
#dynamic-table-wrapper .dt-wake-toast {
  position: absolute;
  right: 14px;
  bottom: 14px;
  z-index: 340;
  background: #fff;
  color: var(--gx-ink, #0f172a);
  font-size: 12px;
  padding: 9px 14px;
  border: 1px solid var(--gx-line-soft, #eef2f7);
  border-left: 3px solid var(--gx-ink-3, #94a3b8);
  border-radius: var(--gx-r-md, 10px);
  box-shadow: var(--gx-shadow-md, 0 8px 24px -12px rgba(15,23,42,.18));
  max-width: 320px;
  line-height: 1.45;
}

#dynamic-table-wrapper .dt-wake-toast.is-error { border-left-color: var(--gx-err, #dc2626); }
#dynamic-table-wrapper .dt-wake-toast.is-success { border-left-color: var(--gx-ok, #16a34a); }
/* mr18: toast with one action (Undo / Retry) */
#dynamic-table-wrapper .dt-action-toast { display: flex; align-items: center; gap: 12px; }
#dynamic-table-wrapper .dt-toast-action {
  border: 0; background: transparent; color: var(--gx-primary-deep, #4f46e5); cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: var(--gx-r-sm, 6px);
}
#dynamic-table-wrapper .dt-toast-action:hover { background: var(--gx-bg, #f8fafc); }
#dynamic-table-wrapper .dt-toast-action:focus-visible { outline: 2px solid var(--gx-primary, #6366f1); outline-offset: 2px; }
#dynamic-table-wrapper .dt-sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#dynamic-table-wrapper #dt-btn-import,
#dynamic-table-wrapper #dt-btn-download,
#dynamic-table-wrapper #dt-btn-more {
  padding: 0;
}

#dynamic-table-wrapper .dt-toolbar-more-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

#dynamic-table-wrapper .dt-toolbar-more-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 168px;
  border-radius: var(--gx-r-lg, 16px);
  border: 1px solid var(--gx-line-soft, #eef2f7);
  background: #fff;
  box-shadow: var(--gx-shadow-md, 0 8px 24px -12px rgba(15,23,42,.18));
  padding: 8px;
  display: none;
  z-index: 220;
}

#dynamic-table-wrapper .dt-toolbar-more-menu.is-open {
  display: block;
}

#dynamic-table-wrapper .dt-toolbar-more-item {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--gx-ink, #0f172a);
  text-align: left;
  border-radius: var(--gx-r-sm, 6px);
  padding: 10px 12px;
  min-height: 40px;
  display: block;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

#dynamic-table-wrapper .dt-toolbar-more-item:hover {
  background: var(--gx-bg, #f8fafc);
}

#dynamic-table-wrapper .dt-search-wrap {
  display: flex;
  align-items: center;
  width: 0;
  max-width: 360px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: width 180ms ease, opacity 180ms ease;
}

#dynamic-table-wrapper .dt-search-wrap.is-open {
  width: min(52vw, 340px);
  opacity: 1;
  pointer-events: auto;
}

/* Giriş alanları — marka ölçeği (arama, filtre paneli, due-date alan araması) */
#dynamic-table-wrapper .dt-search,
#dynamic-table-wrapper .dt-filter-select,
#dynamic-table-wrapper .dt-filter-search,
#dynamic-table-wrapper .dt-dd-field-search {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  border-radius: var(--gx-r-md, 10px);
  border: 1.5px solid var(--gx-line, #e2e8f0);
  font-size: 13px;
  font-family: inherit;
  color: var(--dt-text);
  background: var(--gx-field, #f6f7f9);
  transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

#dynamic-table-wrapper .dt-search:focus,
#dynamic-table-wrapper .dt-filter-select:focus,
#dynamic-table-wrapper .dt-filter-search:focus,
#dynamic-table-wrapper .dt-dd-field-search:focus {
  outline: none;
  background: #fff;
  border-color: var(--gx-primary, #6366f1);
  box-shadow: var(--gx-ring, 0 0 0 3px rgba(99,102,241,.12));
}

#dynamic-table-wrapper .dt-action-btn:focus-visible,
#dynamic-table-wrapper .dt-icon-btn:focus-visible {
  outline: none;
  border-color: var(--gx-primary, #6366f1);
  box-shadow: var(--gx-ring, 0 0 0 3px rgba(99,102,241,.12));
}

#dynamic-table-wrapper .dt-icon-btn-danger {
  color: var(--gx-err, #dc2626);
}

#dynamic-table-wrapper .dt-icon-btn-danger:hover {
  color: var(--gx-err, #dc2626);
  background: var(--gx-err-bg, #fef2f2);
  border-color: #fecaca;
}

#dynamic-table-wrapper .dt-hidden {
  display: none !important;
}

#dynamic-table-wrapper .dt-column-menu {
  position: absolute;
  top: 0;
  left: 0;
  min-width: 220px;
  border-radius: var(--gx-r-lg, 16px);
  border: 1px solid var(--gx-line-soft, #eef2f7);
  background: #fff;
  box-shadow: var(--gx-shadow-md, 0 8px 24px -12px rgba(15,23,42,.18));
  padding: 8px;
  display: none;
  z-index: 250;
}

#dynamic-table-wrapper .dt-sheet-handle {
  display: none;
}

#dynamic-table-wrapper .dt-column-menu.is-open {
  display: block;
}

#dynamic-table-wrapper .dt-column-menu-item {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--gx-ink, #0f172a);
  text-align: left;
  border-radius: var(--gx-r-sm, 6px);
  padding: 10px 12px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

#dynamic-table-wrapper .dt-column-menu-item:hover {
  background: var(--gx-bg, #f8fafc);
}

#dynamic-table-wrapper .dt-column-menu-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--gx-ink-3, #94a3b8);
  padding: 6px 12px 4px;
}

#dynamic-table-wrapper .dt-column-menu-divider {
  border: 0;
  border-top: 1px solid var(--gx-line-soft, #eef2f7);
  margin: 5px 0;
}

/* mr18: a pending column's menu (create in flight) — Filter / Sort greyed */
#dynamic-table-wrapper .dt-column-menu-item:disabled,
#dynamic-table-wrapper .dt-column-menu-item:disabled:hover { color: var(--gx-ink-3, #94a3b8); background: transparent; cursor: default; }

/* mr18: New field popover — desktop: fixed 320 px under its anchor; ≤768: bottom sheet (.dt-sheet) */
#dynamic-table-wrapper .dt-field-pop {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 300;
  width: 320px;
  max-width: calc(100vw - 16px);

}
@keyframes dtFieldPopIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

#dynamic-table-wrapper .dt-field-pop-glyph[data-glyph="bad"] { color: var(--gx-err, #dc2626); }
#dynamic-table-wrapper .dt-field-pop-line { min-height: 16px; margin-top: -4px; font-size: 12px; line-height: 16px; color: var(--gx-ink-2, #475569); }
#dynamic-table-wrapper .dt-field-pop-line[data-tone="warn"] { color: var(--gx-warn, #d97706); }
#dynamic-table-wrapper .dt-field-pop-line[data-tone="bad"] { color: var(--gx-err, #dc2626); }
#dynamic-table-wrapper .dt-field-chips { display: flex; flex-wrap: wrap; gap: 6px; }
#dynamic-table-wrapper .dt-field-chip {

#dynamic-table-wrapper .dt-field-chip.is-guess { animation: dtChipPop var(--dt-motion-fast, 120ms) ease-out; }
@keyframes dtChipPop { from { transform: scale(.96); } to { transform: scale(1); } }

#dynamic-table-wrapper .dt-field-switch {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0;

}
#dynamic-table-wrapper .dt-field-switch-knob { position: relative; width: 28px; height: 16px; border-radius: var(--gx-r-pill, 999px); background: var(--gx-line, #e2e8f0); transition: background 140ms ease; }
#dynamic-table-wrapper .dt-field-switch-knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform 140ms ease; }
#dynamic-table-wrapper .dt-field-switch[aria-checked="true"] .dt-field-switch-knob { background: var(--gx-primary, #6366f1); }
#dynamic-table-wrapper .dt-field-switch[aria-checked="true"] .dt-field-switch-knob::after { transform: translateX(12px); }
#dynamic-table-wrapper .dt-field-opts {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px;
  border: 1.5px solid var(--gx-line, #e2e8f0); border-radius: var(--gx-r-md, 10px); background: var(--gx-field, #f6f7f9);
}
#dynamic-table-wrapper .dt-field-opt-chip { display: inline-flex; align-items: center; gap: 4px; margin: 0; cursor: default; }
#dynamic-table-wrapper .dt-field-opt-chip:focus-visible { outline: 2px solid var(--gx-primary, #6366f1); outline-offset: 1px; }
#dynamic-table-wrapper .dt-field-opt-x { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; font-family: inherit; }
#dynamic-table-wrapper .dt-field-opt-input { flex: 1 1 90px; min-width: 90px; min-height: 26px; border: 0; outline: none; background: transparent; color: var(--dt-text); font-family: inherit; font-size: 13px; }
#dynamic-table-wrapper .dt-field-pop .is-shake { animation: dtShake 240ms ease; }

#dynamic-table-wrapper .dt-field-opt-chip.is-pulse { animation: dtPulse 360ms ease; }
@keyframes dtPulse { 50% { transform: scale(1.08); } }
#dynamic-table-wrapper .dt-field-roles { align-self: flex-start; display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--gx-line, #e2e8f0); border-radius: var(--gx-r-md, 10px); }
#dynamic-table-wrapper .dt-field-role {

<script>
(function() {
  'use strict';

  const DEBUG = /(?:^|[?&])dtdebug=1(?:&|$)/.test(String(location.search || ''));
  const log = (...args) => { if (DEBUG) console.log('[DynamicTable]', ...args); };

  const state = {
    hot: null,
    rawRows: [],
    columns: [],
    displayRows: [],
    selection: new Set(),
    selectionOrder: [],
    isSearchOpen: false,
    activeHeaderColumn: null,
    columnMenuOpenedAt: 0,
    headerPressActive: false,  // T2: son HOT hücre mousedown'ı kolon başlığı/köşedeydi (kayıt seçimi değil)
    filterConfigs: {},
    filterDraft: null,
    submenuCloseTimer: null,
    toolbarMoreOpenedAt: 0,
    menuReturnFocus: null,   // menü kapanınca odağın döneceği element
    _scrollRaf: null,        // kaydırmada alt panel yeniden konumlama (frame başına bir)
    _noIdWarned: false,      // "kayıtlarda id alanı yok" uyarısı bir kez yazılır
    dueDateSort: { active: false, fields: [] },
    ddModalDraft: null,
    columnOrder: [],   // kolon ID dizisi; boş = varsayılan sıra
    _colMoveHandlers: { before: null, after: null },  // dahili: hook yönetimi için
    _colResizeHandler: null,      // T1: afterColumnResize → columnWidths
    columnWidths: {},             // T1: kullanıcı genişlikleri, kolon id → px
    _mountedCols: [],             // T1: son mount'un visibleColumns'u (fiziksel index → kolon)
    _viewKey: null,               // T1: {screen:{list,stage}, cols:[id], rows:[kayıt id]}
    _layoutTouched: false,        // T1: kullanıcı bu görünümde düzeni değiştirdi
    _lastAppliedSavedKey: '',     // T1: son uygulanan tableConfig anahtarı
    _carrySelectionIds: null,     // T1: veri değişirken taşınacak seçili id'ler
    _resetHotView: false,         // T1: sonraki mount HOT sıralama/filtre/kaydırma sıfırlasın
    _hotFiltered: false,          // T1: HOT'ta koşul var (bayat filtre temizliği)
    _mounting: false, _syncingSelection: false, _lastPublishedIdsKey: null,
    _keepFocusEl: null,           // T1: programatik HOT seçimi sırasında odağın kalacağı dış element
    _pendingFiltersById: null, _pendingSortById: null, _pendingScroll: null, // T1: yeniden basılan elementten devir
    _createRowRenderHandler: null,  // afterRender hook reference for cleanup
    // mr18 (fields where you look) — memory only, die with the page (never localStorage, never tableConfig)
    fieldOps: { screenId: '', at: 0, meta: null, ready: false, inflight: null },   // mirror_screen_fields per screen (30 s)
    pendingFields: new Map(),     // name → {op_id, ctx, startedAt, col, index, …} while a field write is in flight
    serverPatch: { added: new Map(), removed: new Map(), screen: '' },   // server-confirmed adds / hides (of one screen) until Bubble's config catches up
    fieldPop: null,               // the open New field popover
    _confirmedCols: new Map(),    // name → until (dt-col-confirmed, 600 ms)
    _fieldPrefetchFor: '', _fieldOpening: false, _menuAnchorEl: null, _menuAnchorRect: null, _fieldCfgText: null, _fieldCfgScreen: '',
    // Wake Agent buton durumu — bubble-table-config'ten beslenir
    wake: {
      show: true,        // config.wake_button === false → gizle
      hasAgent: false,   // süreçte tanımlı bir asistan var mı (assistant_id okunabildi mi)
      assistantId: '',   // sürecin asistan id'si — config/DOM/window'dan çözülür (hasAgent kaynağı)
      dfr: null,         // agent'ın data_flow_rules objesi (parse edilmiş) — remember/save için
      manualWake: null,  // dfr.manual_wake: { enabled, mode, search_keys } | null = belirtilmemiş
      agentName: '',     // config.agent_name — kopya metinlerinde kullanılır
      agentConfig: null, // config.agent — manage_trigger köprüsüyle uyandırma için agent config'i
      waking: false,
      resetTimer: null
    }
  };

  // state.columnOrder'a göre state.columns'ı sıralar.
  // config'de bulunmayan (yeni eklenen) kolonlar orijinal sıralarını koruyarak sona eklenir.
  // 20.09 (ortak canli test: "[DT] JSON parse HATASI: Unexpected token" | { "data": , "columns": [] }):
  // Bubble, dinamik veri BOS oldugunda sablonu {"data": ,"columns": []} olarak basiyor; bu gecerli JSON degil.
  // Onarim YALNIZ "anahtardan sonra deger yok" kalibini duzeltir (deger yerine [] koyar). Gercek bozuk / yarim JSON
  // oldugu gibi kalir ve asagidaki catch'e duser: erisim hatasi ya da eksik yanit bos basariya CEVRILMEZ.
  function parseBubbleConfig(text) {
    const fixed = String(text).replace(/("(?:data|columns)"\s*:\s*)(?=[,}])/g, '$1[]');
    return JSON.parse(fixed);
  }
  function getOrderedColumns() {
    if (state.columnOrder.length === 0) return state.columns;
    const orderMap = new Map(state.columnOrder.map((id, i) => [id, i]));
    const maxOrder = state.columnOrder.length;
    return state.columns
      .map((col, origIdx) => ({
        col,
        sortKey: orderMap.has(col.id) ? orderMap.get(col.id) : maxOrder + origIdx
      }))
      .sort((a, b) => a.sortKey - b.sortKey)
      .map(({ col }) => col);
  }
  // Görsel/menü index'i (getOrderedColumns sırası) → kolon tanımı
  function getColumnAt(i) {
    return getOrderedColumns()[i];
  }

  // ── T1: "aynı görünüm mü, yeni görünüm mü" kuralı (Bubble config yenilemesinde görünüm durumu) ──
  function rowIdOf(raw) { // getSelectedUniqueIds ile aynı kural
    if (!raw || typeof raw !== 'object') return '';
    for (const key of UNIQUE_KEYS) { const v = raw[key]; if (v !== undefined && v !== null && v !== '') return String(v); }
    return '';
  }
  function idJaccard(a, b) {
    const A = new Set(a), B = new Set(b);
    if (!A.size && !B.size) return 1;
    let inter = 0; B.forEach(x => { if (A.has(x)) inter += 1; });
    return inter / (A.size + B.size - inter);
  }
  function viewKeyOf(config, data) {
    let ag = config && config.agent;
    if (typeof ag === 'string') { try { ag = JSON.parse(ag); } catch (e) { ag = null; } }
    if (!ag || typeof ag !== 'object') ag = {};
    const pick = (a, b) => String((a !== undefined && a !== null && String(a).trim() !== '') ? a : (b || '')).trim();
    return {
      screen: { list: pick(config.list_id, ag.list_id), stage: pick(config.stage_id, ag.stage_id) },
      cols: sanitizeColumns(config.columns).map(c => c.id),
      rows: (Array.isArray(data) ? data : []).map(rowIdOf).filter(Boolean)
    };
  }
  // layoutNew: sıra/genişlik/son-tarih; dataNew: filtre/HOT sıralama/arama/seçim/kaydırma
  function classifyView(prev, next) {
    if (!prev) return { layoutNew: true, dataNew: true };
    const ps = prev.screen || {}, ns = next.screen || {};
    const listKnown = !!(ps.list && ns.list);
    const layoutNew = (listKnown && ps.list !== ns.list) ||
      (!(listKnown && ps.list === ns.list) && idJaccard(prev.cols, next.cols) < 0.5);
    const stageChanged = !!(ps.stage && ns.stage && ps.stage !== ns.stage);
    let disjoint = false;
    if (prev.rows.length && next.rows.length) { const P = new Set(prev.rows); disjoint = !next.rows.some(id => P.has(id)); }
    return { layoutNew, dataNew: layoutNew || stageChanged || disjoint };
  }
  // Boş veri kimlik taşımaz → önceki kayıt id kümesi korunur (iki adımlı render'da sahne değişimi kaçmasın)
  function carryRowIds(prev, next) { return (prev && !next.rows.length) ? Object.assign({}, next, { rows: prev.rows }) : next; }
  // tableConfig (string/obje) ya da eski ayrı anahtarlar → {columnOrder, dueDateSort, key}
  function savedViewOf(config) {
    if (!config) return null;
    const parse = v => { if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { console.warn('tableConfig parse error', e); return null; } };
    let order = null, dd = null;
    if (config.tableConfig) {
      const saved = parse(config.tableConfig);
      if (!saved || typeof saved !== 'object') return null;
      order = saved.columnOrder; dd = parse(saved.dueDateSort);
    } else if (config.columnOrder || config.dueDateSort) {
      const co = parse(config.columnOrder);
      order = co && Array.isArray(co.order) ? co.order : null;
      dd = parse(config.dueDateSort);
    } else return null;
