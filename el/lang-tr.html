<!-- GAIA - LANG-TR (17.11.2026): /app arayuzu Turkiye'den girilince Turkce.
     Karar: ?lang=tr|en (tarayicida hatirlanir) > TR / EN dugmesi secimi > saat dilimi Europe/Istanbul (Turkiye) > Ingilizce.
     (24.11'den beri tarayici dili karar vermez: dil ziyaretcinin bulundugu ulkeye gore.)
     Yalniz arayuz yazilari cevrilir (tam eslesen metin + placeholder / title / aria-label). Musteri verisi CEVRILMEZ:
     tablo (baslik + satirlar), Board kartlari, alan cipleri, form alanlari (#dynamicForm), yazilabilir alanlar, translate="no" / .notranslate / [data-gx-notr].
     Elementlerin kodu degismez; metni ceviri katmani DOM'da degistirir, yeniden cizilen metni MutationObserver yakalar.
     Kullanici dili sol menunun ust sag kosesindeki TR / EN dugmesiyle degistirir (tarayicida kalir).
     Kapatma: ?lang=en (o tarayicida kalici), ya da manifestten lang-tr'yi kaldir. Hata ayiklama: window.__gxTr -->
<script>
(function (W, D) {
  'use strict';
  if (W.__gxTr) return;

  function pick() {
    var q = null;
    try { q = /[?&]lang=(tr|en)(?:&|#|$)/i.exec(location.search || ''); } catch (e) { q = null; }
    if (q) {
      var v = q[1].toLowerCase();
      var kept = false;
      try { localStorage.setItem('gx_lang', v); kept = localStorage.getItem('gx_lang') === v; } catch (e) { /* storage blocked */ }
      // 20.11: secim kaydedildiyse ?lang= adresten silinir; kopyalanip paylasilan baglanti (ABD'deki biri) dili tasimasin
      if (kept) {
        try {
          var clean = location.href.replace(/([?&])lang=(?:tr|en)(&|(?=#|$))/i, function (m, a, c) { return c ? a : ''; }).replace(/\?(?=#|$)/, '');
          if (clean !== location.href && W.history && history.replaceState) history.replaceState(history.state, '', clean);
        } catch (e) { /* ignore */ }
      }
      return { lang: v, why: 'url' };
    }
    try { var s = localStorage.getItem('gx_lang'); if (s === 'tr' || s === 'en') return { lang: s, why: 'saved' }; } catch (e) { /* blocked */ }
    // 24.11 Saltuk: "herkes girdigi ulkenin dilini gormeli" -> karar YALNIZ konumla (saat dilimi). Tarayici dili artik
    // karar vermez: Turkce tarayicili biri ABD'den girerse Ingilizce gorur; Turkiye'den Ingilizce tarayiciyla giren Turkce.
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { tz = ''; }
    if (tz === 'Europe/Istanbul' || tz === 'Asia/Istanbul') return { lang: 'tr', why: 'timezone' };
    return { lang: 'en', why: 'default' };
  }

  var choice = pick();
  var api = W.__gxTr = { v: 2, lang: choice.lang, why: choice.why, done: 0, misses: null };

  // ---- TR / EN dugmesi (17.11): kullanici adres yazmadan dil secer. Sol menunun ust sag kosesi;
  // menu yoksa (telefon, kapali menu) sol alt kosede sabit. Secim tarayicida kalir, sayfa yenilenir.
  function setLang(v) {
    if (v === api.lang) return;
    var saved = false;
    try { localStorage.setItem('gx_lang', v); saved = localStorage.getItem('gx_lang') === v; } catch (e) { saved = false; }
    var href = location.href;
    if (saved) {
      var u = href.replace(/([?&])lang=(?:tr|en)(&|(?=#|$))/i, function (m, a, c) { return c ? a : ''; });
      if (u !== href) { location.replace(u); return; }
      location.reload();
    } else {
      var h = href.split('#'), base = h[0].replace(/([?&])lang=(?:tr|en)(&|$)/i, function (m, a, c) { return c ? a : ''; });
      location.replace(base + (base.indexOf('?') >= 0 ? '&' : '?') + 'lang=' + v + (h[1] ? '#' + h[1] : ''));
    }
  }
  function barOk(g) {
    var r = g.getBoundingClientRect(), vh = W.innerHeight || 0, vw = W.innerWidth || 0;
    return r.left <= 1 && r.top <= 1 && r.width >= 200 && r.width <= Math.max(360, vw) && r.height >= vh * 0.8;
  }
  function findBar() {
    // once akis kredisi kartinin menusu (telefonda menu tam ekran, kart ustte)
    var c = D.querySelector('.fcw-unit');
    for (var p = c; p && p !== D.body; p = p.parentElement) {
      if (p.classList && p.classList.contains('FloatingGroup')) return p;   // menu kapaliysa dugme onunla gizlenir
    }
    var gs = D.querySelectorAll('.FloatingGroup');
    for (var i = 0; i < gs.length; i++) {
      if (gs[i].getBoundingClientRect().width <= 360 && barOk(gs[i])) return gs[i];
    }
    return null;
  }
  function buildSwitch() {
    if (!D.getElementById('gx-lang-sw-css')) {
      var st = D.createElement('style');
      st.id = 'gx-lang-sw-css';
      st.textContent =
        '#gx-lang-sw{position:absolute;top:20px;right:14px;z-index:60;display:inline-flex;gap:2px;padding:2px;margin:0;' +
        'border:1px solid #e2e8f0;border-radius:999px;background:#fff;font:600 11px/1 Inter,"Segoe UI",sans-serif;letter-spacing:.02em}' +
        '#gx-lang-sw.gx-narrow{flex-direction:column;top:18px;right:8px}' +
        '#gx-lang-sw.gx-fixed{position:fixed;top:auto;right:auto;left:12px;bottom:12px;z-index:2147483000;box-shadow:0 1px 3px rgba(15,23,42,.14)}' +
        '#gx-lang-sw button{all:unset;box-sizing:border-box;cursor:pointer;min-width:30px;height:24px;padding:0 8px;border-radius:999px;' +
        'text-align:center;line-height:24px;color:#475569;font:inherit}' +
        '#gx-lang-sw button[aria-pressed="true"]{background:#6366f1;color:#fff;cursor:default}' +
        '#gx-lang-sw button:not([aria-pressed="true"]):hover{background:#eef2ff;color:#0f172a}' +
        '#gx-lang-sw button:focus-visible{outline:2px solid #6366f1;outline-offset:1px}';
      (D.head || D.documentElement).appendChild(st);
    }
    var sw = D.createElement('div');
    sw.id = 'gx-lang-sw';
    sw.setAttribute('role', 'group');
    sw.setAttribute('aria-label', 'Dil / Language');
    sw.setAttribute('translate', 'no');
    sw.setAttribute('data-gx-notr', '1');
    [['tr', 'TR', 'Türkçe'], ['en', 'EN', 'English']].forEach(function (o) {
      var b = D.createElement('button');
      b.type = 'button';
      b.textContent = o[1];
      b.title = o[2];
      b.setAttribute('aria-label', o[2]);
      b.setAttribute('aria-pressed', api.lang === o[0] ? 'true' : 'false');
      b.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); setLang(o[0]); });
      sw.appendChild(b);
    });
    return sw;
  }
  var sw = null;
  function placeSwitch() {
    if (!D.body) return;
    if (!sw) sw = buildSwitch();
    var bar = findBar();
    var host = bar || D.body;
    if (sw.parentNode !== host) host.appendChild(sw);
    if (bar) sw.classList.remove('gx-fixed'); else sw.classList.add('gx-fixed');
    var bw = bar ? bar.getBoundingClientRect().width : 0;
    if (bw === 0) return;   // menu gizli: sinifi degistirme
    var narrow = bw > 360;   // telefon: menu tam ekran, kartin sagi dar
    if (narrow) sw.classList.add('gx-narrow'); else sw.classList.remove('gx-narrow');
  }
  api.placeSwitch = placeSwitch;
  try { placeSwitch(); } catch (e) { /* ignore */ }
  setInterval(function () { try { placeSwitch(); } catch (e) { /* ignore */ } }, 1500);   // Bubble menuyu yeniden cizebilir

  // ---- MOBIL-MENU (19.11, Saltuk: "mobilde girdigimde workspace secemiyorum degistiremiyorum"): Bubble'in acilir
  // menuleri (GroupFocus: calisma alani disli menusu vb.) dugmeye gore konumlanir: left = dugmenin x'i, right = 20px.
  // Telefonda dugme sagdaysa menu ~80px'e sikisiyordu (yazilar dikey, dugmelere basilamiyor). Bubble menunun style'ini
  // acikken de defalarca bastan yazar, o yuzden duzeltme bir stil kuraliyla: sikisan ya da ekrandan tasan menu
  // isaretlenir (data-gx-mobil-menu), dar ekranda (<= 767px) sagdan 12px, ekran - 24px genislikte (menunun kendi
  // max-width'i ustte kalir) acilir. Masaustune dokunmaz. Kapatma: window.__gxNoMobilMenu = true.
  (function mobilMenu() {
    if (W.__gxMobilMenu) return;
    W.__gxMobilMenu = 1;
    function css() {
      if (D.getElementById('gx-mobil-menu-css')) return;
      var st = D.createElement('style');
      st.id = 'gx-mobil-menu-css';
      st.textContent = '@media (max-width: 767px){html:not(.gx-no-mobil-menu) .bubble-element.GroupFocus[data-gx-mobil-menu]' +
        '{left:auto!important;right:12px!important;width:calc(100vw - 24px)!important;box-sizing:border-box!important}}';
      (D.head || D.documentElement).appendChild(st);
    }
    function fit() {
      if (W.__gxNoMobilMenu) { D.documentElement.classList.add('gx-no-mobil-menu'); return; }
      var vw = W.innerWidth || 0;
      if (!vw || vw > 767) return;
      var gs = D.querySelectorAll('.bubble-element.GroupFocus:not([data-gx-mobil-menu])');
      for (var i = 0; i < gs.length; i++) {
        var g = gs[i], cs = W.getComputedStyle(g);
        if (cs.display === 'none' || cs.visibility === 'hidden' || cs.position !== 'fixed') continue;
        var r = g.getBoundingClientRect();
        if (!r.width || !r.height) continue;
        var maxW = parseFloat(g.style.maxWidth || cs.maxWidth) || 280;
        var want = Math.min(maxW, vw - 24);
        // yalniz sikisan (sag kenara dayali ve kendi genisliginden dar) ya da ekrandan tasan menu;
        // kendiliginden dar tasarlanmis ve sigan bir menu oldugu gibi kalir
        var squeezed = r.width < want - 2 && r.right >= vw - 40;
        if (!squeezed && r.right <= vw + 1 && r.left >= -1) continue;
        css();
        g.setAttribute('data-gx-mobil-menu', '1');
      }
    }
    function soon() { [0, 60, 200, 500, 1000].forEach(function (ms) { setTimeout(function () { try { fit(); } catch (e) { /* ignore */ } }, ms); }); }
    // Bubble menuyu bir dokunusla acar; dokunus / tik / yon degisimi sonrasi bakilir
    D.addEventListener('click', soon, true);
    D.addEventListener('touchend', soon, { capture: true, passive: true });
    W.addEventListener('resize', soon);
    W.addEventListener('orientationchange', soon);
    api.fitMenus = fit;
  })();

  // ---- MOBIL-SHEETS (19.11, Saltuk: "telefondan sheet degistiremiyorum, farkli workspace gectigimde acilmiyor"):
  // (1) Bubble telefonda sol menunun (#sideMenu, FloatingGroup C) kendi olcusu current_width'i 0 tutuyor (ekranda 364 px).
  //     Tablo listesi grubunun (Group XZZZZZ) Bubble kosulu "menu genisligi < 50 ise gizle": liste hic olusmuyor, telefon
  //     cubugu (octo os9m) yalniz ilk tabloyu goruyor, baska tabloya gecilemiyor, sablon paneli acilip tabloyu ortuyordu.
  //     Dar ekranda Bubble'in olcusu 50'den kucuk, DOM genisligi 50 ve uzeriyse olcu DOM genisligine esitlenir.
  // (2) Bubble yeni olusturdugu satirlarda gizli "secili" isaretini (Shape A) olusturmuyor; kabuk isareti bulamayinca
  //     yazinin kalinligina bakiyor (telefonda hepsi kalin) ve her tabloyu "zaten secili" sanip tiklamayi yok sayiyordu.
  //     Isareti olmayan satirin sonuna gizli bir yer tutucu konur (secili degil demek); Bubble gercek isareti
  //     olusturunca yer tutucu kaldirilir. Yalniz bu sekmenin ekran durumu, kayit yazilmaz. Kapatma: window.__gxNoMobilSheets = true.
  (function mobilSheets() {
    if (W.__gxMobilSheets) return;
    W.__gxMobilSheets = 1;
    var MARK = 'baUwsl', ROW = '#sideMenu .baUfaIf';
    function width() {
      var sm = D.getElementById('sideMenu');
      var bd = sm && sm.bubble_data, inst = bd && bd.bubble_instance, st = inst && inst._states;
      var cw = st && st.current_width;
      if (!cw || typeof cw.set !== 'function' || typeof cw.dangerously_peek !== 'function') return;
      var dom = Math.round(sm.getBoundingClientRect().width);
      var cur = Number(cw.dangerously_peek()) || 0;
      if (cur < 50 && dom >= 50) cw.set(dom);
    }
    function marks() {
      var rows = D.querySelectorAll(ROW);
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i], all = r.querySelectorAll('.' + MARK), real = 0, ph = [];
        for (var j = 0; j < all.length; j++) { if (all[j].getAttribute('data-gx-mark')) ph.push(all[j]); else real++; }
        if (real) { for (var k = 0; k < ph.length; k++) ph[k].remove(); continue; }
        if (ph.length) continue;
        var m = D.createElement('div');
        m.className = MARK;
        m.setAttribute('data-gx-mark', '1');
        m.setAttribute('aria-hidden', 'true');
        m.style.display = 'none';
        r.appendChild(m);
      }
    }
    // (3) Seçili tablo yokken sayfa açılınca Bubble'in PageLoaded akisi Architect sablon panelini acar (gaiaTriggerOnboarding);
    //     telefonda tablo secilince panel kapanmiyor, tablonun ustunde kaliyordu. Tablonun ekrani bos olmayan yeni bir
    //     ekrana gecince panel acik ise kendi kapatma dugmesiyle kapatilir (kullanicinin sonradan actigi panele dokunulmaz).
    var lastScr = null;
    function screenId() {
      var s = D.getElementById('bubble-table-config');
      var m = s && /"screen_id"\s*:\s*"([^"]*)"/.exec(s.textContent || '');
      return m ? m[1] : '';
    }
    function closeTemplates() {
      var k = screenId();
      if (lastScr === null) { lastScr = k; return; }
      if (k === lastScr) return;
      lastScr = k;
      if (!k) return;
      var mod = D.getElementById('gaia-automation-module');
      if (!mod || mod.classList.contains('is-hidden')) return;
      var b = mod.querySelector('.module-close-mobile');
      if (b) b.click();
    }
    // (4) MOBIL-SHEETS 2 (19.11 aksam, Saltuk: "eski menuden calisti, normal hali calismadi"): octo cubugu tablo secince
    //     Bubble'in secili isaretinin (Shape A) yeni satira gecmesini T.zoomWait (4 sn) bekler, gelmezse 'Could not open'
    //     + Classic menu der. Olcum (390 px, kisinin hesabi, onde): isaret 4,9 sn'de geciyor, tablo 6,7 sn'de; telefonda
    //     daha uzun. Gecis arkadan tamamlansa da cubuk vazgecmis oluyordu. Telefonda bekleme 12 sn.
    function octoWait() {
      var wb = W.octo && W.octo._wsbar, T = wb && wb.T;
      if (T && typeof T.zoomWait === 'number' && T.zoomWait < 12000) T.zoomWait = 12000;
    }
    function tick() {
      if (W.__gxNoMobilSheets) return;
      if ((W.innerWidth || 0) > 899) return;
      try { width(); } catch (e) { /* ignore */ }
      try { marks(); } catch (e) { /* ignore */ }
      try { closeTemplates(); } catch (e) { /* ignore */ }
      try { octoWait(); } catch (e) { /* ignore */ }
    }
    tick();
    setInterval(tick, 400);
    api.fitSheets = tick;
  })();

  if (choice.lang !== 'tr') return;

  // ---- sozluk: tam eslesen (bosluklari sadelestirilmis) metin -> Turkce
  var T = {
    // Bubble kabuk / yan menu / akis kredisi

      var tag = '';
      try { tag = el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).slice(0, 3).join('.') : '') + ' "' + String(el.textContent || '').trim().slice(0, 40) + '"'; } catch (e) { tag = '?'; }
      if (api.loopList.length < 50) api.loopList.push(tag);
      try { console.warn('[LANG-TR] text keeps being reset, left in English: ' + tag); } catch (e) { /* ignore */ }
      return true;
    }
    return false;
  }

  function doText(n) {
    var v = n.nodeValue;
    if (!v || v.length > 200 || !/[A-Za-z]/.test(v)) return;
    var p = n.parentNode;
    if (!p) return;
    var out = tr(v, p, p);
    if (out === null) return;
    if (skipped(p)) return;
    var lead = /^\s*/.exec(v)[0], tail = /\s*$/.exec(v)[0];
    var nv = lead + out + tail;
    if (nv !== v) {
      if (looping(p)) return;
      n.nodeValue = nv; api.done++;
    }
  }

  var ATTRS = ['placeholder', 'title', 'aria-label'];
  function doAttrs(el) {
    for (var i = 0; i < ATTRS.length; i++) {
      var a = el.getAttribute(ATTRS[i]);
      if (!a || !/[A-Za-z]/.test(a)) continue;
      var out = tr(a, null, el);
      // yer tutucu (placeholder) hic musteri verisi degildir: kapsamli sozluk her yerde gecerli (ornek: sol menude "Name")
      if (out === null && ATTRS[i] === 'placeholder') { var k0 = a.replace(/\s+/g, ' ').trim(); if (Object.prototype.hasOwnProperty.call(SCOPED, k0)) out = SCOPED[k0]; }
      if (out !== null && out !== a) {
        if (skipped(el) && !(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) continue;
        if (el.closest && el.closest(SKIP_SEL + ', table')) continue;
        if (looping(el)) continue;
        el.setAttribute(ATTRS[i], out);
        api.done++;
      }
    }
  }

  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) { doText(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 11) return;
    if (root.nodeType === 1) {
      if (SKIP_TAG[root.tagName] && root.tagName !== 'INPUT' && root.tagName !== 'TEXTAREA' && !((root.tagName === 'SELECT' || root.tagName === 'OPTION') && selOk(root))) return;
      doAttrs(root);
    }
    var w = D.createTreeWalker(root, 1 | 4, {
      acceptNode: function (n) {
        if (n.nodeType === 1 && SKIP_TAG[n.tagName] && n.tagName !== 'INPUT' && n.tagName !== 'TEXTAREA' &&
            !((n.tagName === 'SELECT' || n.tagName === 'OPTION') && selOk(n))) return 2; // REJECT alt agac
        return 1;
      }
    });
    var n;
    while ((n = w.nextNode())) {
      if (n.nodeType === 3) doText(n); else doAttrs(n);
    }
  }

  var pend = [], sched = false;
  function flush() {
    sched = false;
    gen++;
    var list = pend; pend = [];
    if (skipCache) skipCache = new WeakMap();   // DOM tasindi: atlama kararlarini tazele
    if (scopeCache) scopeCache = new WeakMap();
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      if (n.isConnected === false) continue;
      try { walk(n); } catch (e) { /* tek dugum hatasi digerlerini durdurmasin */ }
    }
  }
  function queue(n) {
    pend.push(n);
    if (!sched) { sched = true; setTimeout(flush, 30); }   // rAF arka plan sekmesinde hic calismaz
  }

  function start() {
    try { D.documentElement.setAttribute('lang', 'tr'); } catch (e) { /* ignore */ }
    queue(D.body);
    var mo = new MutationObserver(function (recs) {
      gen++;   // ozellik yolu (doAttrs) flush beklemez: her gozlemci turu ayri gecis
      for (var i = 0; i < recs.length; i++) {
        var r = recs[i];
        if (r.type === 'childList') {
          for (var j = 0; j < r.addedNodes.length; j++) queue(r.addedNodes[j]);
        } else if (r.type === 'characterData') {
          queue(r.target);
        } else if (r.type === 'attributes') {
          if (r.target.nodeType === 1) { try { doAttrs(r.target); } catch (e) { /* ignore */ } }
        }
      }
    });
    mo.observe(D.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
    api.observer = mo;
    // Sozlukte olmayan Ingilizce metinleri gormek icin: __gxTr.misses()
    api.misses = function () {
      var out = {}, w = D.createTreeWalker(D.body, 4), n;
      while ((n = w.nextNode())) {
        var t = n.nodeValue.replace(/\s+/g, ' ').trim();
        if (!t || t.length > 120 || !/[A-Za-z]{3}/.test(t) || /[çğıöşüÇĞİÖŞÜ]/.test(t)) continue;
        var p = n.parentNode;
        if (!p || skipped(p) || !p.getClientRects().length) continue;
        out[t] = 1;
      }
      return Object.keys(out);
    };
  }

  if (D.body) start(); else D.addEventListener('DOMContentLoaded', start);
})(window, document);
</script>
