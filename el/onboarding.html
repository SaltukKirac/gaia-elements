    @keyframes ow-pulse {
        0% {

            opacity: 1;
        }

            transform: scale(1.2);

        }

    .ow-switch {

<script>
    (function () {
        // ============================================================
        // BUBBLE BRIDGE FUNCTIONS
        // ============================================================
        function triggerOnboardingDone(screenId) {
            if (typeof bubble_fn_onboarding_done === 'function') {
                const sId = screenId ? String(screenId) : "";
                console.log("[Onboarding] Tour Dismissed/Finished. Firing event with Screen ID:", sId);
                window.bubble_fn_onboarding_done(sId);
            }
        }

        function triggerKonfigKaydet(screenId, configData) {
            if (typeof bubble_fn_save_config === 'function') {
                const sId = screenId ? String(screenId) : "";
                const jData = JSON.stringify(configData) || "[]";

                // Single Raw String (Bypasses all Multiple Output Object Parsing bugs natively)
                const composite = sId + "_|||_" + jData;

                console.log("[Onboarding] Executing Single Failsafe String:", composite);
                window.bubble_fn_save_config(composite);
            }
        }

        // ============================================================
        // GLOBAL STATE & CONSTANTS
        // ============================================================

        function getAppConfig() {
            let c_conf = true;
            let c_saved = null;
            let c_dism = false;
            let c_screen = null;

            try {
                if (typeof ONBOARD_CONFIGURABLE !== 'undefined') c_conf = ONBOARD_CONFIGURABLE;
            } catch (e) { }
            try {
                if (typeof SAVED_CONFIG !== 'undefined') c_saved = SAVED_CONFIG;
            } catch (e) { }
            try {
                if (typeof USER_DISMISSED !== 'undefined') c_dism = USER_DISMISSED;
            } catch (e) { }
            try {
                if (typeof CURRENT_SCREEN !== 'undefined') c_screen = CURRENT_SCREEN;
            } catch (e) { }

            if (c_saved && c_screen) {
                return { isConf: c_conf, saved: c_saved, dismissed: c_dism, screen: c_screen };
            }

            try {
                const scripts = document.querySelectorAll('script');
                for (let i = scripts.length - 1; i >= 0; i--) {
                    const text = scripts[i].textContent;
                    if (!text) continue;

                    // Regex to robustly find variable assignment avoiding self-references like 'typeof CURRENT_SCREEN'
                    const screenMatch = text.match(/CURRENT_SCREEN\s*=\s*(.*?)(?:;|\n|<[!]-{2}|\/\/)/);
                    if (screenMatch && screenMatch[1]) {
                        let val = screenMatch[1].trim();
                        if (val.startsWith('"') || val.startsWith("'") || val.startsWith("`")) {
                            val = val.substring(1, val.length - 1);
                        } else if (val === 'null' || val === '') {
                            val = null;
                        } else if (val === 'undefined') {
                            val = undefined;
                        }
                        // Only set if we actually found something meaningful (prevents overwriting with garbage from own source)
                        if (val !== '= CURRENT_SCREEN') {
                             c_screen = val;
                        }
                    }

                    // Avoid matching our own internal code string checks
                    const confMatch = text.match(/ONBOARD_CONFIGURABLE\s*=\s*(true|false)/);
                    if (confMatch && text.indexOf('if (text.includes') === -1) {
                         c_conf = confMatch[1] === 'true';
                    }

                    const dismMatch = text.match(/USER_DISMISSED\s*=\s*(true|false)/);
                    if (dismMatch && text.indexOf('if (text.includes') === -1) {
                         c_dism = dismMatch[1] === 'true';
                    }

                    const savedMatch = text.match(/SAVED_CONFIG\s*=\s*(\[.*?\])/s);
                    if (savedMatch && text.indexOf('if (text.includes') === -1) {
                        try {
                            c_saved = JSON.parse(savedMatch[1]);
                        } catch (e) {
                            try { c_saved = new Function("return " + savedMatch[1])(); } catch (err) {}
                        }
                    }
                }
            } catch (err) { }

            // Güvenlik kontorlü: Eğer halen kendi iç kod parçamızı almışsa iptal et
            if (typeof c_screen === 'string' && (c_screen.includes('undefined)') || c_screen.includes('CURRENT_SCREEN'))) {
                c_screen = null;
            }

            return { isConf: c_conf, saved: c_saved, dismissed: c_dism, screen: c_screen };
        }

        let syncTimer = null;

        function syncWidgetVisibility() {
            const btnStarts = document.querySelectorAll('#ow-btn-start');
            const btnConfigs = document.querySelectorAll('#ow-btn-config');
            const widgetRoots = document.querySelectorAll('#ow-widget-root');
            if (btnStarts.length === 0 || btnConfigs.length === 0 || widgetRoots.length === 0) return;

            const conf = getAppConfig();

            const rawScreen = String(conf.screen).trim();
            const hasScreen = conf.screen && rawScreen !== '' && rawScreen !== 'null' && rawScreen !== 'undefined';
            const showStart = conf.saved && Array.isArray(conf.saved) && conf.saved.length > 0;
            const showConfig = conf.isConf;

            widgetRoots.forEach(root => {
                if (!hasScreen || (!showStart && !showConfig)) {
                    root.style.setProperty('display', 'none', 'important');
                } else {
                    root.style.setProperty('display', 'flex', 'important');
                }
            });

            btnStarts.forEach(btn => {
                if (!hasScreen || (!showStart && !showConfig)) {
                    btn.style.setProperty('display', 'none', 'important');
                } else {
                    btn.style.setProperty('display', showStart ? 'flex' : 'none', 'important');
                }
            });

            btnConfigs.forEach(btn => {
                if (!hasScreen || (!showStart && !showConfig)) {
                    btn.style.setProperty('display', 'none', 'important');
                } else {
                    btn.style.setProperty('display', showConfig ? 'flex' : 'none', 'important');
                }
            });
        }

        function initWidget() {
            const btnStarts = document.querySelectorAll('#ow-btn-start');

            btnStarts.forEach(btn => btn.onclick = handleStartClick);
            btnConfigs.forEach(btn => btn.onclick = handleConfigClick);

            syncWidgetVisibility();
            if (syncTimer) clearInterval(syncTimer);

            const conf = getAppConfig();
            if (conf.saved && Array.isArray(conf.saved) && conf.saved.length > 0 && !conf.dismissed && !STATE.isTourActive && !STATE.isConfigMode) {

        function loadDriver() {
            return new Promise((resolve) => {
                if (window.driver) return resolve();

                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css';
                document.head.appendChild(link);

                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js';
                script.onload = () => resolve();
                document.body.appendChild(script);
            });
        }

        function waitForElement(selector, maxWaitMs = 10000) {
            return new Promise((resolve) => {
                if (document.querySelector(selector)) return resolve(true);

                let elapsed = 0;
                const intervalMs = 250; // Check 4 times a second (0 lag)

                const timer = setInterval(() => {
                    elapsed += intervalMs;
                    if (document.querySelector(selector)) {
                        clearInterval(timer);
                        resolve(true);
                    } else if (elapsed >= maxWaitMs) {
                        clearInterval(timer);
                        resolve(false); // timeout
                    }
                }, intervalMs);
            });
        }

        async function startTour(steps, screenId) {
            if (STATE.isConfigMode) return;
            if (!steps || steps.length === 0) return;
            // Freeze the configuration data locally so changes during the run are ignored
            STATE.tourSteps = JSON.parse(JSON.stringify(steps));
            STATE.activeRunScreenId = screenId || "";

            STATE.currentTourIndex = 0;
            STATE.isTourActive = true;
            STATE.isAdvancing = false;

            await loadDriver();

            const builtSteps = steps.map((s, idx) => ({
                element: s.targetSelector,
                popover: {
                    title: `Step ${idx + 1} / ${steps.length}: ${s.title}`,
                    description: s.description,
                    side: s.placement === 'auto' ? 'bottom' : s.placement,
                    align: 'start',
                    onNextClick: async () => {
                        if (STATE.isAdvancing) return;
                        STATE.isAdvancing = true;

                        const el = document.querySelector(s.targetSelector);
                        if (el) {
                            const tName = el.tagName.toLowerCase();
                            // Only force a native click for buttons/links when advancing, avoid clicking inputs unnecessarily
                            if (tName !== 'input' && tName !== 'textarea' && tName !== 'select') {
                                try { el.click(); } catch (e) { }
                            }
                        }
                        const nextStep = steps[idx + 1];
                        if (nextStep) {
                            // Smart Wait: Pause tour until Bubble's next popup/form renders
                            await waitForElement(nextStep.targetSelector, 8000);
                        }
                        // Add a tiny buffer for Bubble SPA to finish micro-animations
                        setTimeout(() => {
                            window.owDriver.moveNext();
                            STATE.isAdvancing = false;
                        }, 300);
                    }
                },
                // If they manually interact with the highlighted element, advance automatically
                onHighlightStarted: (el) => {
                    if (!el) return;

                    let triggered = false;
                    const advanceContent = async (e) => {
                        // If it's a keyup event, only advance if Enter was pressed
                        if (e && e.type === 'keyup' && e.key !== 'Enter') return;

                        if (STATE.isAdvancing) return;
                        if (triggered) return;
                        triggered = true;
                        STATE.isAdvancing = true;

                        el.removeEventListener('click', advanceContent);
                        el.removeEventListener('pointerdown', advanceContent);
                        el.removeEventListener('change', advanceContent);
                        el.removeEventListener('keyup', advanceContent);

                        const nextStep = steps[idx + 1];
                        if (nextStep) {
                            await waitForElement(nextStep.targetSelector, 8000);
                        }
                        // Delay gives SPA time to render the next container natively
                        setTimeout(() => {
                            window.owDriver.moveNext();
                            STATE.isAdvancing = false;
                        }, 300);
                    };

                    const tag = (el.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable) {
                        // For inputs, don't advance on 'click' so they can type! 
                        // Instead, automatically advance when value changes or 'Enter' is pressed.
                        el.addEventListener('change', advanceContent);
                        el.addEventListener('keyup', advanceContent);
                    } else {
                        // For buttons/divs, pointerdown is required because many SPA elements self-destruct before 'click' completes.
                        el.addEventListener('click', advanceContent);
                        el.addEventListener('pointerdown', advanceContent);
                    }
                }
            }));

            window.owDriver = window.driver.js.driver({
                showProgress: true,
                animate: true,
                steps: builtSteps,
                onDestroyStarted: () => {
                    if (window.owDriver.hasNextStep() || window.owDriver.isFirstStep()) {
                        window.owDriver.destroy();
                        triggerOnboardingDone(STATE.activeRunScreenId);
                    } else {
                        window.owDriver.destroy();
                        triggerOnboardingDone(STATE.activeRunScreenId);
                    }
                    STATE.isTourActive = false;
                }
            });

            // PRE-FLIGHT WAIT: Wait for the very first highlighted element to load in DOM
            await waitForElement(steps[0].targetSelector, 10000);
            window.owDriver.drive();
        }

        function endTour() {
            if (window.owDriver) {
                window.owDriver.destroy();
            }
            STATE.isTourActive = false;
        }

        function ensureConfigDOM() {
            if (!document.getElementById('ow-sidebar')) {

                document.body.appendChild(clone);

                document.getElementById('ow-opt-edit').addEventListener('click', () => initConfigSession('edit'));

                });

                document.getElementById('ow-sidebar-close').addEventListener('click', requestPanelClose);
                document.getElementById('ow-btn-dock').addEventListener('click', () => {
                    const sb = document.getElementById('ow-sidebar');
                    sb.classList.toggle('ow-dock-left');
                });
                document.getElementById('ow-btn-min').addEventListener('click', () => {
                    const sb = document.getElementById('ow-sidebar');
                    sb.classList.toggle('ow-minimized');
                });

                // Confirm Modal actions
                document.getElementById('ow-confirm-save').addEventListener('click', () => {
                    saveFinalConfig();
                    document.getElementById('ow-config-overlay').style.display = 'none';
                });
                document.getElementById('ow-confirm-discard').addEventListener('click', () => {
                    document.getElementById('ow-config-overlay').style.display = 'none';
                    forceCloseConfigPanel();
                });
                document.getElementById('ow-confirm-cancel').addEventListener('click', () => {
                    document.getElementById('ow-config-overlay').style.display = 'none';
                });

                // Sidebar toggle record 
                document.getElementById('ow-record-toggle').addEventListener('change', (e) => {
                    STATE.isRecordingActive = e.target.checked;
                    const dot = document.getElementById('ow-record-dot');
                    const text = document.getElementById('ow-record-text');
                    if (STATE.isRecordingActive) {
                        dot.classList.add('active');
                        text.textContent = 'Recording Active';
                    } else {
                        dot.classList.remove('active');
                        text.textContent = 'Recording Paused';
                    }
                });

                document.getElementById('ow-btn-save-config').addEventListener('click', saveFinalConfig);

                // List Delegated Events (Inline fields edit / Delete)
                const listEl = document.getElementById('ow-step-list');
                listEl.addEventListener('click', (e) => {
                    const btnDel = e.target.closest('.ow-del-btn');
                    const item = e.target.closest('.ow-step-item');
                    if (btnDel && item) {
                        const idx = parseInt(item.dataset.index);
                        STATE.steps.splice(idx, 1);
                        markChanged();
                        renderStepList();
                    }
                });

                // Inline Input handling
                listEl.addEventListener('input', (e) => {
                    const input = e.target;
                    const item = input.closest('.ow-step-item');
                    if (!item) return;

                    const idx = parseInt(item.dataset.index);
                    if (input.classList.contains('ow-inline-title')) {
                        STATE.steps[idx].title = input.value;
                        markChanged();
                    } else if (input.classList.contains('ow-inline-desc')) {
                        STATE.steps[idx].description = input.value;
                        markChanged();
                    }
                });

                initDragAndDrop();

                // Mount global capture click for RECORD MODE
                document.addEventListener('click', handleRecordClick, true);
            }
        }

            const conf = getAppConfig();

            if (conf.saved && Array.isArray(conf.saved) && conf.saved.length > 0) {
                document.getElementById('ow-config-initial-modal').style.display = 'block';
                document.getElementById('ow-config-confirm-modal').style.display = 'none';

        function initConfigSession(mode) {
            document.getElementById('ow-config-overlay').style.display = 'none';
            STATE.isConfigMode = true;
            resetChangesStatus();

            const conf = getAppConfig();
            STATE.currentScreenId = conf.screen;

            if (mode === 'new') {
                STATE.steps = [];
                openConfigPanel();
            } else if (mode === 'edit') {
                STATE.steps = JSON.parse(JSON.stringify(conf.saved || []));
                openConfigPanel();
            } else if (mode === 'add') {
                STATE.steps = JSON.parse(JSON.stringify(conf.saved || []));
                openConfigPanel();
            }
        }

        function openConfigPanel() {
            renderStepList();
            const sidebar = document.getElementById('ow-sidebar');
            setTimeout(() => sidebar.classList.add('ow-open'), 10);
            document.addEventListener('keydown', configKeyHandler);
        }

        function requestPanelClose() {
            if (STATE.hasUnsavedChanges) {
                document.getElementById('ow-config-initial-modal').style.display = 'none';
                document.getElementById('ow-config-confirm-modal').style.display = 'block';
                document.getElementById('ow-config-overlay').style.display = 'flex';

                forceCloseConfigPanel();

        function forceCloseConfigPanel() {
            document.getElementById('ow-sidebar').classList.remove('ow-open');

            document.removeEventListener('keydown', configKeyHandler);

        // --- Step List Render ---
        function renderStepList() {
            const listEl = document.getElementById('ow-step-list');
            listEl.innerHTML = '';

            if (STATE.steps.length === 0) {
                listEl.innerHTML = '<div style="color:#64748b; font-size:14px; text-align:center; padding:20px 10px;">Steps will appear here when you click elements in your app.</div>';
                return;
            }

            STATE.steps.forEach((step, idx) => {
                const item = document.createElement('div');
                item.className = 'ow-step-item';
                item.setAttribute('draggable', 'true');
                item.dataset.index = idx;

                item.innerHTML = `
            <div class="ow-step-handle">☰</div>
            <div class="ow-step-info">
                <input type="text" class="ow-inline-title" value="${escapeHtml(step.title)}" placeholder="Step Title">
                <textarea class="ow-inline-desc" rows="${step.description.length > 40 ? 3 : 2}" placeholder="Step Description">${escapeHtml(step.description)}</textarea>
                <div class="ow-step-sel" title="${escapeHtml(step.targetSelector)}">${escapeHtml(step.targetSelector)}</div>
            </div>
            <button class="ow-icon-btn ow-del-btn" title="Delete Step">✕</button>
        `;
                listEl.appendChild(item);
            });
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function saveFinalConfig() {
            const finalData = STATE.steps.map((s, idx) => ({ ...s, step: idx + 1 }));
            triggerKonfigKaydet(STATE.currentScreenId, finalData);
            showToast("Configuration saved and sent to Bubble ✓");
            resetChangesStatus();
            forceCloseConfigPanel();
        }

        // --- Record Mode Click Handler ---
        function handleRecordClick(e) {
            if (!STATE.isConfigMode || !STATE.isRecordingActive) return;

            // Ignore clicks on our UI components safely
            if (e.target.closest('.ow-sidebar') ||
                e.target.closest('.ow-widget-container') ||
                e.target.closest('.ow-toast') ||
                e.target.closest('.ow-config-overlay') ||
                e.target.closest('.ow-record-click-fx')) {
                return; // Don't record widgets
            }

            // WE DO NOT PREVENT DEFAULT OR STOP PROPAGATION HERE!
            // The underlying App processes the click normally.

            const target = e.target;
            const selector = generateSelector(target);
            const autoData = generateAutoStepData(target);

            // Save step
            STATE.steps.push({
                targetSelector: selector,
                title: autoData.title,
                description: autoData.description,
                placement: 'auto'
            });

            markChanged();
            renderStepList();

            // Sidebar scrolling to bottom automatically
            const listView = document.getElementById('ow-step-list-view');
            setTimeout(() => {
                listView.scrollTo({ top: listView.scrollHeight, behavior: 'smooth' });
            }, 50);

            // Visual feedback 
            showToast(`Recorded: ${autoData.title}`);
            fireVisualEffect(target);
        }

        function fireVisualEffect(target) {
            const rect = target.getBoundingClientRect();
            const fx = document.createElement('div');
            fx.className = 'ow-record-click-fx';

            const p = 4;
            fx.style.top = `${rect.top - p}px`;
            fx.style.left = `${rect.left - p}px`;
            fx.style.width = `${rect.width + p * 2}px`;
            fx.style.height = `${rect.height + p * 2}px`;

            document.body.appendChild(fx);

            // Animate out
            requestAnimationFrame(() => {
                fx.style.transform = 'scale(1.1)';
                fx.style.opacity = '0';
            });

            setTimeout(() => {
                if (fx.parentNode) document.body.removeChild(fx);
            }, 400);
        }


        // --- Drag and Drop ---
        function initDragAndDrop() {
            const listEl = document.getElementById('ow-step-list');
            let draggedItem = null;

            listEl.addEventListener('dragstart', (e) => {
                const item = e.target.closest('.ow-step-item');
                if (!item) return;

                // Prevent dragging if focusing inputs
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    e.preventDefault();
                    return;
                }

                draggedItem = item;
                setTimeout(() => item.classList.add('is-dragging'), 0);
            });

            listEl.addEventListener('dragend', (e) => {
                if (!draggedItem) return;
                draggedItem.classList.remove('is-dragging');
                draggedItem = null;
                recalculateStepsArray();
                markChanged();
            });

            listEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedItem) return;
                const afterElement = getDragAfterElement(listEl, e.clientY);
                if (afterElement == null) {
                    listEl.appendChild(draggedItem);
                } else {
                    listEl.insertBefore(draggedItem, afterElement);
                }
            });

            function getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.ow-step-item:not(.is-dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            function recalculateStepsArray() {
                const items = document.querySelectorAll('.ow-step-item');
                const oldState = [...STATE.steps];
                const newState = [];
                items.forEach(item => {
                    const oldIdx = parseInt(item.dataset.index);
                    // Before grabbing old state, ensure we carry latest input values
                    const _inTitle = item.querySelector('.ow-inline-title').value;
                    const _inDesc = item.querySelector('.ow-inline-desc').value;
                    let finalData = oldState[oldIdx];
                    finalData.title = _inTitle;
                    finalData.description = _inDesc;

                    newState.push(finalData);
                });
                STATE.steps = newState;
                renderStepList();
            }
        }

        function generateAutoStepData(el) {
            const tag = el.tagName.toLowerCase();

            let textCtx = "";
            if (el.innerText && el.innerText.trim() !== '') {
                const t = el.innerText.trim();
                textCtx = t.split('\n')[0].substring(0, 20);
            } else if (el.placeholder) {
                textCtx = el.placeholder.substring(0, 20);
            } else if (el.value) {
                textCtx = el.value.substring(0, 20);
            }

            let title = "App Element";
            let desc = "Please interact with this element.";

            if (tag === 'button' || el.getAttribute('role') === 'button' || el.type === 'submit') {
                title = textCtx ? `Click: ${textCtx}` : "Action Button";
                desc = "Click this button to save or proceed.";
            }
            else if (tag === 'input' || tag === 'textarea') {
                title = textCtx ? `Input: ${textCtx}` : "Input Field";
                desc = "Enter your information into this field.";
            }
            else if (tag === 'select') {
                title = "Dropdown Menu";
                desc = "Select an option from the list.";
            }
            else if (tag === 'a' || tag === 'a:link') {
                title = textCtx ? `Link: ${textCtx}` : "Navigation Link";
                desc = "Click this link to navigate.";
            }
            else if (tag === 'img' || tag === 'svg') {
                title = "Visual/Icon";
                desc = "This image indicates an important action.";
            } else {
                title = textCtx ? `Area: ${textCtx}` : "General Area";
            }

            return { title, description: desc };
        }


        function generateSelector(el) {
            if (el.hasAttribute('data-onboard')) return `[data-onboard="${CSS.escape(el.getAttribute('data-onboard'))}"]`;

            // Filters out transient hover states AND dynamically generated Bubble UUIDs (e.g. a177...x555)
            const badRegex = /^(ow-|current|active|focus|focused|hover|pressed|selected|ht|bubble-r-line|clickable|tt-cursor|tt-is-under-cursor|tt-hint|a\d{10,}x\d+)/i;
            function getCleanClasses(node) {
                if (!node || !node.classList) return '';
                return Array.from(node.classList).filter(c => !badRegex.test(c)).join('.');
            }

            // CRITICAL FIX: Custom Code blocks often have spaces or chars in IDs `#field-Name`. We MUST escape them.
            if (el.id && !/\d{5,}/.test(el.id)) return `#${CSS.escape(el.id)}`;

            let path = [];
            let current = el;

            // Go up dynamically until we map a UNIQUE CSS Selector
            while (current && current.nodeType === Node.ELEMENT_NODE) {
                if (current.tagName.toLowerCase() === 'body') break;

                // If the current node has a reliable ID, use it as an anchor and stop climbing!
                if (current.id && !/\d{5,}/.test(current.id) && current !== el) {
                    path.unshift(`#${CSS.escape(current.id)}`);
                    break;
                }

                let cTag = current.tagName.toLowerCase();
                let cClass = getCleanClasses(current);

                let sibling = current;
                let nth = 1;
                while (sibling = sibling.previousElementSibling) {
                    if (sibling.nodeName.toLowerCase() === cTag) nth++;
                }

                let part = cTag + (cClass ? `.${cClass}` : '');
                // ONLY append nth-of-type if it's strictly necessary (not the only sibling of its type),
                // OR if it's the very origin element clicked by the user (to strictly target that exact child natively).
                if (nth > 1 || current === el) part += `:nth-of-type(${nth})`;

                path.unshift(part);
                current = current.parentElement;

                let currentSel = path.join(' > ');
                try {
                    // Check if this path is completely unique yet across the entire DOM
                    let m = document.querySelectorAll(currentSel);
                    if (m.length === 1 && m[0] === el) return currentSel;
                } catch (e) { }
            }

            return path.join(' > ');
        }
    })();
</script>
