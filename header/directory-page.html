<!--
  ============================================================================
  GAIA DIRECTORY  —  /guides + /apps  ·  "PAGE HTML HEADER" BUILD   (07.08)
  ============================================================================
  SORUN (canli olcumle dogrulandi, 07.08):
     https://gaiasphere.io/guides   -> HTTP 200, <title> BOS, body.innerText = 0 karakter
     https://gaiasphere.io/apps     -> ayni
  Cunku iki sayfa da "type of content" sayfasi: govdedeki tek HTML elementi
  `Current Page guides'in body_html`ini basiyor. Slug yoksa Current Page thing
  de yok -> element BOS string basiyor -> BOMBOS beyaz sayfa. Yani /guides ve
  /apps bugun *var olan ama higbir sey gostermeyen* iki indexlenebilir URL.
  (template-page.html bunu 1066-1068. satirda coktan cozmus: son segment
  'templates' ise slug yok sayilir ve BROWSE modu acilir. Bu dosya ayni deseni
  guides + apps yuzeylerine tasir.)

  YAPISTIRMA YERI — AYNI DOSYA IKI SAYFAYA (icerik birebir ayni, degistirme):
     Bubble editor -> `guides` sayfasi -> Page property editor -> SEO/metatags
        -> "Script/meta tags in header" -> BU DOSYANIN TAMAMI
     Bubble editor -> `apps` sayfasi   -> ayni alan -> BU DOSYANIN TAMAMI
     Dosya hangi sayfada oldugunu URL'den kendisi anlar (yuzey = 'guides'|'apps').
     HTML ELEMENTINE YAPISTIRMA: header alani sunucudan gelen ham HTML'in
     icindedir, Bubble motoru boot etmeden calisir (home-page.html §6g dersi).

  IKI MOD (tek dosya):
   A) DIZIN modu  (/guides, /apps  ·  slug YOK)
      - Bubble'in bos govdesini gizler (yalnizca bu modda!) ve dizini cizer:
        hero + arama + kume basliklari + kartlar + A-Z tam liste + CTA + footer.
      - Sayfanin <title>, meta description ve JSON-LD'sini (CollectionPage +
        ItemList + BreadcrumbList) JS ile doldurur. Bugun ikisi de BOS.
   B) DETAY modu  (/guides/<slug>, /apps/<slug>  ·  slug VAR)
      - Govdeye DOKUNMAZ. Govde (Bubble HTML elementi) SONRADAN enjekte edildigi
        icin gelene kadar bekler (whenBody), sonra rehberde "On this page" TOC ve
        altina prev/next koyar. (11.09'a kadar DOMContentLoaded'da calisip govdeyi
        bulamiyordu: canli rehberlerde TOC hic cikmiyordu, olculdu.)
      - Karsilikli baglanti (11.09): hub'da "Guides for <App>" bolumu (SSS'den once),
        rehberde "App page for this guide" karti (prev/next'ten once). Eslesme yoksa yok.

  RAY (SOL MENU) ARTIK BU DOSYANIN ISI DEGIL (11.09):
     gx-rail v3 modulu dosyanin SONUNDAKI GX-RAIL-V3 araliginda; kaynak
     _gx_rail_v3.html, araligi sync_rail.ps1 yazar (elle duzenleme). Ray grup
     basliklarini link yapar, canli sayilari tasir, govdeye pismis v2 raylari siler.
     (v2 bu dosyada DOMContentLoaded'da ray kuruyordu; Bubble govdeyi sonra enjekte
     edince hub/rehber sayfalarinda IKI ray kaliyordu.) Bu dosya yalniz dizini cizer
     ve /guides'ta rehberleri raydaki satirlarla AYNI siniflamayla (guideType) gruplar:
     id'ler getting-started, by-app, by-workflow, by-role (ray bu capalara link verir).

  KART LOGOSU (07.08 kullanici geri bildirimi, hala gecerli):
     logos.composio.dev/api/<slug> HER slug icin 128x128 gorsel doner (uydurma slug
     dahil, olculdu) -> `onerror` ile temizlemek IMKANSIZ, tahmin yanlis logo basar.
     Bu yuzden rehberin app'i BEYAZ LISTEDEN bulunur (APPS = _cards.json'daki kartlarin
     integrations alanindan cikan 29 toolkit). Eslesme yoksa logo hic basilmaz.
  OLCEK / VERI BUTCESI (durust sinir, gizlenmiyor):
     Bubble Data API alan secmeye izin vermiyor; her kayit body_html ile birlikte
     geliyor (rehber ~17 KB, hub ~48 KB). Bu yuzden dizin, kayitlari 25'erli
     sayfalarla ve PROGRESIF ceker; MAX_REC (400 kayit) VEYA MAX_BYTES (~2,6 MB)
     sinirina gelince crawl'i DURDURUR. Kalanlar kaybolmaz:
       - tam slug listesi /sitemap-<yuzey>.xml'den (URL basina ~60 bayt) alinir,
         "All guides A-Z" bolumunde link olarak cikar (ic-link grafigi tam kalir),
       - arama, yerel sette bulamazsa Data API'ye `text contains` sorgusu atar,
         yani 1000 sayfanin 1000'i de aranabilir kalir.
     ~300 rehberi gecince DOGRU cozum slim bir index kaynagidir (ayri `guide_index`
     tipi ya da yayinla birlikte guncellenen tek JSON dosyasi). Degistirilecek TEK
     yer asagidaki `loadIndex` fonksiyonu; gerisi aynen calisir.

  BILINEN SINIRLAR (sessizce "yapilmis" sayilmiyor):
   - Dizin icerigi JS ile cizilir (template-page.html browse modu ile ayni durum;
     Google render ediyor, ilk 299 template bu yolla indexlendi).
   - og:/twitter: etiketleri buradan basilamaz — Bubble kendi og etiketlerini
     <head>'de DAHA ONCE basar, crawler ilkini alir. Dizin sayfalarinin sosyal
     onizlemesi icin Bubble sayfa SEO alanlari kullanilmali (checklist §6b deseni).
   - Cok dilli icerik cevirisi YOK (template-page.html'deki MT katmani buraya
     tasinmadi). Dizin Ingilizce kalir; UI dili kurali zaten Ingilizce.
   - `/apps` sitemap'te DEGIL (canli kontrol: /sitemap-apps.xml -> "null"), yani
     hub'lar Google'a yalnizca ic linklerden ulasiyor. Bubble Settings -> SEO'da
     apps sayfa tipi isaretlenmeli (BUBBLE_SEO_DEPLOYMENT_CHECKLIST §6d).

  KOPYA KURALLARI: dil INGILIZCE (project_ui_language_rule) · EM DASH YASAK ·
  uydurma sayi YOK (dizindeki her sayi canli kayittan gelir).
-->

  function enc(o){return encodeURIComponent(JSON.stringify(o));}
  function titleCase(s){return String(s||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b[a-z]/g,function(m){return m.toUpperCase();});}
  /* "confluence-meeting-notes" -> "Confluence meeting notes" (pismis rayin kullandigi bicim) */
  function sentenceCase(s){var t=String(s||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();return t?t.charAt(0).toUpperCase()+t.slice(1):'';}

  /* ==========================================================================
     2b) UYGULAMA TANIMA (rehber satirlarina logo icin)
     DIKKAT: logos.composio.dev/api/<slug> HER slug icin 128x128 bir gorsel doner
     (uydurma slug dahil; olculdu). Yani `onerror` HIC atesLENMEZ -> "dene, tutmazsa
     gizle" YANLIS logo basar. Bu yuzden tanima BEYAZ LISTE ile yapilir.
     Liste _cards.json'daki 487 kartin integrations alanindan cikarilan 29 farkli
     toolkit slug'idir (yani sitenin GERCEKTEN destekledigi set) + canli hub slug'lari.
     Yeni entegrasyon eklenince tek yer: APPS dizisi.
     ========================================================================== */
  var APPS=['gmail','apollo','slack','googlesheets','hubspot','jira','notion','googledocs','googlecalendar',
            'zendesk','outlook','mailchimp','intercom','pipedrive','trello','calendly','gorgias','confluence',
            'salesforce','linear','airtable','todoist','monday','freshdesk','clickup','asana','linkedin','stripe','excel'];
  /* slug/kume icinde gecen ama toolkit adi FARKLI olan yazimlar */
  var APP_ALIAS={sheets:'googlesheets','google-sheets':'googlesheets',spreadsheet:'googlesheets',
                 docs:'googledocs','google-docs':'googledocs',
                 calendar:'googlecalendar','google-calendar':'googlecalendar',gcal:'googlecalendar',
                 'microsoft-excel':'excel',gsheets:'googlesheets'};
  var LIVE_APPS={};                       /* canli hub slug'lari; API'den gelince dolar */
  function knownApp(tok){
    if(!tok)return '';
    tok=tok.toLowerCase();
    if(APP_ALIAS[tok])tok=APP_ALIAS[tok];
    return (APPS.indexOf(tok)>-1||LIVE_APPS[tok])?tok:'';
  }
  /* Rehberin app'i: once kume alani, sonra slug parcalari (bitisik ikili denemesiyle
     "google-sheets" gibi iki parcali adlar da yakalanir). Bulunamazsa logo YOK. */
  function detectApp(it){
    if(!it)return '';
    var direct=knownApp(it.group);if(direct)return direct;
    var parts=String((it.group||'')+'-'+(it.slug||'')).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    for(var i=0;i<parts.length;i++){
      if(i+1<parts.length){var pair=knownApp(parts[i]+'-'+parts[i+1]);if(pair)return pair;}
      var one=knownApp(parts[i]);if(one)return one;
    }
    return '';
  }
  function plural(n,u){return n+' '+(n===1?u[0]:u[1]);}

  /* ==========================================================================
     3) VERI KATMANI
     slim() -> kayittan yalnizca dizinin ihtiyaci olan alanlari alir; body_html
     BELLEKTE TUTULMAZ (yoksa 400 kayit = onlarca MB'lik JS heap).
     ========================================================================== */
  var CK='gx_dir_'+C.key+'_v1';
  function slim(r){
    return {
      slug:String(r.Slug||''),
      name:String(r.name||r.seo_title||''),
      desc:String(r.meta_description||''),
      group:String(r[C.groupField]||''),
      mod:String(r['Modified Date']||r['Created Date']||'')
    };
  }
  /* Data API tek istekte alan secmeye izin vermez; sayfa sayfa ceker, her sayfadan
     sonra onPage ile ekrani tazeler (progresif boya), butce dolunca durur. */
  function loadIndex(onPage,onDone){
    var cached=lsGet(CK);
    if(cached&&cached.items&&(Date.now()-(cached.ts||0)<CACHE_TTL)){
      onPage(cached.items,cached.total,cached.truncated);
    }
    var out=[],cursor=0,bytes=0,total=0,sortable=true;
    /* failed: "kayit yok" ile "kaydi CEKEMEDIK" ayri seylerdir. Ikisini ayni ekranla
       gostermek yalan olurdu (bos katalog iddiasi); paint() bunlari ayri yazar. */
    function finish(trunc,failed){
      if(!failed)lsSet(CK,{ts:Date.now(),items:out,total:total||out.length,truncated:!!trunc});
      onDone(out,total||out.length,!!trunc,!!failed&&!out.length);
    }
    function step(){
      var url=API+C.type+'?limit='+PAGE+'&cursor='+cursor+(sortable?'&sort_field=Modified%20Date&descending=true':'');
      fetch(url,{headers:{Accept:'application/json'}}).then(function(r){
        /* Bubble bilinmeyen sort_field'da 404 doner -> sirasiz tekrar dene (tek sefer).
           Sirasiz da basarisizsa AKISI KAPAT: yoksa "Loading" sonsuza kadar donerdi. */
        if(!r.ok){if(sortable){sortable=false;step();}else{finish(false,true);}return null;}
        return r.text();
      }).then(function(t){
        if(t==null)return;
        bytes+=t.length;
        var j;try{j=JSON.parse(t);}catch(e){finish(false,true);return;}
        var res=j&&j.response;if(!res){finish(false,true);return;}
        (res.results||[]).forEach(function(x){if(x&&x.Slug)out.push(slim(x));});
        var remaining=res.remaining||0;
        total=out.length+remaining;
        onPage(out,total,remaining>0);
        if(remaining>0&&out.length<MAX_REC&&bytes<MAX_BYTES){cursor+=PAGE;step();return;}
        finish(remaining>0,false);
      }).catch(function(){finish(false,true);});
    }
    step();
  }
  /* Sitemap yedegi: butce yuzunden cekilemeyen kayitlarin slug'lari da linklenebilsin
     diye (ic-link grafigi eksik kalmasin). Bubble sayfa tipi sitemap'te degilse govde
     "null" doner; o zaman sessizce atlanir. */
  function loadSitemapSlugs(cb){
    if(!C.sitemap){cb([]);return;}
    fetch(C.sitemap).then(function(r){return r.ok?r.text():'';}).then(function(t){
      if(!t||t.indexOf('<loc')<0){cb([]);return;}
      var out=[],re=/<loc>\s*([^<\s]+)\s*<\/loc>/g,m;
      while((m=re.exec(t))){
        var parts=m[1].split('/').filter(Boolean);
        var last=parts[parts.length-1];
        if(last&&last!==C.key)out.push(decodeURIComponent(last));
      }
      cb(out);
    }).catch(function(){cb([]);});
  }
  /* Butce disinda kalan kayitlar da ARANABILIR kalsin: sunucu tarafi `text contains`. */
  function serverSearch(q,cb){
    var u=API+C.type+'?limit=12&constraints='+enc([{key:'name',constraint_type:'text contains',value:q}]);
    fetch(u,{headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null;})
      .then(function(j){cb(((j&&j.response&&j.response.results)||[]).map(slim));}).catch(function(){cb([]);});
  }

  /* Kart logosu: hub ise slug'in kendisi (API'den geldi, dogrulanmis),

  function guideType(it){
    var c=String(it.group||'').toLowerCase(),s=String(it.slug||'').toLowerCase();
    if(c==='getting-started'||s.indexOf('getting-started')===0)return 'start';
    if(c.indexOf('role-')===0)return 'role';
    return detectApp(it)?'app':'workflow';
  }
  var GUIDE_GROUPS=[['start','getting-started','Getting started'],['app','by-app','Guides by app'],
                    ['workflow','by-workflow','Guides by workflow'],['role','by-role','Guides by role']];
  /* Raydan /guides#by-app ile gelinince grup basliklari veri gelince cizilir; tarayicinin
     ilk capa atlamasi bosa duser. Ilk dolu cizimden sonra bir kez kaydir. */
  var HASH_DONE=false;

    if(!IS_INDEX||HASH_DONE||STATE.q)return;

  /* Hub / rehber govdesi Bubble HTML elementi tarafindan SONRADAN enjekte edilir

     8 h2'li rehberde "On this page" yoktu). Govde gelene kadar bekle (en fazla 20 sn). */
  function whenBody(cb){
    var sel='.gx-guide,.gx-hub';
    if(document.querySelector(sel)){cb();return;}
    var done=false,mo=null,iv=null;
    function hit(){
      if(done||!document.querySelector(sel))return;
      done=true;if(mo)mo.disconnect();if(iv)clearInterval(iv);
      setTimeout(cb,0);
    }
    if(window.MutationObserver){mo=new MutationObserver(hit);mo.observe(document.documentElement,{childList:true,subtree:true});}
    iv=setInterval(hit,400);
    setTimeout(function(){if(!done){done=true;if(mo)mo.disconnect();clearInterval(iv);}},20000);
  }

  /* Gruplama: kume alani anlamli degilse (cogu kume tek elemanli) DUZ listeye duser.
     Boylece "her rehber kendi kumesi" gibi anlamsiz bir dizin cikmaz. */
  function groupItems(items){
    /* Rehberler: tur gruplari. Kume alani cogu rehberde tek elemanli (11.09: 23 rehber,
       19 kume) oldugundan kume gruplamasi bilgi katmiyordu. Sira: getting started,
       by app (uygulamaya gore dizili), by workflow, by role. Bos grup cizilmez. */
    if(KEY==='guides'){
      var byT={start:[],app:[],workflow:[],role:[]};
      items.forEach(function(it){byT[guideType(it)].push(it);});
      var nm=function(a,b){return (a.name||a.slug).localeCompare(b.name||b.slug);};
      byT.app.sort(function(a,b){return detectApp(a).localeCompare(detectApp(b))||nm(a,b);});
      byT.start.sort(nm);byT.workflow.sort(nm);byT.role.sort(nm);
      var outT=[];
      GUIDE_GROUPS.forEach(function(g){if(byT[g[0]].length)outT.push({label:g[2],id:g[1],items:byT[g[0]]});});
      return outT;
    }
    var by={},order=[];
    items.forEach(function(it){
      var g=(it.group||'').trim()||'other';
      if(!by[g]){by[g]=[];order.push(g);}
      by[g].push(it);
    });
    var singles=order.filter(function(g){return by[g].length===1;}).length;
    /* Az sayida kayitta ya da kumelerin cogu tek uyeliyken gruplama BILGI KATMAZ,
       yalnizca basliklar arasinda tek kart birakir -> duz liste. */
    if(order.length<2||items.length<6||(order.length>4&&singles/order.length>0.6)){
      return [{label:'All '+C.unit[1],items:items.slice()}];
    }
    order.sort(function(a,b){return by[b].length-by[a].length||a.localeCompare(b);});
    return order.map(function(g){
      var label=(KEY==='apps')?(g==='app'?'Apps':g==='category'?'Categories':titleCase(g)):titleCase(g);
      return {label:label,items:by[g]};
    });
  }

    var body=document.getElementById('gxDirBody'),cnt=document.getElementById('gxDirCount');

    });
    /* butce disi kalanlardan gelen sunucu-arama sonuclarini ekle (tekrarsiz) */
    if(q&&STATE.remote.length){

    }
    if(cnt){
      var head=plural(STATE.total||STATE.items.length,C.unit);
      if(q)head=plural(list.length,C.unit)+' matching "'+esc(STATE.q.trim())+'"';

      body.innerHTML=STATE.failed

        : '<div class="d-state">'+esc(C.empty)+' <a href="/templates">Browse templates</a></div>';

      var all=Object.keys(known);
      STATE.extra.forEach(function(s){if(!known[s]){known[s]=titleCase(s);all.push(s);}});

  function buildToc(){
    if(!C.toc)return;
    var art=document.querySelector('.gx-guide .g-art');
    var col=(art&&art.querySelector('.g-narrow'))||art||document.querySelector('.gx-guide');
    if(!art||!col)return;
    var hs=Array.prototype.slice.call(art.querySelectorAll('h2')).filter(function(h){return (h.textContent||'').trim().length>1;});
    if(hs.length<3)return;
    var used={},links='';
    hs.forEach(function(h,i){
      var id=h.id;
      if(!id){
        id=(h.textContent||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||('s'+i);
        if(used[id])id=id+'-'+i;
        h.id=id;
      }
      used[id]=1;
      h.style.scrollMarginTop='24px';
      links+='<a href="#'+id+'" data-t="'+id+'">'+esc((h.textContent||'').trim())+'</a>';
    });
    var fixed=document.createElement('nav');
    fixed.id='gxToc';fixed.setAttribute('aria-label','On this page');
    fixed.innerHTML='<div class="t-h">On this page</div>'+links;
    document.body.appendChild(fixed);
    var inline=document.createElement('details');
    inline.id='gxTocIn';inline.open=true;
    inline.innerHTML='<summary>On this page</summary><div class="t-in">'+links+'</div>';
    col.insertBefore(inline,col.firstChild);

    /* Yerlesim OLCUMLE secilir: makalenin sagindaki bosluk TOC + nefes payini
       aliyorsa sabit sutun, almiyorsa satir-ici kart. Yeniden boyutlandirmada
       tekrar karar verilir. */
    function place(){
      var r=col.getBoundingClientRect();
      /* clientWidth, innerWidth DEGIL: innerWidth kaydirma cubugunu da sayar ve
         olcumu ~15px sisirir; ilk denemede TOC tam o kadar bindi. */
      var vw=document.documentElement.clientWidth;
      var gutter=vw-r.right;
      var canFix=gutter>=236&&vw>=1080;
      fixed.style.display=canFix?'block':'none';
      inline.style.display=canFix?'none':'block';
    }
    place();
    window.addEventListener('resize',debounce(place,180));

    if(window.IntersectionObserver){
      var obs=new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting)return;
          Array.prototype.forEach.call(fixed.querySelectorAll('a'),function(a){
            a.className=(a.getAttribute('data-t')===e.target.id)?'on':'';
          });
        });
      },{rootMargin:'0px 0px -72% 0px',threshold:0});
      hs.forEach(function(h){obs.observe(h);});
    }
  }
  function buildPrevNext(sibs){
    if(!C.toc||sibs.length<2)return;
    var idx=-1;
    sibs.forEach(function(s,i){if(s.slug===SLUG)idx=i;});
    if(idx<0)return;
    var prev=sibs[idx-1],next=sibs[idx+1];
    if(!prev&&!next)return;
    var host=document.querySelector('.gx-guide .g-band')||document.querySelector('.gx-guide');
    if(!host)return;
    var d=document.createElement('div');d.id='gxPrevNext';
    d.innerHTML=
      (prev?'<a href="'+C.base+'/'+encodeURIComponent(prev.slug)+'"><span class="pn-k">Previous</span><span class="pn-t">'+esc(prev.name||titleCase(prev.slug))+'</span></a>':'<span></span>')+
      (next?'<a class="pn-next" href="'+C.base+'/'+encodeURIComponent(next.slug)+'"><span class="pn-k">Next</span><span class="pn-t">'+esc(next.name||titleCase(next.slug))+'</span></a>':'<span></span>');
    host.parentNode.insertBefore(d,host);
  }
  /* Kardesler: ayni kumedeki kayitlar. Once yerel onbellek (bedava), yoksa iki
     kucuk istek (kaydin kendisi -> kume -> kume uyeleri). Idle'da calisir, makale
     boyamasini HIC bekletmez. */
  function loadSiblings(cb){
    var cached=lsGet(CK);
    if(cached&&cached.items&&cached.items.length){
      var me=null;cached.items.forEach(function(x){if(x.slug===SLUG)me=x;});
      if(me){
        var sibs=cached.items.filter(function(x){return (x.group||'')===(me.group||'');});
        if(sibs.length>1){cb(sortByName(sibs),me);return;}
      }
    }
    fetch(API+C.type+'?limit=1&constraints='+enc([{key:'Slug',constraint_type:'equals',value:SLUG}]),{headers:{Accept:'application/json'}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){
        var rec=j&&j.response&&j.response.results&&j.response.results[0];
        if(!rec){cb([],null);return;}
        var me=slim(rec);
        if(!me.group){cb([],me);return;}
        fetch(API+C.type+'?limit=10&constraints='+enc([{key:C.groupField,constraint_type:'equals',value:me.group}]),{headers:{Accept:'application/json'}})
          .then(function(r){return r.ok?r.json():null;})
          .then(function(j2){
            var res=((j2&&j2.response&&j2.response.results)||[]).map(slim);
            cb(sortByName(res),me);
          }).catch(function(){cb([],me);});
      }).catch(function(){cb([],null);});
  }
  function sortByName(a){return a.slice().sort(function(x,y){return (x.name||x.slug).localeCompare(y.name||y.slug);});}
  /* ==========================================================================
     7) KARSILIKLI BAGLANTI (ortak handoff'u, 11.09). 11.09 olcumu: hub govdelerinde
        rehbere, rehber govdelerinde hub'a GERCEK link yoktu (tek baglar pismis
        raydaydi ve v3 onu siliyor). Hub'da: o uygulamanin rehberleri. Rehberde:
        ilgili uygulama sayfasi. Liste site haritasindan (~2 KB); adlar yalniz
        eslesen kayitlar icin tek istekle gelir. Eslesme yoksa bolum CIZILMEZ.
     ========================================================================== */
  /* Rehberin andigi TUM uygulamalar (detectApp yalniz ilkini dondurur):
     "gmail-to-google-sheets" -> gmail + googlesheets, "slack-jira-bot" -> slack + jira. */
  function appsInGuide(it){
    var out=[],seen={};
    function add(a){if(a&&!seen[a]){seen[a]=1;out.push(a);}}
    add(knownApp(it.group));
    var p=String((it.group||'')+'-'+(it.slug||'')).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    for(var i=0;i<p.length;i++){
      if(i+1<p.length){var two=knownApp(p[i]+'-'+p[i+1]);if(two){add(two);i++;continue;}}
      add(knownApp(p[i]));
    }
    return out;
  }
  function shortHub(name,slug){return String(name||'').replace(/^\s*AI\s+Assistants?\s+for\s+/i,'').trim()||titleCase(slug);}
  function relatedGuides(){
    var host=document.querySelector('.gx-hub');
    if(!host||document.getElementById('gxRelG'))return;
    fetch('/sitemap-guides.xml').then(function(r){return r.ok?r.text():'';}).then(function(t){
      if(!t||t.indexOf('<loc')<0)return;
      var slugs=[],re=/<loc>\s*([^<\s]+)\s*<\/loc>/g,m;
      while((m=re.exec(t))){var s=(m[1].split('/guides/')[1]||'').split(/[?#\/]/)[0];if(s){try{slugs.push(decodeURIComponent(s));}catch(e){slugs.push(s);}}}
      var mine=slugs.filter(function(s){return appsInGuide({slug:s,group:''}).indexOf(SLUG)>-1;});
      if(!mine.length)return;
      var u=API+'guides?limit=10&constraints='+enc([{key:'Slug',constraint_type:'in',value:mine}]);
      return fetch(u,{headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(j){
        var list=((j&&j.response&&j.response.results)||[]).map(slim).filter(function(g){return g.slug;});
        if(!list.length||document.getElementById('gxRelG'))return;
        list.sort(function(a,b){return (a.name||a.slug).localeCompare(b.name||b.slug);});
        var h1=host.querySelector('h1'),app=shortHub(h1?h1.textContent:'',SLUG);
        var s=document.createElement('section');s.className='g-sec';s.id='gxRelG';
        s.innerHTML='<div class="g-wrap"><h2 class="stitle">Guides for '+esc(app)+'</h2>'+
          '<p class="rg-sub">Step by step walkthroughs for the work that arrives in '+esc(app)+'.</p><div class="rg-grid">'+
          list.map(function(g){
            return '<a class="rg-card" href="/guides/'+encodeURIComponent(g.slug)+'"><span class="rg-k">Guide</span>'+
              '<span class="rg-t">'+esc(g.name||titleCase(g.slug))+'</span>'+(g.desc?'<span class="rg-d">'+esc(g.desc)+'</span>':'')+
              '<span class="rg-m">Read guide</span></a>';
          }).join('')+'</div></div>';
        var faq=host.querySelector('.faq'),before=(faq&&faq.closest)?faq.closest('section'):null;
        if(!before)before=host.querySelector('.g-cta');
        if(before&&before.parentNode)before.parentNode.insertBefore(s,before);else host.appendChild(s);
        gxTrack('related_guides_shown',{surface:'apps',app:SLUG,count:list.length});
      });
    }).catch(function(){});
  }
  function relatedApps(me){
    var art=document.querySelector('.gx-guide');
    if(!art||document.getElementById('gxRelA'))return;
    var cands=appsInGuide(me||{slug:SLUG,group:''});
    if(!cands.length)return;
    var u=API+'hubs?limit=3&constraints='+enc([{key:'Slug',constraint_type:'in',value:cands}]);
    fetch(u,{headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      var hubs=((j&&j.response&&j.response.results)||[]).map(function(r){
        return {slug:String(r.Slug||''),name:String(r.name||''),desc:String(r.meta_description||'')};
      }).filter(function(h){return h.slug;});
      if(!hubs.length||document.getElementById('gxRelA'))return;
      hubs.sort(function(a,b){return cands.indexOf(a.slug)-cands.indexOf(b.slug);});
      var d=document.createElement('div');d.id='gxRelA';
      d.innerHTML='<div class="ra-h">'+(hubs.length>1?'App pages for this guide':'App page for this guide')+'</div>'+
        hubs.map(function(h){
          return '<a class="ra-card" href="/apps/'+encodeURIComponent(h.slug)+'"><span class="ra-logo"><img src="'+LOGO+encodeURIComponent(h.slug)+'" alt="" loading="lazy"></span>'+
            '<span class="ra-tx"><b>AI assistants for '+esc(shortHub(h.name,h.slug))+'</b>'+(h.desc?'<i>'+esc(h.desc)+'</i>':'')+'</span><span class="ra-go">&rsaquo;</span></a>';
        }).join('');
      var pn=document.getElementById('gxPrevNext'),ref=(pn&&pn.parentNode)?pn:art.querySelector('.g-band');
      if(ref&&ref.parentNode)ref.parentNode.insertBefore(d,ref);else art.appendChild(d);
      gxTrack('related_apps_shown',{surface:'guides',guide:SLUG,count:hubs.length});
    }).catch(function(){});
  }
  function startDetail(){
    gxTag('page_type',KEY+'_detail');
    whenBody(function(){
      buildToc();
      idle(function(){
        loadSiblings(function(sibs,me){
          if(sibs.length>1)buildPrevNext(sibs);
          if(KEY==='guides')relatedApps(me);
        });
        if(KEY==='apps')relatedGuides();
      });
    });
  }
  ready(function(){ if(IS_INDEX)startIndex(); else startDetail(); });
})();
</script>

  /* ---- VERI ---- */
  var DATA={templates:null,hubs:null,guides:null,hubList:null,guideList:null,newestGuide:null,categories:0,asOf:null,live:false};
  function merge(d){if(!d)return;for(var k in d)if(Object.prototype.hasOwnProperty.call(d,k)&&d[k]!=null)DATA[k]=d[k];}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function sentenceCase(s){var t=String(s||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();return t?t.charAt(0).toUpperCase()+t.slice(1):'';}
  function titleCase(s){return String(s||'').replace(/[-_]+/g,' ').trim().replace(/\b[a-z]/g,function(m){return m.toUpperCase();});}
  function knownApp(t){if(!t)return '';t=String(t).toLowerCase();if(APP_ALIAS[t])t=APP_ALIAS[t];return APPS.indexOf(t)>-1?t:'';}
  function detectApp(g){
    if(!g)return '';
    var d=knownApp(g.cluster);if(d)return d;
    var p=String((g.cluster||'')+'-'+(g.slug||'')).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    for(var i=0;i<p.length;i++){
      if(i+1<p.length){var two=knownApp(p[i]+'-'+p[i+1]);if(two)return two;}
      var one=knownApp(p[i]);if(one)return one;
    }
    return '';
  }
  function guideType(g){
    var c=String(g.cluster||'').toLowerCase(),s=String(g.slug||'').toLowerCase();
    if(c==='getting-started'||s.indexOf('getting-started')===0)return 'start';
    if(c.indexOf('role-')===0)return 'role';
    return detectApp(g)?'app':'workflow';
  }
  function facets(){
    var L=DATA.guideList;if(!L||!L.length)return null;
    var f={start:0,app:0,workflow:0,role:0};
    for(var i=0;i<L.length;i++)f[guideType(L[i])]++;
    return f;
  }
  function isNew(){
    if(!DATA.newestGuide)return false;
    var t=Date.parse(DATA.newestGuide);if(isNaN(t))return false;
    return (Date.now()-t)/864e5<=CFG.newDays;
  }
  function find(list,slug){if(!list)return null;for(var i=0;i<list.length;i++)if(list[i].slug===slug)return list[i];return null;}
  function appName(slug){var h=find(DATA.hubList,slug);return (h&&h.name)||APP_NAMES[slug]||titleCase(slug);}
  /* Rehber basliklari 344-418 px istiyor (olculdu); 292 px'lik rayda bile sigmaz.
     directory-page.html shortLabel ile ayni kural: iki nokta / " - " oncesi, uzunsa
     slug'dan cumle duzeni, o da uzunsa kelime sinirindan kirp. Tam ad title'da. */
  var LBL_MAX=44;   /* bulunulan rehber satiri 2 satira kadar kirilir (.is-2l) */
  function guideLabel(slug){
    var g=find(DATA.guideList,slug),n=g&&g.name?String(g.name):'';
    var cut=n.split(':')[0].split(' - ')[0].trim();
    if(cut&&cut.length<=LBL_MAX)return cut;
    var fs=sentenceCase(slug);
    if(fs&&fs.length<=LBL_MAX)return fs;
    var base=fs||cut||n;
    return base.length>LBL_MAX?base.slice(0,LBL_MAX).replace(/\s+\S*$/,'')+'…':base;
  }

  }
  function where(){var s=path().split('/');return {sec:s[1]||'home',slug:s[2]?decodeURIComponent(s[2]):''};}
  function isMobile(){return W.matchMedia?W.matchMedia('(max-width:1079.98px)').matches:(W.innerWidth<1080);}

  /* ---- GRUP DURUMU ---- */
  var OPEN=lsGet('gx_rail3_open')||{};  /* masaustu, kalici */
  var HERE={};                           /* bu sayfa gorunumunde kullanicinin yaptigi */
  var MOPEN=null;                        /* mobil, gecici: acik tek grup */
  function isOpen(key){
    if(Object.prototype.hasOwnProperty.call(HERE,key))return HERE[key];
    if(isMobile())return MOPEN===null?where().sec===key:MOPEN===key;
    if(where().sec===key)return true;
    return OPEN[key]!==false;
  }

  /* ---- CIZIM ---- */
  function top(href,icon,label,cur,exact,count){

      '<span class="gx3-tx">'+esc(label)+'</span>'+(count!=null?' <span class="gx3-n">'+fmt(count)+'</span>':'')+'</a>';
  }
  function kid(href,label,cur,logo,count,title,twoLine){
    return '<a class="gx3-s'+(cur?' is-cur':'')+'" href="'+href+'"'+(cur?' aria-current="page"':'')+(title?' title="'+esc(title)+'"':'')+'>'+

  }

      '<div class="gx3-kids" id="'+id+'">'+o.kids+'</div></div>';

  function mount(){

     Enjeksiyon sayfa acilisinda bir kez olur: 30 sn sonra gozcu kapanir. */
  function sweep(n){
    if(!RAIL||!n||n.nodeType!==1)return;
    if(n.id==='gxRail'&&n!==RAIL){if(n.parentNode)n.parentNode.removeChild(n);return;}
    if(!n.querySelectorAll)return;
    var q=n.querySelectorAll('[id="gxRail"]');
    for(var i=0;i<q.length;i++)if(q[i]!==RAIL&&q[i].parentNode)q[i].parentNode.removeChild(q[i]);
  }
  function guard(){
    if(!W.MutationObserver)return;
    var mo=new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var a=ms[i].addedNodes;for(var k=0;k<a.length;k++)sweep(a[k]);}
    });
    mo.observe(D.documentElement,{childList:true,subtree:true});
    setTimeout(function(){try{mo.disconnect();}catch(e){}sweep(D.body);},30000);
  }
  function focusKey(){
    var a=D.activeElement;if(!a||!RAIL||!RAIL.contains(a))return null;
    if(a.classList&&a.classList.contains('gx3-chev'))return {chev:a.getAttribute('aria-controls')};
    return {href:a.getAttribute('href')};
  }
  function restoreFocus(k){
    if(!k)return;
    var el=k.chev?RAIL.querySelector('.gx3-chev[aria-controls="'+k.chev+'"]'):(k.href?RAIL.querySelector('.gx3-nav a[href="'+k.href+'"]'):null);
    if(el)try{el.focus({preventScroll:true});}catch(e){el.focus();}
  }
  function render(){
    if(!RAIL)return;
    var nav=RAIL.querySelector('.gx3-nav');if(!nav)return;
    var fk=focusKey();
    nav.innerHTML=navHTML();
    var lg=RAIL.querySelector('.gx3-foot .gx3-l');
    if(lg){var cur=where().sec==='login';lg.className='gx3-l'+(cur?' is-cur':'');if(cur)lg.setAttribute('aria-current','page');else lg.removeAttribute('aria-current');}
    restoreFocus(fk);
  }

  /* ---- ETKILESIM ---- */
  function track(n,p){
    try{if(typeof W.gtag==='function')W.gtag('event',n,p);else if(W.dataLayer&&W.dataLayer.push)W.dataLayer.push(['event',n,p]);}catch(e){}
    try{if(typeof W.clarity==='function')W.clarity('event',n);}catch(e){}
  }
  function setGroup(g,open){
    g.classList[open?'remove':'add']('is-closed');
    var b=g.querySelector('.gx3-chev');if(b)b.setAttribute('aria-expanded',String(open));
  }
  function drawer(open){
    var m=RAIL&&RAIL.querySelector('.gx3-menu');if(!m)return;
    m.checked=!!open;
    D.documentElement.classList[open&&isMobile()?'add':'remove']('gxr3-lock');
  }
  function bind(){
    RAIL.addEventListener('click',function(e){
      var t=e.target;
      var b=t.closest?t.closest('.gx3-chev'):null;
      if(b){
        var g=b.closest('.gx3-grp'),key=g.getAttribute('data-gxr-grp'),now=g.classList.contains('is-closed');
        setGroup(g,now);HERE[key]=now;
        if(isMobile()){
          MOPEN=now?key:'';
          if(now){var gs=RAIL.querySelectorAll('.gx3-grp');for(var i=0;i<gs.length;i++){if(gs[i]!==g){setGroup(gs[i],false);HERE[gs[i].getAttribute('data-gxr-grp')]=false;}}}
        }else{OPEN[key]=now;lsSet('gx_rail3_open',OPEN);}
        track('rail_toggle',{group:key,open:now});
        return;
      }
      var a=t.closest?t.closest('a[href]'):null;
      if(a){
        var href=a.getAttribute('href');
        track('rail_nav',{link_url:href,from_path:path()});
        if(href.indexOf('#')>-1)drawer(false);
      }
    });
    RAIL.addEventListener('change',function(e){
      if(e.target&&e.target.classList&&e.target.classList.contains('gx3-menu'))drawer(e.target.checked);
    });
    D.addEventListener('keydown',function(e){
      if((e.key==='Escape'||e.key==='Esc')&&RAIL.querySelector('.gx3-menu:checked')){
        drawer(false);var m=RAIL.querySelector('.gx3-menu');if(m)m.focus();
      }
    });
    if(W.matchMedia){
      var mq=W.matchMedia('(max-width:1079.98px)');
      var onMq=function(){drawer(false);HERE={};MOPEN=null;render();};
      if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);
    }
  }

  /* ---- CANLI VERI (24 saat onbellek) ---- */
  function total(j){var r=j&&j.response;return r?(r.count||0)+(r.remaining||0):null;}
  function getJSON(u,cb){try{fetch(u,{headers:{Accept:'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(cb,function(){cb(null);});}catch(e){cb(null);}}
  function getText(u,cb){try{fetch(u).then(function(r){return r.ok?r.text():'';}).then(cb,function(){cb('');});}catch(e){cb('');}}
  function locs(xml,base){
    if(!xml||xml.indexOf('<loc>')<0)return null;
    var out=[],re=/<loc>\s*([^<\s]+)\s*<\/loc>/g,m;
    while((m=re.exec(xml))){var u=m[1],i=u.indexOf(base);if(i>-1){var s=u.slice(i+base.length).split(/[?#\/]/)[0];if(s)out.push({slug:decodeURIComponent(s)});}}
    return out;
  }
  function fetchLive(origin,done){
    var d={},pend=4,O=origin||'';
    /* site haritalari CORS basligi tasimaz: yalniz ayni kaynaktan okunur (canli sayfa). Prototip gibi
       baska kaynakta dogrudan Data API'ye dusulur, konsolda bosuna CORS hatasi birakilmaz. */
    var same=!O||O===location.origin;
    function end(){if(--pend===0)done(d);}
    getJSON(O+CFG.api+'templates?limit=1',function(j){var n=total(j);if(n!=null)d.templates=n;end();});
    (same?getText:function(u,cb){cb('');})(O+'/sitemap-apps.xml',function(t){
      var L=locs(t,'/apps/');
      if(L&&L.length){d.hubs=L.length;end();return;}
      getJSON(O+CFG.api+'hubs?limit=1',function(j){var n=total(j);if(n!=null)d.hubs=n;end();});
    });
    (same?getText:function(u,cb){cb('');})(O+'/sitemap-guides.xml',function(t){
      var L=locs(t,'/guides/');
      if(L&&L.length){
        var old=DATA.guideList||[];
        for(var i=0;i<L.length;i++){var o=find(old,L[i].slug);if(o){L[i].name=o.name;L[i].cluster=o.cluster;}}
        d.guideList=L;d.guides=L.length;
      }
      end();
    });
    getJSON(O+CFG.api+'guides?limit=1&sort_field=Created%20Date&descending=true',function(j){
      var r=j&&j.response;
      if(r){if(d.guides==null)d.guides=total(j);var x=r.results&&r.results[0];if(x&&x['Created Date'])d.newestGuide=String(x['Created Date']).slice(0,10);}
      end();
    });
  }
  function refresh(origin,cb){
    fetchLive(origin==null?CFG.origin:origin,function(d){
      merge(d);DATA.live=true;DATA.asOf=new Date().toISOString().slice(0,10);
      lsSet('gx_rail3_data',{ts:Date.now(),d:d});
      render();if(cb)cb(d);
    });
  }
  function idle(fn){if(W.requestIdleCallback)W.requestIdleCallback(fn,{timeout:2500});else setTimeout(fn,600);}

  /* Onbellek (bayat da olsa) ilk cizimde kullanilir: sayilar sonradan "atlamasin".
     Taze degilse bos zamanda canlidan tazelenip yeniden cizilir. */
  function boot(){
    RAIL=mount();bind();guard();
    var c=lsGet('gx_rail3_data'),fresh=!!(c&&c.d&&Date.now()-(c.ts||0)<CFG.ttl);
    if(c&&c.d)merge(c.d);
    render();
    if(!W.GX_RAIL_NOLIVE&&!fresh)idle(function(){refresh(CFG.origin);});
  }
  W.GXRail={
    render:render,refresh:refresh,
    setPath:function(p){W.GX_RAIL_PATH=p;HERE={};MOPEN=null;drawer(false);render();},
    data:function(){return DATA;},config:CFG,facets:facets,guideType:guideType
  };
  /* Script ray iskeletinden SONRA gelir: govde varsa hemen basla (ilk boyada dogru ray). */
  if(D.body)boot();else D.addEventListener('DOMContentLoaded',boot);
})();
</script>
